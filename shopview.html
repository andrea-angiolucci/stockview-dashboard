<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0B6E7F">
<title>ShopView</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna centrale da iPad, barra superiore con navigazione, flusso a 5 passi con barra comandi fissa in basso. */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface2:#E3EAEE; --fg:#13232D; --muted:#566874; --line:#C9D4DA;
  --accent:#0B6E7F; --accent-fg:#FFFFFF; --accent-soft:#D6ECF0;
  --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#8F5600; --warn-soft:#FBEBCF; --bad:#B3362C; --bad-soft:#F9DEDA;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A20; --surface:#16252D; --surface2:#1F3039; --fg:#E6EEF2; --muted:#94A6B1; --line:#2C414C;
  --accent:#4FC1D3; --accent-fg:#06222A; --accent-soft:#17414A;
  --good:#5CC48B; --good-soft:#15382A; --warn:#E3A84B; --warn-soft:#3B2D12; --bad:#F2887E; --bad-soft:#42211E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A20; --surface:#16252D; --surface2:#1F3039; --fg:#E6EEF2; --muted:#94A6B1; --line:#2C414C;
  --accent:#4FC1D3; --accent-fg:#06222A; --accent-soft:#17414A;
  --good:#5CC48B; --good-soft:#15382A; --warn:#E3A84B; --warn-soft:#3B2D12; --bad:#F2887E; --bad-soft:#42211E; color-scheme:dark}
*{box-sizing:border-box}body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0}
.brand{font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:10px 18px;border-radius:9px;font-weight:600;color:var(--muted);min-height:44px}
.tabs button[aria-current="true"]{background:var(--surface);color:var(--fg)}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.banner button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:6px 12px;min-height:36px;font-weight:600;color:inherit}
h1{font-size:26px;line-height:1.2;margin:22px 0 6px;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);flex:1 1 200px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:17px}
input.bad,select.bad{border-color:var(--bad)}
.btn{min-height:56px;padding:12px 22px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{width:100%;min-height:120px;font-size:26px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.bars .track{grid-column:1 / -1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);border-radius:4px}
.bars .n{font-variant-numeric:tabular-nums;font-weight:600}
.empty{color:var(--muted);font-size:14px;margin:0}
.steps{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
.steps span,.steps button{border:0;font-family:inherit;cursor:pointer;flex:1 1 90px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 4px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.steps .on{background:var(--accent);color:var(--accent-fg)}
.steps .done{background:var(--accent-soft);color:var(--fg)}
.code{font-family:var(--mono);font-size:13px;color:var(--muted)}
ul.items{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.item h3{margin:0;font-size:17px}
.stock{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.pill{padding:3px 10px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:12px}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.liked[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.chip.disc[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.miss[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.sugg{display:grid;gap:6px;margin-top:8px}
.sugg button{text-align:left;min-height:48px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.opt{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] .k{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.opt.sq .k{border-radius:6px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.three .btn{min-height:92px;font-size:20px}
.three .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.consent{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.consent p{margin:0;font-size:15px}
.yn{display:flex;gap:8px}
.yn .chip{min-width:84px}
canvas.sig{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);touch-action:none;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.nav .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nav .in>div{display:flex;gap:10px;flex-wrap:wrap}
.missing{font-size:13px;color:var(--warn);margin:14px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}
dl.sum{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.sum dt{color:var(--muted);font-size:14px}
dl.sum dd{margin:0;font-weight:600}
.hist{display:grid;gap:10px;margin-top:14px}
.hist .h{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:14px}
textarea.out{min-height:140px;font-family:var(--mono);font-size:12px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.opt{transition:background .12s,border-color .12s}}
</style></head><body>
<div class="wrap" id="root"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY="registro_sole_beta_v1";
const STORES=["Catania","Portali","Acireale","Viale Africa","Augusta","Giarre","Lentini","Paternò"];
const CAT=[].concat([].map(a=>({b:a[0],m:a[1],mod:a[2],c:a[3],cal:a[4],st:a[5]})));
const SB="https://exrlurfvydxrqfzjdobp.supabase.co",SBK="sb_publishable_0mNbCOZLSV-ug9iJ9jLrNA_RabyY_LM";
const sb=supabase.createClient(SB,SBK);
let LIVE=null,LASTERR="";
async function rpc(fn,args){const{data,error}=await sb.rpc(fn,args);if(error){LASTERR=String(error.message||error).slice(0,90);throw new Error(LASTERR)}return data||[]}
function setLive(v){LIVE=v;const e=$("#live");if(e){e.textContent=v===null?"Verifico il collegamento all'anagrafica…":v===true?"Anagrafica collegata (dati reali di giacenza)":v===false?"Anagrafica non raggiungibile ("+LASTERR+")":"";e.className="pill "+(v===true?"ok":"warn")}}
async function pingLive(){setLive(null);try{await rpc("ci_lookup_barcode",{p_barcode:"000000"});setLive(true)}catch(e){setLive(false)}}
async function lookupCode(t){
  try{const rows=await rpc("ci_lookup_barcode",{p_barcode:t});setLive(true);
    if(!rows.length)return null;const r0=rows[0],names=STORES.concat(["Deposito"]);
    return{b:r0.barcode,m:r0.marchio,mod:r0.modello,c:r0.colore||"",cal:r0.calibro||"",tipo:r0.tipo_lenti,st:names.map(n=>{const x=rows.find(r=>r.filiale===n);return x?x.disponibili:0})}}
  catch(e){setLive(false);return CAT.find(x=>x.b===t)||null}}
const SELLERS={"Acireale":["CAU","MCG","GGR","CPR","FAP","ANA","ASC"],"Augusta":["LGU","LTE","FAP","FCA","EMA"],"Catania":["ANL","VEM","FRP","GVI","ORM","FRS","ASC","VLI","ACA","DCO","ADA","SAM","MCG","SAD","FCA"],"Giarre":["VEZ","MGI","OLE","MCG"],"Lentini":["EMA","FCA","FAP"],"Paternò":["FCA","VLI","FAP"],"Portali":["SEU","CAF","YSI","GCO","ALT","FRA","ASC","FAP","OLE","MCG","FCA","GVI","LTE"],"Viale Africa":["DCO","VSC","MAA"]};
const MOTIVI=["Prezzo troppo alto","Modello o colore desiderato non disponibile qui","Disponibile altrove o in arrivo, non ha voluto aspettare","Nessun modello gli è piaciuto","Sta solo guardando / tornerà","Cercava un marchio che non trattiamo","Vestibilità o taglia non adatta","Altro / non so"];
const PERV=["Passaparola","Familiare già cliente","Convenzione","Oculista / medico","Google","Social","Sito / prenotazione online","Passaggio / vetrina","Evento / sponsorizzazione","Pubblicità","Non ricorda / altro"];
const STATI=[["provato","Provato",""],["piaciuto","Piaciuto","liked"],["scartato","Scartato","disc"],["nondisp","Richiesto, non disponibile","miss"]];
const STEPS=["Articoli","Preventivo","Esito","Assistenza","Chiusura"];
const CONSENSI=[
["c1","Dati di natura particolare (art. 9), comprese le abitudini visive e i disturbi che avverto"],
["c2","Essere contattato/a per newsletter, aggiornamenti e novità (posta, e-mail, SMS, telefono, messaggistica)"],
["c3","Profilazione e invio di offerte personalizzate"],
["c4","Registrare i miei dati di consulenza per una consulenza personalizzata nel tempo"]];

let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
let DB=load()||{settings:{store:"Catania",seller:""},log:[],clients:[],seeded:false};
function save(){mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const $=s=>document.querySelector(s);

function seedDemo(){
  let x=7;const r=n=>{x=(x*1103515245+12345)%2147483648;return x%n};
  const now=Date.now();
  for(let i=0;i<30;i++){
    const n=1+r(3),items=[];
    for(let k=0;k<n;k++){const it=CAT[r(CAT.length)];items.push({b:it.b,label:it.m+" "+it.mod,stato:["provato","piaciuto","scartato","provato","piaciuto","nondisp"][r(6)]})}
    const e=["acquistato","nonacq","nonacq","torna"][r(4)];
    DB.log.push({id:"d"+i,ts:new Date(now-r(10*86400000)).toISOString(),store:STORES[r(3)],seller:"Esempio",durata:14+r(26),items,esito:e,
      motivo:e==="nonacq"?MOTIVI[[0,0,0,1,1,2,3,4,6,7][r(10)]]:null,assistenza:r(3)===0,demo:true});
  }
  DB.log.sort((a,b)=>a.ts<b.ts?1:-1);DB.seeded=true;save();
}
DB.seeded=true;

let input_t=null;
let S={view:"home",step:0,d:null,confirmCancel:false,sugg:[]};
function newDraft(){return{id:"i"+Date.now()+"-"+Math.random().toString(36).slice(2,6),start:Date.now(),items:[],prev:{prezzo:"",sconto:"",foto:""},esito:null,acq:[],motivo:null,nota:"",
  ass:null,cl:{cognome:"",nome:"",nascita:"",cell:"",nocell:false,email:"",nomail:false,ind:"",citta:"",cap:"",perv:"",sesso:"",cf:"",gen:"",gencog:""},cons:{},firma:false}}

function stockOf(it,store){const i=STORES.indexOf(store);return it.st[i]}
function otherStock(it,store){
  const out=[];STORES.forEach((s,i)=>{if(s!==store&&it.st[i]>0)out.push(s+" "+it.st[i])});
  if(it.st[8]>0)out.push("Deposito "+it.st[8]);return out}

const SUM={data:null,err:""};
function stats(){const d=SUM.data||{};return{t:{tot:d.tot||0,acq:d.acq||0,non:d.non||0,tor:d.tor||0},mot:d.mot||[],prov:d.prov||[],piac:d.piac||[],scar:d.scar||[]}}
async function loadSummary(){
  if(!ME)return;
  try{SUM.data=await sb.rpc("ci_riepilogo",{p_filiale:meCode()||null,p_giorni:30,p_venditore:DB.settings.seller||null}).then(r=>{if(r.error)throw r.error;return r.data});SUM.err=""}
  catch(e){SUM.err=String((e&&e.message)||e).slice(0,80)}
  if(S.view==="home")render()}
const CRON={list:null,err:""};
async function loadCron(){
  try{const r=await sb.rpc("ci_cronologia",{p_filiale:meCode()||null,p_limit:60,p_venditore:DB.settings.seller||null});if(r.error)throw r.error;CRON.list=r.data||[];CRON.err=""}
  catch(e){CRON.err=String((e&&e.message)||e).slice(0,80);if(CRON.list===null)CRON.list=[]}
  if(S.view==="storico")render()}
// coda di invio: l'interazione resta sul dispositivo finché il server non conferma
let FLUSH=false;
function outN(){return(DB.outbox||[]).length}
async function flushOutbox(){
  if(FLUSH||!ME||!outN())return;FLUSH=true;let sent=0;
  try{for(const pl of [...DB.outbox]){
      const{error}=await sb.rpc("ci_interazione_salva",{p:pl});
      if(error){pl.err=String(error.message||error).slice(0,80);save();break}
      DB.outbox=DB.outbox.filter(x=>x.id!==pl.id);sent++;save()}}
  catch(e){}
  FLUSH=false;
  if(sent){loadSummary();if(S.view==="storico")loadCron()}
  if(S.view==="home"||S.view==="storico")render()}
function barList(rows,max){
  if(!rows.length)return'<p class="empty">Ancora nessun dato.</p>';
  const m=max||rows[0][1];
  return'<ul class="bars">'+rows.map(([k,v])=>`<li><span>${esc(k)}</span><span class="n">${v}</span><div class="track"><div class="fill" style="width:${Math.round(v/m*100)}%"></div></div></li>`).join("")+"</ul>"}

function header(){
  const demo=DB.log.some(e=>e.demo);
  return`<div class="top"><div class="brand"><small>ShopView · beta</small>Registro Sole non graduato</div>
  <button class="btn ghost" data-a="logout" style="min-height:40px;padding:6px 14px;font-size:14px" aria-label="Esci dall'account">Esci</button>
  ${S.view==="home"||S.view==="storico"||S.view==="richieste"?`<div class="tabs" role="tablist"><button data-a="go" data-v="home" aria-current="${S.view==="home"}">Avvio</button><button data-a="go" data-v="richieste" aria-current="${S.view==="richieste"}">Richieste${R.in?" ("+R.in+")":""}</button><button data-a="go" data-v="storico" aria-current="${S.view==="storico"}">Cronologia</button></div>`:""}</div>
  ${demo&&(S.view==="home"||S.view==="storico")?`<div class="banner"><span>Dati di esempio: servono a vedere come si presenta il riepilogo. Restano solo su questo iPad.</span><button data-a="cleardemo">Svuota esempi</button></div>`:""}`}

function vHome(){
  const s=stats(),pc=n=>s.t.tot?Math.round(n/s.t.tot*100)+"%":"0%";
  return`${header()}
  ${outN()?`<div class="banner" style="margin-top:14px"><span><b>${outN()}</b> interazion${outN()>1?"i":"e"} in attesa di invio: si inviano appena torna la connessione. Non chiudere e non cancellare i dati del browser.</span><button data-a="flush">Invia ora</button></div>`:""}
  ${R.in?`<div class="banner" style="margin-top:14px"><span><b>${R.in}</b> richiest${R.in>1?"e":"a"} di ricircolo da evadere per ${esc(DB.settings.store)}</span><button data-a="go" data-v="richieste">Apri</button></div>`:""}
  <div class="card" style="margin-top:14px">
   <div style="font-size:22px;font-weight:700">Ciao ${esc(ME?ME.name:"")}</div>
   ${ME&&ME.filiale?`<div class="row" style="margin-top:10px;align-items:center;flex-wrap:nowrap">
     <div style="flex:1;min-width:0"><div class="hint" style="margin:0">Punto vendita</div><div style="font-size:22px;font-weight:700">${esc(DB.settings.store)}</div>${ME.temp?`<span class="pill warn">temporaneo, solo oggi</span>`:""}</div>
     <button class="btn" data-a="chgstore" style="flex:none">Modifica</button></div>
    ${S.chg?`<label class="f" style="margin-top:10px">Oggi lavoro a<select id="set-store">${STORES.map(x=>`<option${x===DB.settings.store?" selected":""}>${x}</option>`).join("")}</select></label>${ME.temp?`<div style="margin-top:8px"><button class="btn" data-a="homestore">Torna a ${esc(ME.filiale)}</button></div>`:""}`:""}`
   :`<div class="row" style="margin-top:10px"><label class="f">Filiale<select id="set-store">${STORES.map(x=>`<option${x===DB.settings.store?" selected":""}>${x}</option>`).join("")}</select></label></div>`}
   ${ME&&ME.focus?`<p class="hint" style="margin-top:10px">Venditore: <b>${esc(ME.focus)}</b></p>`:`<div class="row" style="margin-top:10px"><label class="f">Venditore (codice FOCUS)<select id="set-seller" data-f="settings.seller"><option value="">— scegli —</option>${(SELLERS[DB.settings.store]||[]).map(x=>`<option${x===DB.settings.seller?" selected":""}>${x}</option>`).join("")}</select></label></div>`}
  </div>
  <div style="margin:16px 0"><button class="btn primary big" data-a="start">Sole non graduato</button></div>

function hhmm(t){try{return new Date(t).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
async function loadReq(){
  try{const d7=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
    const{data,error}=await sb.from("ricircoli_richieste").select("id,creato_il,barcode,marchio,modello,colore,calibro,filiale_da,filiale_a,stato,trovato_il,richiesta_id,tentativo,venditore,riferimento_cliente,coda,esaurita").or("stato.in.(pending,trovato),creato_il.gt."+d7).order("creato_il",{ascending:false}).order("tentativo",{ascending:false}).limit(100);
    if(error)throw error;R.list=data||[];R.err=""}
  catch(e){R.err=String((e&&e.message)||e).slice(0,100);if(R.list===null)R.list=[]}
  const me=meCode();R.in=(R.list||[]).filter(r=>r.filiale_da===me&&r.stato==="pending").length;
  if(S.view==="home"||S.view==="richieste")render()}
async function ricQueue(it){return rpc("ci_coda",{p_barcode:it.cat.b,p_filiale:meCode()})}
function ricBlock(it,i){
  const c=it.cat;if(!c)return"";
  const qui=stockOf(c,DB.settings.store),o=otherStock(c,DB.settings.store);
  if(it.req)return`<div class="stock"><span class="pill ok">Richiesta inviata a ${esc(nomeF(it.req.a))} · in attesa di conferma</span></div>`;
  if(qui>0)return"";
  if(!o.length)return`<div class="stock"><span class="pill no" style="background:#3a1d22;color:#ff8f8f">Non disponibile in nessun negozio</span></div><p class="hint">Questo codice non risulta in giacenza in nessuna filiale.</p>`;
  const r=it.ric;
  if(!r)return`<div style="margin-top:10px"><button class="btn" data-a="ricq" data-i="${i}">Chiedi il pezzo a un altro negozio</button></div>`;
  if(r.loading)return'<p class="hint">Calcolo a chi chiedere…</p>';
  if(r.err)return`<p class="hint">Errore: ${esc(r.err)}</p><button class="btn" data-a="ricq" data-i="${i}">Riprova</button>`;
  const q=r.q;if(!q.length)return'<p class="hint">Nessun altro negozio ha il pezzo disponibile.</p>';
  return`<div class="card" style="margin-top:10px;padding:12px"><b>Verrà chiesto a ${esc(nomeF(q[0].codice))}</b>${q.length>1?`, poi: ${q.slice(1).map(x=>esc(nomeF(x.codice))).join(", ")}`:""}.
   <p class="hint">Ordine: prima il deposito, poi chi vende meno ${esc(c.m)} negli ultimi 12 mesi, a parità chi vende meno questo modello. ${q.map(x=>esc(nomeF(x.codice))+": "+x.vm+" del marchio, "+x.vmod+" del modello").join(" · ")}</p>
   <label class="f" style="margin-top:8px">Per chi è il pezzo? Riferimento cliente (obbligatorio)<input type="text" data-rif="${i}" value="${esc(r.rif||"")}" placeholder="es. cognome e nome del cliente" autocomplete="off"></label>
   <div class="row" style="margin-top:8px"><button class="btn primary" data-a="ricok" data-i="${i}">Invia richiesta</button><button class="btn" data-a="ricno" data-i="${i}">Annulla</button></div></div>`}
async function ricSend(i){
  const it=S.d.items[i],q=it.ric.q.map(x=>x.codice),first=q[0],c=it.cat,rif=String(it.ric.rif||"").trim();
  if(rif.length<2){toast("Scrivi il riferimento cliente: serve ai negozi per sapere per chi è il pezzo");return}
  it.ric={loading:true};renderItems();
  try{const{data,error}=await sb.rpc("ci_richiesta_invia",{p_barcode:c.b,p_coda:q,p_rif:rif,p_venditore:DB.settings.seller||"",p_inter:S.d.id,p_filiale_a:meCode()});
    if(error)throw error;
    it.req={id:data,a:first};it.ric=null;toast("Richiesta inviata a "+nomeF(first));loadReq()}
  catch(e){it.ric={err:String((e&&e.message)||e).slice(0,100)}}
  renderItems()}
async function reqAct(act,id){
  id=uid(id);if(!id)return;const r=(R.list||[]).find(x=>x.id===id);if(!r)return;
  try{const{error}=await sb.rpc("ci_richiesta_azione",{p_id:id,p_act:act});if(error)throw error;
    toast(act==="not"?((r.coda||[]).length?"Richiesta passata a "+nomeF(r.coda[0]):"Nessun altro negozio: richiesta esaurita"):"Aggiornato")}
  catch(e){toast("Errore: "+String((e&&e.message)||e).slice(0,60))}
  loadReq()}
function badgeR(r){
  const dd=t=>{try{return new Date(t).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"})}catch(e){return""}};
  if(r.stato==="trovato"){let ov=false;try{const d=new Date(r.trovato_il),n=new Date();d.setHours(0,0,0,0);n.setHours(0,0,0,0);ov=d<n}catch(e){}
    return`<span class="pill ${ov?"no":"warn"}">In trasferimento${r.trovato_il?" dal "+dd(r.trovato_il):""}</span>`}
  if(r.stato==="non_trovato")return`<span class="pill no">${r.esaurita?"Non trovato in nessun negozio":"Non trovato"}</span>`;
  if(r.stato==="trasferito")return'<span class="pill ok">Trasferito</span>';
  if(r.stato==="annullato")return'<span class="pill">Annullata</span>';
  return'<span class="pill warn">In attesa</span>'}
function vRichieste(){
  const me=meCode(),L=R.list;
  const by={};(L||[]).forEach(r=>{(by[r.richiesta_id]=by[r.richiesta_id]||[]).push(r)});
  const chains=Object.values(by).map(a=>a.sort((x,y)=>y.tentativo-x.tentativo));
  const card=(a,btns)=>{const r=a[0],past=a.slice(1).filter(x=>x.stato==="non_trovato");
    return`<div class="card" style="margin-top:10px"><b>${esc(r.marchio)} ${esc(r.modello)}</b><br><span class="code">${esc(r.barcode)} · ${esc(r.colore||"")} · cal. ${esc(r.calibro||"")}</span>
    <p style="margin:6px 0 0">Per: <b>${esc(r.riferimento_cliente||"—")}</b></p><p class="hint" style="margin:6px 0">Da <b>${esc(nomeF(r.filiale_da))}</b> a <b>${esc(nomeF(r.filiale_a))}</b>${r.venditore?" · richiesta di "+esc(r.venditore):""} · ${hhmm(a[a.length-1].creato_il)}${past.length?" · già non trovato in "+past.map(t=>esc(nomeF(t.filiale_da))).join(", "):""}</p>
    ${badgeR(r)}<div class="row" style="margin-top:10px">${btns}</div></div>`};
  let inc="",mine="",oth="",nInc=0;
  chains.forEach(a=>{const r=a[0];
    const btn=(act,t,cl)=>`<button class="btn ${cl||""}" data-a="req" data-act="${act}" data-id="${esc(r.id)}">${t}</button>`;
    if(r.filiale_da===me&&r.stato==="pending"){nInc++;inc+=card(a,btn("conf","✓ Trovato","primary")+btn("not","✗ Non trovato"))}
    else if(r.filiale_da===me&&r.stato==="trovato")inc+=card(a,"");
    else if(r.filiale_a===me)mine+=card(a,(r.stato==="trovato"?btn("arr","Arrivato","primary"):"")+(["pending","trovato"].includes(r.stato)?btn("ann","Annulla richiesta"):""));
    else if(a.some(x=>x.filiale_da===me)){}
    else oth+=card(a,"")});
  return`${header()}
  <h1>Richieste di ricircolo</h1><p class="lead">Negozio selezionato: <b>${esc(DB.settings.store)}</b>. Per vedere un altro negozio cambia la filiale in Avvio.</p>
  ${R.err?`<p class="hint">Errore di lettura: ${esc(R.err)}</p>`:""}${L===null?'<p class="hint">Carico…</p>':""}
  <h2 style="margin-top:18px">Da evadere per ${esc(DB.settings.store)} (${nInc})</h2>${inc||'<p class="empty">Nessuna richiesta da evadere.</p>'}
  <h2 style="margin-top:22px">Richieste fatte da ${esc(DB.settings.store)}</h2>${mine||'<p class="empty">Nessuna richiesta.</p>'}
  ${oth?`<h2 style="margin-top:22px">Altri negozi</h2>${oth}`:""}`}
async function addFromText(raw){
  const t=raw.trim();if(!t)return;
  if(/^[0-9]{6,}$/.test(t)){
    toast("Cerco il codice…");
    const f=await lookupCode(t);
    if(f)addItem({b:f.b,label:f.m+" "+f.mod,cat:f,stato:"provato"});
    else{addItem({b:t,label:"Codice "+t,nc:true,stato:"provato"});toast("Codice non trovato in anagrafica: registrato lo stesso")}
    return}
  toast("Inserisci un barcode oppure usa la ricerca guidata");$("#code")&&$("#code").focus()}
function search(t){const q=t.toLowerCase();return CAT.filter(x=>(x.m+" "+x.mod+" "+x.c).toLowerCase().includes(q)).slice(0,5)}

function set(path,val){const p=path.split(".");let o=p[0]==="settings"?DB:S;
  for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}

const VAR={base:null,res:null,err:"",fc:[],fk:[]};
function resetSearch(){Object.assign(G,{tipo:"sole",forn:"",marc:"",fq:"",mq:"",fopen:false,mopen:false,q:"",forns:null,marcs:null,res:null,info:""});Object.assign(VAR,{base:null,res:null,err:"",fc:[],fk:[]});S.sugg=[]}
async function varLoad(){
  const b=VAR.base;VAR.res=null;VAR.err="";
  try{const rows=await rpc("ci_varianti",{p_barcode:b.b});
    const names=STORES.concat(["Deposito"]),map=new Map();
    rows.forEach(r=>{let it=map.get(r.barcode);if(!it){it={b:r.barcode,m:b.m,mod:b.mod,c:r.colore||"",cal:r.calibro||"",tipo:b.tipo,st:names.map(()=>0)};map.set(r.barcode,it)}
      const i=names.indexOf(r.filiale);if(i>=0)it.st[i]=r.disp});
    VAR.res=[...map.values()]}
  catch(e){VAR.res=[];VAR.err=String((e&&e.message)||e).slice(0,120)}
  if(S.view==="varianti")render()}
function vVarianti(){
  const b=VAR.base,st=DB.settings.store,si=STORES.indexOf(st),names=STORES.concat(["Deposito"]);
  const top=`${header()}<div class="row" style="margin-top:14px"><button class="btn" data-a="vback">‹ Indietro</button></div>
   <h1>Varianti</h1><p class="lead"><b>${esc(b.m)} ${esc(b.mod)}</b><br><span class="code">Articolo scelto: ${esc(b.c)} · cal. ${esc(b.cal)}</span></p>`;
  if(VAR.res===null)return top+'<p class="hint">Carico le varianti…</p>';
  if(VAR.err)return top+`<p class="hint">Errore: ${esc(VAR.err)}</p><button class="btn" data-a="var" data-i="-1">Riprova</button>`;
  const uniq=k=>{const m=new Map();VAR.res.forEach(x=>m.set(x[k],(m.get(x[k])||0)+1));return[...m.entries()].sort((a,z)=>String(a[0]).localeCompare(String(z[0]),"it",{numeric:true}))};
  const chips=(k,fk,arr)=>arr.map(([v,n])=>`<button class="chip" aria-pressed="${arr_has(fk,v)}" data-a="vtog" data-k="${k}" data-v="${esc(v)}">${esc(v||"—")} <span class="code">${n}</span></button>`).join(" ");
  const arr_has=(a,v)=>a.includes(v);
  const fl=VAR.res.filter(x=>(!VAR.fc.length||VAR.fc.includes(x.c))&&(!VAR.fk.length||VAR.fk.includes(x.cal)));
  const tot=x=>x.st.reduce((a,c)=>a+c,0);
  fl.sort((a,z)=>((z.st[si]>0)-(a.st[si]>0))||(tot(z)-tot(a))||String(a.c).localeCompare(String(z.c),"it",{numeric:true})||String(a.cal).localeCompare(String(z.cal),"it",{numeric:true}));
  const row=x=>`<button data-a="vadd" data-b="${esc(x.b)}"><b>${esc(x.c)}</b> <span class="code">· cal. ${esc(x.cal)}</span><br><span class="pill ${x.st[si]>0?"ok":"no"}">${esc(st)} ${x.st[si]||0}</span> ${names.map((n,k)=>k!==si&&x.st[k]>0?`<span class="pill">${esc(n)} ${x.st[k]}</span>`:"").join(" ")}</button>`;
  const qui=fl.filter(x=>x.st[si]>0),altri=fl.filter(x=>!(x.st[si]>0));
  const sec=(t,l)=>l.length?`<h2 style="margin-top:16px">${t} (${l.length})</h2><div class="sugg">${l.slice(0,100).map(row).join("")}</div>`:"";
  return top+(VAR.res.length?`<div class="card"><h2>Colore</h2><div class="chips">${chips("c",VAR.fc,uniq("c"))}</div>
   <h2 style="margin-top:14px">Calibro</h2><div class="chips">${chips("k",VAR.fk,uniq("cal"))}</div>
   ${VAR.fc.length||VAR.fk.length?'<div style="margin-top:12px"><button class="btn" data-a="vclr">Azzera filtri</button></div>':""}</div>
   ${sec("Disponibili in "+esc(st),qui)}${sec("Solo in altri negozi",altri)}${fl.length?"":'<p class="hint">Nessuna variante con questi filtri.</p>'}
   <p class="hint">Tocca una variante per aggiungerla agli articoli.</p>`:'<p class="hint">Nessun\'altra variante di questo modello in giacenza.</p>')}
const VIEWS={home:vHome,storico:vStorico,richieste:vRichieste,varianti:vVarianti};
function render(){
  let h;
  if(S.view==="flow")h=[vArticoli,vPreventivo,vEsito,vAssist,vChiusura][S.step]()+nav();
  else h=VIEWS[S.view]();
  const y=window.scrollY,sig=S.view+":"+S.step,same=S.last===sig;S.last=sig;
  $("#root").innerHTML=h;
  after();window.scrollTo(0,same?y:0)}
function after(){
  if(S.view==="flow"){
    if(S.step===0){renderItems();const c=$("#code");c&&c.focus();if(LIVE===null)pingLive();else setLive(LIVE);gInit()}
    if(S.step===1){const f=$("#foto");f&&f.addEventListener("change",async()=>{const fl=f.files[0];S.d.prev.foto=fl?fl.name:"";S.d.prev.fotoData="";const inf=$("#fotoinfo");if(!fl){inf.textContent="";return}inf.textContent="Preparo la foto…";try{S.d.prev.fotoData=await shrinkFoto(fl);inf.textContent="Foto acquisita: "+fl.name+" (si cancella dopo 3 mesi)"}catch(e){S.d.prev.foto="";inf.textContent="Foto non leggibile: riprova o salta"}})}
    if(S.step===3&&S.d.ass==="si")initSig();
    updateNav()}}

function initSig(){
  const cv=$("#sig");if(!cv)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  g.lineWidth=2.4;g.lineCap="round";g.strokeStyle=getComputedStyle(document.body).color;
  let down=false,lx=0,ly=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{down=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId)});
  cv.addEventListener("pointermove",e=>{if(!down)return;const[x,y]=pos(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;if(!S.d.firma){S.d.firma=true;updateNav()}});
  if(S.d.sigData){const img=new Image();img.onload=()=>g.drawImage(img,0,0,w,h);img.src=S.d.sigData}
  const up=()=>{if(down){try{S.d.sigData=cv.toDataURL()}catch(er){}}down=false};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up)}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,v=b.dataset.v,d=S.d;
  if(a==="go"){S.view=v;S.confirmWipe=false;render();if(v==="richieste"||v==="home")loadReq();if(v==="home")loadSummary();if(v==="storico"){CRON.list=null;loadCron()}}
  else if(a==="ricq"){const it=d.items[+b.dataset.i];it.ric={loading:true};renderItems();ricQueue(it).then(q=>{it.ric={q};renderItems()}).catch(e=>{it.ric={err:String((e&&e.message)||e).slice(0,100)};renderItems()})}
  else if(a==="ricok"){ricSend(+b.dataset.i)}
  else if(a==="ricno"){d.items[+b.dataset.i].ric=null;renderItems()}
  else if(a==="req"){reqAct(b.dataset.act,b.dataset.id)}
  else if(a==="chgstore"){S.chg=!S.chg;render()}
  else if(a==="homestore"){DB.settings.store=ME.filiale;setOvr(ME.filiale);save();S.chg=false;render();loadReq();loadSummary()}
  else if(a==="flush"){flushOutbox()}
  else if(a==="logout"){sb.auth.signOut().then(()=>location.reload())}
  else if(a==="start"){resetSearch();S.d=newDraft();S.view="flow";S.step=0;S.confirmCancel=false;render()}
  else if(a==="add"){const c=$("#code");addFromText(c.value)}
  else if(a==="gsel"){
    if(b.dataset.k==="f"){G.forn=v;G.fq="";G.fopen=false;G.marc="";G.mq="";G.marcs=null;G.res=null;$("#g-fq").value=v;$("#g-mq").value="";$("#g-fq").blur();gLoadMarcs()}
    else{G.marc=v;G.mq="";G.mopen=false;$("#g-mq").value=v;$("#g-mq").blur();gLoadRes()}}
  else if(a==="gpick"){const x=(G.res||[]).find(y=>y.b===b.dataset.b);if(x)addItem({b:x.b,label:x.m+" "+x.mod,cat:x,stato:"provato"})}
  else if(a==="pick"){const bc=b.dataset.b;lookupCode(bc).then(x=>{if(x)addItem({b:x.b,label:x.m+" "+x.mod,cat:x,stato:"provato"});else toast("Articolo non trovato")})}
  else if(a==="var"){if(+b.dataset.i>=0){const c=d.items[+b.dataset.i].cat;VAR.base=c;VAR.fc=[];VAR.fk=[]}S.view="varianti";varLoad();render()}
  else if(a==="vtog"){const k=b.dataset.k=="c"?"fc":"fk",l=VAR[k],j=l.indexOf(v);if(j>=0)l.splice(j,1);else l.push(v);render()}
  else if(a==="vclr"){VAR.fc=[];VAR.fk=[];render()}
  else if(a==="vback"){S.view="flow";render()}
  else if(a==="vadd"){const x=(VAR.res||[]).find(y=>y.b===b.dataset.b);if(x){d.items.push({b:x.b,label:x.m+" "+x.mod,cat:x,stato:"provato"});S.view="flow";S.sugg=[];render();toast("Aggiunto: "+x.c+" cal. "+x.cal)}}
  else if(a==="del"){const it=d.items[+b.dataset.i];if(it.req)toast("Richiesta già inviata: non si può rimuovere");else{it.cd=true;renderItems()}}
  else if(a==="delno"){d.items[+b.dataset.i].cd=false;renderItems()}
  else if(a==="delyes"){const i=+b.dataset.i;d.items.splice(i,1);d.acq=d.acq.filter(x=>x!==i).map(x=>x>i?x-1:x);renderItems();updateNav();toast("Articolo rimosso")}
  else if(a==="stato"){d.items[+b.dataset.i].stato=v;renderItems()}
  else if(a==="esito"){d.esito=v;render()}
  else if(a==="acq"){const i=+b.dataset.i;d.acq=d.acq.includes(i)?d.acq.filter(x=>x!==i):d.acq.concat(i);render()}
  else if(a==="motivo"){d.motivo=MOTIVI[+b.dataset.i];render()}
  else if(a==="ass"){d.ass=v;render()}
  else if(a==="nocell"){d.cl.nocell=!d.cl.nocell;if(d.cl.nocell)d.cl.cell="";render()}
  else if(a==="nomail"){d.cl.nomail=!d.cl.nomail;if(d.cl.nomail)d.cl.email="";render()}
  else if(a==="cons"){d.cons[b.dataset.k]=v;render()}
  else if(a==="clearsig"){d.firma=false;d.sigData=null;render()}
  else if(a==="goto"){S.step=+b.dataset.i;S.confirmCancel=false;render()}
  else if(a==="next"){S.step++;S.confirmCancel=false;render()}
  else if(a==="back"){S.step--;S.confirmCancel=false;render()}
  else if(a==="cancel"){if(S.confirmCancel){resetSearch();S.view="home";S.d=null;S.confirmCancel=false;render()}else{S.confirmCancel=true;render()}}
  else if(a==="finish")finish();
  else if(a==="cleardemo"){DB.log=DB.log.filter(x=>!x.demo);save();render()}
  else if(a==="export"){$("#exp").innerHTML='<textarea class="out" id="expt" readonly style="margin-top:12px"></textarea><div style="margin-top:8px"><button class="btn" data-a="copy">Copia</button></div>';$("#expt").value=JSON.stringify(DB.log.filter(x=>!x.demo),null,1)}
  else if(a==="copy"){const t=$("#expt");t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Copiato"),()=>toast("Seleziona e copia a mano"))}catch(er){toast("Seleziona e copia a mano")}}
  else if(a==="wipe"){if(S.confirmWipe){DB.log=[];DB.clients=[];save();S.confirmWipe=false;render()}else{S.confirmWipe=true;render()}}
  if(S.view==="flow"&&S.step!==undefined&&["stato","pick"].includes(a))updateNav()});
function initSigReset(){render()}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.rif!==undefined){const x=S.d&&S.d.items[+t.dataset.rif];if(x&&x.ric)x.ric.rif=t.value;return}
  if(t.id==="g-q"){G.q=t.value;gDraw();return}
  if(t.id==="g-fq"){G.fq=t.value;G.fopen=true;if(G.forn){G.forn="";G.marc="";G.mq="";$("#g-mq").value="";G.marcs=null;G.res=null;gLoadMarcs()}else gDraw();return}
  if(t.id==="g-mq"){G.mq=t.value;G.mopen=true;if(G.marc){G.marc="";G.res=null}gDraw();return}
  if(t.id==="code"){const v=t.value.trim();
    return}
  if(t.dataset&&t.dataset.f){
    let val=t.value;if(t.dataset.f==="d.cl.cf")val=val.toUpperCase();
    set(t.dataset.f,val);if(t.dataset.f.startsWith("settings"))save();
    if(t.id==="cell"){const n=val.replace(/\s/g,""),el=$("#dup");
      if(el){el.textContent="";if(n.length>=8){clearTimeout(window.__dupT);window.__dupT=setTimeout(async()=>{try{const r=await sb.rpc("ci_cliente_esiste",{p_cell:n});const e2=$("#dup");if(e2&&!r.error&&r.data===true)e2.textContent="Esiste già un cliente con questo cellulare: controlla prima di creare una nuova scheda."}catch(e){}},400)}}}
    if(S.view==="flow")updateNav()}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="g-tipo"){G.tipo=t.value;G.forn="";G.marc="";G.fq="";G.mq="";G.forns=null;G.marcs=null;G.res=null;$("#g-fq").value="";$("#g-mq").value="";gInit();return}
  if(t.id==="set-store"){DB.settings.store=t.value;if(!(ME&&ME.focus))DB.settings.seller="";if(ME&&ME.filiale)setOvr(t.value);save();S.chg=false;render();loadReq();loadSummary();return}
  if(t.dataset&&t.dataset.f){set(t.dataset.f,t.value);if(t.dataset.f.startsWith("settings"))save();if(t.dataset.f==="settings.seller")loadSummary();if(t.id==="nascita"||t.tagName==="SELECT"&&S.view==="flow"&&S.step===3){render()}else if(S.view==="flow")updateNav()}});
document.addEventListener("focusin",e=>{const t=e.target;
  if(t.id==="g-fq"){G.fopen=true;gDraw()}else if(t.id==="g-mq"){G.mopen=true;gDraw()}});
document.addEventListener("keydown",e=>{
  if(e.target.id==="code"&&e.key==="Enter"){e.preventDefault();addFromText(e.target.value)}});

function finish(){
  const d=S.d,secs=Math.round((Date.now()-d.start)/1000);
  const pl={id:d.id,inizio:new Date(d.start).toISOString(),filiale:meCode(),venditore:DB.settings.seller||"",durata:secs,esito:d.esito,motivo:d.motivo,nota:d.nota,
    prezzo:d.prev.prezzo,sconto:d.prev.sconto,assistenza:d.ass==="si",informativa:"bozza-beta",
    items:d.items.map((i,ix)=>({b:i.b,label:i.label,stato:i.stato,nc:!!i.nc||!i.cat,acq:d.acq.includes(ix),req:(i.req&&i.req.id)||null})),
    foto:d.prev.fotoData||null};
  if(d.ass==="si"){pl.cliente=Object.assign({},d.cl);pl.consensi=d.cons;pl.firma=d.sigData||null}
  DB.outbox=(DB.outbox||[]).concat([pl]);save();
  resetSearch();S.view="home";S.d=null;render();toast("Interazione registrata in "+secs+" secondi");
  flushOutbox()}


let ME=null,TIMER=null;
const OVK="shopview_negozio_oggi";
const oggi=()=>new Date().toLocaleDateString("sv-SE");
function getOvr(){try{const o=JSON.parse(localStorage.getItem(OVK)||"null");if(o&&o.d===oggi()&&STORES.includes(o.s))return o.s}catch(e){}return null}
function setOvr(st){try{if(!ME||st===ME.filiale)localStorage.removeItem(OVK);else localStorage.setItem(OVK,JSON.stringify({s:st,d:oggi()}))}catch(e){}ME.temp=!!(ME&&ME.filiale&&st!==ME.filiale)}
function chkOvr(){if(!ME||!ME.filiale)return false;const o=getOvr(),st=o||ME.filiale;ME.temp=!!o;if(st!==DB.settings.store){DB.settings.store=st;save();return true}return false}
function nomeDa(md,email){const n=String(md.full_name||md.name||md.nome||"").trim().split(/\s+/)[0];const t=n||String(email||"").split("@")[0].split(/[._-]/)[0];return t?t.charAt(0).toUpperCase()+t.slice(1).toLowerCase():""}
function msgView(t,body){$("#root").innerHTML=`<div style="max-width:420px;margin:12vh auto 0"><div class="card"><div class="brand" style="margin-bottom:14px"><small>ShopView · beta</small>${t}</div>${body}</div></div>`}
function loginView(err,info){
  msgView("Accedi",`<form id="lf" autocomplete="on"><label class="f">Email<input type="email" id="lem" autocomplete="username" inputmode="email" autocapitalize="off" required></label>
   <label class="f" style="margin-top:10px">Password<input type="password" id="lpw" autocomplete="current-password" required style="width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit"></label>
   <p class="hint" id="lerr" style="color:var(--bad)">${esc(err||"")}</p><p class="hint" id="linfo">${esc(info||"")}</p>
   <div style="margin-top:12px"><button class="btn primary" type="submit" style="width:100%">Entra</button></div>
   <p style="margin:14px 0 0"><a href="#" id="lfg" class="hint">Password dimenticata?</a></p></form>`);
  $("#lf").addEventListener("submit",async e=>{e.preventDefault();
    const b=$("#lf button");b.disabled=true;b.textContent="Accesso…";
    const{data,error}=await sb.auth.signInWithPassword({email:$("#lem").value.trim(),password:$("#lpw").value});
    if(error){loginView(/invalid/i.test(error.message)?"Email o password non corretti.":error.message);return}
    enter(data.session)});
  $("#lfg").addEventListener("click",async e=>{e.preventDefault();const em=$("#lem").value.trim();
    if(!em){$("#lerr").textContent="Scrivi prima la tua email.";return}
    await sb.auth.resetPasswordForEmail(em,{redirectTo:"https://andrea-angiolucci.github.io/stockview-dashboard/reset-password.html"});
    $("#lerr").textContent="";$("#linfo").textContent="Se l'email è registrata, riceverai il link per scegliere una nuova password."})}
async function enter(session){
  const md=(session.user&&session.user.user_metadata)||{},role=md.role||"";
  const hasFlag=!!(md.apps&&md.apps.shopview);
  let perm=null;
  try{const{data}=await sb.from("ruoli_permessi").select("puo_accedere,puo_modificare").eq("ruolo",role).eq("pagina","shopview").maybeSingle();perm=data}catch(e){}
  if(!hasFlag&&(!perm||!perm.puo_accedere)){msgView("Accesso non abilitato",`<p>Il tuo account (${esc(session.user.email)}) non è abilitato a ShopView. Chiedi alla direzione.</p><button class="btn" id="lo">Esci</button>`);$("#lo").onclick=()=>sb.auth.signOut().then(()=>location.reload());return}
  ME={email:session.user.email,role,filiale:NOME[md.filiale]||"",focus:String(md.focus||"").toUpperCase().slice(0,3),name:nomeDa(md,session.user.email),temp:false};
  if((role==="vendita"||hasFlag)&&!ME.filiale){msgView("Account senza negozio",`<p>Al tuo account non è associato nessun negozio. Chiedi alla direzione.</p>`);return}
  if(ME.filiale){DB.settings.store=ME.filiale;chkOvr()}
  if(ME.focus)DB.settings.seller=ME.focus;
  save();render();loadReq();loadSummary();flushOutbox();
  clearInterval(TIMER);TIMER=setInterval(()=>{if(document.hidden)return;if(chkOvr()){render();loadReq();loadSummary();return}flushOutbox();if(S.view==="home"||S.view==="richieste")loadReq()},60000)}
window.addEventListener("online",()=>flushOutbox());
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&ME)location.reload()});
(async()=>{try{const{data:{session}}=await sb.auth.getSession();if(session)enter(session);else loginView()}catch(e){loginView("Errore di rete: riprova.")}})();
</script>
</body></html>
