<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockView — Reimposta password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1720; --panel:#16212e; --panel2:#1c2a3a; --line:#26384c;
    --txt:#e8eef5; --muted:#8aa0b6; --accent:#3da9fc; --accent2:#2b7fd6;
    --ok:#36c98d; --warn:#f5a524;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px}
  #wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:34px 30px;width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c5cff);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
  .brand h1{font-size:19px;margin:0;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12.5px;margin:2px 0 22px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
  input[type=password],input[type=text]{width:100%;padding:11px 13px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button{cursor:pointer;font-family:inherit}
  .btn{width:100%;margin-top:22px;padding:12px;border:none;border-radius:10px;background:var(--accent);
    color:#04121f;font-weight:700;font-size:14.5px;transition:.15s}
  .btn:hover{background:var(--accent2);color:#fff}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{font-size:12.5px;margin-top:14px;min-height:16px}
  .msg.err{color:#ff8585}
  .msg.ok{color:var(--ok)}
  .hint{color:var(--muted);font-size:12px;margin-top:10px}
  a.link{color:var(--accent);text-decoration:none}
  a.link:hover{text-decoration:underline}
  .hidden{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div class="card">
    <div class="brand"><div class="dot">S</div><h1>StockView</h1></div>

    <div id="loading">
      <div class="sub">Verifica del link in corso…</div>
    </div>

    <div id="form" class="hidden">
      <div class="sub">Imposta una nuova password per il tuo account.</div>
      <label for="pw1">Nuova password</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="Almeno 6 caratteri">
      <label for="pw2">Conferma password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Ripeti la password">
      <button id="submit" class="btn">Imposta password</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="fail" class="hidden">
      <div class="sub">Impossibile reimpostare la password</div>
      <div id="failmsg" class="msg err"></div>
      <div class="hint"><a class="link" href="index.html">← Torna al login</a></div>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://exrlurfvydxrqfzjdobp.supabase.co";
  var SUPABASE_KEY = "sb_publishable_0mNbCOZLSV-ug9iJ9jLrNA_RabyY_LM";

  var rawHash = location.hash || "";
  var rawSearch = location.search || "";
  var hp = new URLSearchParams(rawHash.charAt(0) === "#" ? rawHash.slice(1) : rawHash);
  var sp = new URLSearchParams(rawSearch);

  var errCode = hp.get("error") || sp.get("error");
  var errDesc = hp.get("error_description") || sp.get("error_description");
  var tokenHash = sp.get("token_hash") || hp.get("token_hash");
  var typeParam = hp.get("type") || sp.get("type");
  var hasRecovery = (typeParam === "recovery") || (typeParam === "invite") ||
                    !!hp.get("access_token") ||
                    !!sp.get("code") ||
                    !!tokenHash;

  var $ = function(id){ return document.getElementById(id); };
  function show(state){
    $("loading").classList.add("hidden");
    $("form").classList.add("hidden");
    $("fail").classList.add("hidden");
    $(state).classList.remove("hidden");
  }
  function showFail(text){ $("failmsg").textContent = text; show("fail"); }
  function showForm(){ show("form"); var e=$("pw1"); if(e) e.focus(); }

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var formShown = false;

  if (errCode) {
    showFail(errDesc ? decodeURIComponent(errDesc.replace(/\+/g, " "))
                     : "Il link di reset non è più valido. Richiedi un nuovo reset.");
  } else if (!hasRecovery) {
    location.replace("index.html");
  } else {
    sb.auth.onAuthStateChange(function(event){
      if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && !formShown){
        formShown = true; showForm();
      }
    });

    if (tokenHash && typeParam) {
      sb.auth.verifyOtp({ type: typeParam, token_hash: tokenHash }).then(function(res){
        if (!res.error && !formShown){ formShown = true; showForm(); }
      });
    }

    var tries = 0;
    (function poll(){
      if (formShown) return;
      sb.auth.getSession().then(function(res){
        var session = res && res.data ? res.data.session : null;
        if (session && !formShown){ formShown = true; showForm(); return; }
        tries++;
        if (tries >= 20){
          showFail("Link non valido o scaduto. Torna al login e richiedi un nuovo reset password.");
        } else {
          setTimeout(poll, 250);
        }
      });
    })();
  }

  $("submit").addEventListener("click", async function(){
    var b = $("submit");
    var m = $("msg");
    m.className = "msg";
    m.textContent = "";
    var p1 = $("pw1").value || "";
    var p2 = $("pw2").value || "";
    if (p1.length < 6){ m.className="msg err"; m.textContent="La password deve avere almeno 6 caratteri."; return; }
    if (p1 !== p2){ m.className="msg err"; m.textContent="Le due password non coincidono."; return; }
    b.disabled = true;
    try{
      var res = await sb.auth.updateUser({ password: p1 });
      if (res.error) throw res.error;
      m.className = "msg ok";
      m.textContent = "Password aggiornata! Reindirizzamento in corso…";
      setTimeout(function(){ location.href = "ricircolo.html"; }, 2000);
    }catch(e){
      b.disabled = false;
      m.className = "msg err";
      m.textContent = (e && e.message) ? e.message : "Errore durante l'aggiornamento della password.";
    }
  });
</script>
</body>
</html>
