<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockView — Ricircolo</title>
<style>
  :root{--bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#26384c;--txt:#e8eef5;--muted:#8aa0b6;--accent:#3da9fc;--ok:#36c98d;--bad:#ff6b6b;--truck:#f5a524;--shadow:0 10px 30px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  h1{font-size:17px;margin:0}
  nav{display:flex;gap:6px}
  nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600}
  nav a:hover{background:var(--panel2);color:var(--txt)}
  nav a.cur{background:var(--accent);color:#04121f}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:13px}
  .wrap{max-width:1500px;margin:0 auto;padding:18px 22px}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .stat b{color:var(--txt)}
  select,button{font-family:inherit}
  select{padding:6px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  .btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-weight:600}
  .btn.ok{border-color:var(--ok);color:var(--ok)}
  .btn.acc{border-color:var(--accent);color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  th{position:sticky;top:58px;z-index:5;background:var(--panel2);color:var(--muted);text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;white-space:nowrap}
  td{padding:7px 12px;border-top:1px solid var(--line)}
  .qta{text-align:center;font-weight:700;color:var(--accent)}
  .from{color:var(--bad);font-weight:700}
  .to{color:var(--ok);font-weight:700}
  .sec{font-weight:700;padding:14px 2px 6px}
  .muted{color:var(--muted)}
  .empty{padding:50px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="dot">S</div><h1>StockView</h1></div>
  <nav>
    <a href="presenza.html">Controllo presenza</a>
    <a href="assortimento.html">Assortimento ideale</a>
    <a href="ricircolo.html" class="cur">Ricircolo</a>
    <a href="ricircoli_storici.html">Ricircoli effettuati</a>
    
    <a href="revisioni.html" id="navRevisioni" style="display:none">Aggiornamenti</a>
  </nav>
  <div class="spacer"></div>
  <a href="impostazioni.html" style="color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-right:14px">Impostazioni</a>
  <span class="who" id="who"></span>
  <button class="btn" id="logout" style="display:none">Esci</button>
</header>
<div class="wrap">
  <div class="bar">
    <div style="font-size:18px;font-weight:700">🔄 Ricircolo automatico</div>
    <div class="stat muted" id="stat"></div>
    <div class="spacer"></div>
    <span class="muted" style="font-size:12px">Vista negozio</span>
    <select id="store"><option value="">Tutti i negozi</option></select>
    <button class="btn acc" id="reload">Aggiorna</button>
    <button class="btn ok" id="xls">Esporta Excel</button>
  </div>
  <div id="body"><div class="empty">Caricamento…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://exrlurfvydxrqfzjdobp.supabase.co";
const SUPABASE_KEY="sb_publishable_0mNbCOZLSV-ug9iJ9jLrNA_RabyY_LM";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const NEGS=["Paternò","Acireale","Catania","Augusta","Giarre","Lentini","Portali","Viale Africa"];
let MOVES=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function tget(c,TGT){const v=TGT[c.barcode+"|"+c.filiale];return v===undefined?1:v;}
var RC_EXC_USCITA=new Set(), RC_EXC_ENTRATA=new Set();
async function loadRcEsclusioni(){ try{ const r=await sb.from("ricircolo_esclusioni").select("filiale,direzione"); RC_EXC_USCITA=new Set(); RC_EXC_ENTRATA=new Set(); (r.data||[]).forEach(function(x){ if(x.direzione==="uscita")RC_EXC_USCITA.add(x.filiale); else if(x.direzione==="entrata")RC_EXC_ENTRATA.add(x.filiale); }); }catch(e){} }
function computeRicircolo(cells,TGT){
  const active={B:1,C:1,D:1,E:1,G:1,H:1,I:1,Z:1};
  const byBc={};
  cells.forEach(c=>{ if(!active[c.filiale])return; if(!byBc[c.barcode])byBc[c.barcode]={meta:c,cells:[]}; byBc[c.barcode].cells.push(c); });
  const moves=[];
  Object.keys(byBc).forEach(bc=>{
    const arr=byBc[bc].cells, sources=[], needs=[];
    arr.forEach(c=>{ const t=tget(c,TGT); const s=(c.disponibile||0)-t; if(s>0){ if(!RC_EXC_USCITA.has(c.filiale))sources.push({c:c,qty:s}); } else if((c.disponibile||0)<t){ if(!RC_EXC_ENTRATA.has(c.filiale))needs.push({c:c,qty:t-(c.disponibile||0)}); } });
    if(!sources.length||!needs.length)return;
    needs.sort((a,b)=>(b.c.venduto||0)-(a.c.venduto||0));
    sources.sort((a,b)=>(a.c.venduto||0)-(b.c.venduto||0));
    let si=0;
    needs.forEach(nd=>{ let rem=nd.qty;
      while(rem>0&&si<sources.length){ const src=sources[si]; if(src.qty<=0){si++;continue;} const mv=Math.min(rem,src.qty); src.qty-=mv; rem-=mv; const m=byBc[bc].meta;
        moves.push({barcode:bc,marchio:m.marchio,modello:m.modello,colore:m.colore,calibro:m.calibro,categoria:m.categoria,tipo_lenti:m.tipo_lenti,fornitore:m.fornitore,fromNeg:src.c.negozio,toNeg:nd.c.negozio,qta:mv});
      }
    });
  });
  return moves;
}
function refTxt(m){return esc((m.marchio||"")+" "+(m.modello||"")+" · "+[m.colore,m.calibro,m.categoria,m.barcode].filter(Boolean).join(" · "));}
function tbl(rows,cols,fields){
  const th=cols.map(h=>'<th>'+h+'</th>').join('');
  const b=rows.map(r=>'<tr>'+fields.map(f=>{const v=r[f]; if(f==="qta")return '<td class="qta">'+v+'</td>'; if(f==="_ref")return '<td>'+refTxt(r)+'</td>'; if(f==="fromNeg")return '<td class="from">'+esc(v)+'</td>'; if(f==="toNeg")return '<td class="to">'+esc(v)+'</td>'; return '<td>'+esc(v)+'</td>';}).join('')+'</tr>').join('');
  return '<table><thead><tr>'+th+'</tr></thead><tbody>'+b+'</tbody></table>';
}
function render(store){
  const tot=MOVES.reduce((s,m)=>s+m.qta,0);
  $("#stat").innerHTML='<b>'+MOVES.length+'</b> movimenti · <b style="color:var(--accent)">'+tot+'</b> pezzi · <b>'+(new Set(MOVES.map(m=>m.marchio)).size)+'</b> marchi';
  const body=$("#body");
  if(!MOVES.length){ body.innerHTML='<div class="empty">Nessun ricircolo da fare: nessun doppione da spostare sui buchi. ✅</div>'; return; }
  if(!store){
    const rows=MOVES.slice().sort((a,b)=>String((a.marchio||"")+a.fromNeg+a.toNeg).localeCompare(String((b.marchio||"")+b.fromNeg+b.toNeg)));
    body.innerHTML=tbl(rows,["Marchio","Da (invia)","A (riceve)","Referenza","Qta"],["marchio","fromNeg","toNeg","_ref","qta"]);
  } else {
    const out=MOVES.filter(m=>m.fromNeg===store).sort((a,b)=>String(a.toNeg+a.marchio).localeCompare(String(b.toNeg+b.marchio)));
    const inc=MOVES.filter(m=>m.toNeg===store).sort((a,b)=>String(a.fromNeg+a.marchio).localeCompare(String(b.fromNeg+b.marchio)));
    const pOut=out.reduce((s,m)=>s+m.qta,0), pInc=inc.reduce((s,m)=>s+m.qta,0);
    body.innerHTML='<div class="sec" style="color:var(--bad)">📤 Da inviare — '+esc(store)+' · '+pOut+' pezzi</div>'+
      (out.length?tbl(out,["A (riceve)","Referenza","Qta"],["toNeg","_ref","qta"]):'<div class="muted" style="padding:8px 2px">Niente da inviare.</div>')+
      '<div class="sec" style="color:var(--ok)">📥 Da ricevere — '+esc(store)+' · '+pInc+' pezzi</div>'+
      (inc.length?tbl(inc,["Da (invia)","Referenza","Qta"],["fromNeg","_ref","qta"]):'<div class="muted" style="padding:8px 2px">Niente da ricevere.</div>');
  }
}
function buildStoreOptions(){
  const sel=$("#store"); const cur=sel.value;
  sel.innerHTML='<option value="">Tutti i negozi</option>'+NEGS.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
  sel.value=cur;
}
function exportRic(){
  if(!MOVES.length){alert("Nessun movimento da esportare.");return;}
  const rows=MOVES.map(m=>({Marchio:m.marchio,Modello:m.modello,Colore:m.colore,Calibro:m.calibro,Categoria:m.categoria,Tipo:m.tipo_lenti,Barcode:m.barcode,Da:m.fromNeg,A:m.toNeg,Qta:m.qta}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Movimenti");
  const byS={};
  MOVES.forEach(m=>{ (byS[m.fromNeg]=byS[m.fromNeg]||[]).push({Direzione:"INVIA a "+m.toNeg,Marchio:m.marchio,Modello:m.modello,Colore:m.colore,Barcode:m.barcode,Qta:m.qta}); (byS[m.toNeg]=byS[m.toNeg]||[]).push({Direzione:"RICEVI da "+m.fromNeg,Marchio:m.marchio,Modello:m.modello,Colore:m.colore,Barcode:m.barcode,Qta:m.qta}); });
  Object.keys(byS).sort().forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(byS[s]),s.slice(0,28)));
  XLSX.writeFile(wb,"ricircolo_"+new Date().toISOString().slice(0,10)+".xlsx");
}
async function run(){
  $("#body").innerHTML='<div class="empty">Calcolo ricircolo su tutte le linee…</div>';
  await loadMasterFilters(); await loadRcEsclusioni(); let marchi=[];
  try{ const r=await sb.from("assortimento_marchio").select("marchio,fornitore").limit(50000); const set={}; (r.data||[]).forEach(function(x){ if(!x.marchio)return; if(ESCLUSI_MARCHI.has(x.marchio))return; if(ESCLUSI_FORNITORI.has(x.fornitore))return; var fa=MARCHI_ATTIVI[x.marchio]; if(fa&&x.fornitore&&x.fornitore!==fa)return; set[x.marchio]=1; }); marchi=Object.keys(set).sort(); }catch(e){}
  if(!marchi.length){ $("#body").innerHTML='<div class="empty" style="color:var(--bad)">Nessuna linea trovata negli assortimenti ideali.</div>'; return; }
  let TGT={};
  try{ const r=await sb.from("stock_target").select("barcode,filiale,target_qty"); (r.data||[]).forEach(x=>TGT[x.barcode+"|"+x.filiale]=x.target_qty); }catch(e){}
  let all=[], done=0;
  for(const m of marchi){
    const {data,error}=await sb.rpc("presenza_celle2",{p_marchi:[m],p_tipi:null,p_categorie:null,p_fornitori:null}).range(0,49999);
    if(!error&&data) all.push.apply(all,data);
    done++;
    $("#body").innerHTML='<div class="empty">Calcolo ricircolo… <b>'+done+'/'+marchi.length+'</b> linee</div>';
  }
  MOVES=computeRicircolo(all,TGT);
  buildStoreOptions();
  render(RC_ROLE==='vendita'?(RC_FILIALE||""):($("#store").value||""));
}
var ESCLUSI_FORNITORI=new Set(), ESCLUSI_MARCHI=new Set(), MARCHI_ATTIVI={};
async function loadMasterFilters(){ try{ var res=await Promise.all([ sb.from("esclusioni_master").select("tipo,valore").eq("escluso",true), sb.from("marchi_fornitori_attivi").select("marchio,fornitore_attivo") ]); ESCLUSI_FORNITORI=new Set(); ESCLUSI_MARCHI=new Set(); MARCHI_ATTIVI={}; (res[0].data||[]).forEach(function(x){ if(x.tipo==="fornitore")ESCLUSI_FORNITORI.add(x.valore); else if(x.tipo==="marchio")ESCLUSI_MARCHI.add(x.valore); }); (res[1].data||[]).forEach(function(x){ MARCHI_ATTIVI[x.marchio]=x.fornitore_attivo; }); }catch(e){} }
var RC_ROLE='gestore', RC_FILIALE=null;
var RIC_ROWS=[];
var RC_FILNAMES={D:"Catania",I:"Portali",G:"Giarre",Z:"Viale Africa",C:"Acireale",E:"Augusta",H:"Lentini",B:"Paternò",A:"Deposito"};
function filName(c){ return RC_FILNAMES[c]||c||""; }
function fmtDate(dd){ try{ return dd.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"}); }catch(e){ return ""; } }
function statoBadge(s){ if(s==="trovato")return '<span style="background:rgba(245,165,36,.2);color:var(--truck);padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap">In trasferimento</span>'; if(s==="non_trovato")return '<span style="background:rgba(255,107,107,.2);color:var(--bad);padding:2px 8px;border-radius:10px;font-size:12px">Non trovato</span>'; return '<span style="background:rgba(138,160,182,.2);color:var(--muted);padding:2px 8px;border-radius:10px;font-size:12px">In attesa</span>'; }
function buildFilialeFilter(){ var sel=$("#store"); if(!sel)return; var lab=sel.previousElementSibling; if(lab)lab.textContent="Filtra filiale"; var cur=sel.value; var codes=["D","I","G","Z","C","E","H","B"]; sel.innerHTML='<option value="">Tutte le filiali</option>'+codes.map(function(c){return '<option value="'+c+'"'+(c===cur?" selected":"")+'>'+esc(filName(c))+'</option>';}).join(""); }
async function run(){
  $("#body").innerHTML='<div class="empty">Caricamento ricircoli…</div>';
  var q=sb.from("ricircoli").select("*").in("stato",["pending","trovato","non_trovato"]).order("creato_il",{ascending:false});
  if(RC_ROLE==="vendita" && RC_FILIALE){ q=q.or("filiale_da.eq."+RC_FILIALE+",filiale_a.eq."+RC_FILIALE); }
  try{ var r=await q; if(r.error)throw r.error; RIC_ROWS=r.data||[]; }
  catch(e){ $("#body").innerHTML='<div class="empty" style="color:var(--bad)">Errore: '+esc(String((e&&e.message)||e))+'</div>'; return; }
  var x=$("#xls"); if(x)x.style.display="none";
  if(RC_ROLE!=="vendita")buildFilialeFilter();
  render();
}
function render(){
  var rows=RIC_ROWS.slice();
  var sel=$("#store"); var ff=(sel && RC_ROLE!=="vendita")?sel.value:"";
  if(ff){ rows=rows.filter(function(x){return x.filiale_da===ff||x.filiale_a===ff;}); }
  $("#stat").innerHTML='<b>'+rows.length+'</b> ricircoli attivi';
  var body=$("#body");
  if(!rows.length){ body.innerHTML='<div class="empty">Nessun ricircolo attivo. ✅</div>'; return; }
  var email=($("#who")&&$("#who").textContent)||"";
  var today=Date.now();
  var head='<tr><th>Data richiesta</th><th>Giorni</th><th>Stato</th><th>Marchio</th><th>Da (invia)</th><th>A (riceve)</th><th>Referenza</th><th>Qta</th><th></th></tr>';
  var b=rows.map(function(r){
    var cr=r.creato_il?new Date(r.creato_il):null;
    var days=cr?Math.floor((today-cr.getTime())/86400000):0;
    var dcol='<td'+((r.stato==="pending"&&days>3)?' style="color:var(--bad);font-weight:700"':'')+'>'+(cr?days+"g":"-")+'</td>';
    var az="";
    if(RC_ROLE==="vendita" && r.stato==="pending" && (r.filiale_da===RC_FILIALE||r.filiale_a===RC_FILIALE)){ az='<button class="btn ok rcFound" data-id="'+r.id+'">✓ Trovato</button> <button class="btn rcNot" data-id="'+r.id+'" style="background:var(--bad);color:#fff">✗ Non trovato</button>'; }
    if(RC_ROLE==="admin"){ az+=' <button class="ghost rcDel" data-id="'+r.id+'" title="Annulla" style="padding:2px 8px">🗑</button>'; }
    var ref=esc([(r.marchio||"")+" "+(r.modello||"")].concat([r.colore,r.calibro,r.categoria,r.barcode].filter(Boolean)).join(" · "));
    return '<tr><td style="white-space:nowrap">'+(cr?fmtDate(cr):"-")+'</td>'+dcol+'<td>'+statoBadge(r.stato)+'</td><td>'+esc(r.marchio||"")+'</td><td class="from">'+esc(filName(r.filiale_da))+'</td><td class="to">'+esc(filName(r.filiale_a))+'</td><td>'+ref+'</td><td class="qta">'+(r.quantita||1)+'</td><td style="white-space:nowrap">'+az+'</td></tr>';
  }).join("");
  body.innerHTML='<table><thead>'+head+'</thead><tbody>'+b+'</tbody></table>';
  body.querySelectorAll(".rcFound").forEach(function(bt){ bt.onclick=function(){ rcSetStato(bt.dataset.id,"trovato",email); }; });
  body.querySelectorAll(".rcNot").forEach(function(bt){ bt.onclick=function(){ rcSetStato(bt.dataset.id,"non_trovato",email); }; });
  body.querySelectorAll(".rcDel").forEach(function(bt){ bt.onclick=function(){ rcAnnulla(bt.dataset.id); }; });
}
async function rcSetStato(id,stato,email){ try{ var r=await sb.from("ricircoli").update({stato:stato,aggiornato_da:email||null,aggiornato_il:new Date().toISOString()}).eq("id",id); if(r.error)throw r.error; run(); }catch(e){ alert("Errore: "+String((e&&e.message)||e)); } }
function rcAnnulla(id){
  var back=document.createElement("div");
  back.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100";
  back.innerHTML='<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:320px;max-width:92%"><h3 style="margin:0 0 12px;font-size:16px">Annulla ricircolo</h3><p class="muted" style="margin:0 0 12px;font-size:13px">Per quanto tempo non riproporlo?</p><div style="display:flex;flex-direction:column;gap:8px"><button class="btn" data-s="7g">7 giorni</button><button class="btn" data-s="30g">30 giorni</button><button class="btn" data-s="definitivo" style="background:var(--bad);color:#fff">Definitivo</button><button class="ghost" data-s="">Chiudi</button></div></div>';
  document.body.appendChild(back);
  back.addEventListener("click",function(e){ if(e.target===back){ document.body.removeChild(back); } });
  back.querySelectorAll("button[data-s]").forEach(function(bt){ bt.onclick=async function(){ var s=bt.dataset.s; if(!s){ document.body.removeChild(back); return; } var fino=null; var dd=new Date(); if(s==="7g"){ dd.setDate(dd.getDate()+7); fino=dd.toISOString().slice(0,10); } else if(s==="30g"){ dd.setDate(dd.getDate()+30); fino=dd.toISOString().slice(0,10); } try{ var r=await sb.from("ricircoli").update({stato:"annullato",snooze_tipo:s,snooze_fino_al:fino,aggiornato_il:new Date().toISOString()}).eq("id",id); if(r.error)throw r.error; document.body.removeChild(back); run(); }catch(e){ alert("Errore: "+String((e&&e.message)||e)); } }; });
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("#body").innerHTML='<div class="empty">Devi accedere. <a href="presenza.html" style="color:var(--accent)">Vai a Controllo presenza</a> per il login, poi torna qui.</div>'; return; }
  $("#who").textContent=session.user.email;
  $("#logout").style.display="";
  var _md=session.user.user_metadata||{}; RC_ROLE=_md.role||'gestore'; RC_FILIALE=_md.filiale||null;
  try{ var _pp=await sb.from('ruoli_permessi').select('puo_accedere').eq('ruolo',RC_ROLE).eq('pagina','ricircolo').maybeSingle(); if(RC_ROLE!=='admin' && !(_pp.data&&_pp.data.puo_accedere)){ $("#body").innerHTML='<div class="empty">Accesso non autorizzato.</div>'; return; } }catch(e){}
  if(RC_ROLE==='vendita'){ var _s=$("#store"); if(_s){ _s.style.display='none'; if(_s.previousElementSibling)_s.previousElementSibling.style.display='none'; } var _x=$("#xls"); if(_x)_x.style.display='none'; }
  if(location.search.indexOf('denied=1')>-1){ var _bd=document.createElement('div'); _bd.textContent='Accesso non autorizzato: sei stato reindirizzato al Ricircolo.'; _bd.style.cssText='background:rgba(245,165,36,.15);border:1px solid var(--truck);color:var(--txt);padding:8px 12px;border-radius:8px;margin:0 0 10px;font-size:13px'; var _b=$("#body"); if(_b&&_b.parentElement)_b.parentElement.insertBefore(_bd,_b); }
  run();
}
$("#store").addEventListener("change",function(){render(this.value);});
$("#reload").addEventListener("click",run);
$("#xls").addEventListener("click",exportRic);
$("#logout").addEventListener("click",async()=>{await sb.auth.signOut();location.href="presenza.html";});
// XLSX for export
(function(){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";document.head.appendChild(s);})();
/* ==== FIX ordinamento colonne cliccabili + colonna e filtro Fornitore ==== */
var RC_SORT_KEY="data", RC_SORT_DIR="desc";
(function(){ try{ var st=document.createElement("style"); st.textContent="#body table th.sortable{cursor:pointer;user-select:none}#body table th.sortable:hover{color:var(--txt)}#body table th.sorted{color:var(--accent)}#body table th .arw{font-size:11px;margin-left:3px}"; document.head.appendChild(st); }catch(e){} })();
function rcFornitori(){ var seen={}, out=[]; (RIC_ROWS||[]).forEach(function(r){ var f=(r.fornitore||"").trim(); if(f && !seen[f]){ seen[f]=1; out.push(f); } }); out.sort(function(a,b){return a.localeCompare(b);}); return out; }
function buildFilialeFilter(){
  var sel=$("#store"); if(!sel) return;
  var lab=sel.previousElementSibling; if(lab) lab.textContent="Filtra filiale";
  var cur=sel.value; var codes=["D","I","G","Z","C","E","H","B"];
  sel.innerHTML='<option value="">Tutte le filiali</option>'+codes.map(function(c){return '<option value="'+c+'"'+(c===cur?" selected":"")+'>'+esc(filName(c))+'</option>';}).join("");
  var ff=document.getElementById("fornFilter");
  if(!ff){ var lb=document.createElement("span"); lb.className="muted"; lb.style.fontSize="12px"; lb.textContent="Filtra fornitore"; ff=document.createElement("select"); ff.id="fornFilter"; sel.parentNode.insertBefore(lb, sel.nextSibling); sel.parentNode.insertBefore(ff, lb.nextSibling); ff.addEventListener("change", function(){ render(); }); }
  var fcur=ff.value; var forn=rcFornitori();
  ff.innerHTML='<option value="">Tutti i fornitori</option>'+forn.map(function(f){return '<option value="'+esc(f)+'"'+(f===fcur?" selected":"")+'>'+esc(f)+'</option>';}).join("");
}
function rcSortVal(r,k){ if(k==="data") return r.creato_il?new Date(r.creato_il).getTime():0; if(k==="giorni"){ var cr=r.creato_il?new Date(r.creato_il).getTime():0; return cr?(Date.now()-cr):0; } if(k==="stato") return (r.stato||""); if(k==="fornitore") return (r.fornitore||""); if(k==="marchio") return (r.marchio||""); if(k==="da") return filName(r.filiale_da)||""; if(k==="a") return filName(r.filiale_a)||""; if(k==="qta") return (r.quantita||1); return ""; }
function rcSort(rows){ var k=RC_SORT_KEY, dir=RC_SORT_DIR==="asc"?1:-1; rows.sort(function(a,b){ var va=rcSortVal(a,k), vb=rcSortVal(b,k), c; if(typeof va==="number" && typeof vb==="number") c=va-vb; else c=String(va).localeCompare(String(vb)); return c*dir; }); return rows; }
function rcArrow(k){ return RC_SORT_KEY===k?'<span class="arw">'+(RC_SORT_DIR==="asc"?"↑":"↓")+'</span>':""; }
function rcTh(k,label){ return '<th class="sortable'+(RC_SORT_KEY===k?" sorted":"")+'" data-k="'+k+'">'+label+rcArrow(k)+'</th>'; }
function render(){
  var rows=RIC_ROWS.slice();
  var sel=$("#store"); var ff=(sel && RC_ROLE!=="vendita")?sel.value:"";
  if(ff){ rows=rows.filter(function(x){return x.filiale_da===ff||x.filiale_a===ff;}); }
  var fsel=document.getElementById("fornFilter"); var fv=(fsel && RC_ROLE!=="vendita")?fsel.value:"";
  if(fv){ rows=rows.filter(function(x){return (x.fornitore||"")===fv;}); }
  $("#stat").innerHTML='<b>'+rows.length+'</b> ricircoli attivi';
  var body=$("#body");
  if(!rows.length){ body.innerHTML='<div class="empty">Nessun ricircolo attivo. ✅</div>'; return; }
  rcSort(rows);
  var email=($("#who")&&$("#who").textContent)||"";
  var today=Date.now();
  var head='<tr>'+rcTh("data","Data richiesta")+rcTh("giorni","Giorni")+rcTh("stato","Stato")+rcTh("fornitore","Fornitore")+rcTh("marchio","Marchio")+rcTh("da","Da (invia)")+rcTh("a","A (riceve)")+'<th>Referenza</th>'+rcTh("qta","Qta")+'<th></th></tr>';
  var b=rows.map(function(r){
    var cr=r.creato_il?new Date(r.creato_il):null;
    var days=cr?Math.floor((today-cr.getTime())/86400000):0;
    var dcol='<td'+((r.stato==="pending"&&days>3)?' style="color:var(--bad);font-weight:700"':"")+'>'+(cr?days+"g":"-")+'</td>';
    var az="";
    if(RC_ROLE==="vendita" && r.stato==="pending" && (r.filiale_da===RC_FILIALE||r.filiale_a===RC_FILIALE)){ az='<button class="btn ok rcFound" data-id="'+r.id+'">✓ Trovato</button> <button class="btn rcNot" data-id="'+r.id+'" style="background:var(--bad);color:#fff">✗ Non trovato</button>'; }
    if(RC_ROLE==="admin"){ az+=' <button class="ghost rcDel" data-id="'+r.id+'" title="Annulla" style="padding:2px 8px">🗑</button>'; }
    var ref=esc([(r.marchio||"")+" "+(r.modello||"")].concat([r.colore,r.calibro,r.categoria,r.barcode].filter(Boolean)).join(" · "));
    return '<tr><td style="white-space:nowrap">'+(cr?fmtDate(cr):"-")+'</td>'+dcol+'<td>'+statoBadge(r.stato)+'</td><td>'+esc(r.fornitore||"")+'</td><td>'+esc(r.marchio||"")+'</td><td class="from">'+esc(filName(r.filiale_da))+'</td><td class="to">'+esc(filName(r.filiale_a))+'</td><td>'+ref+'</td><td class="qta">'+(r.quantita||1)+'</td><td style="white-space:nowrap">'+az+'</td></tr>';
  }).join("");
  body.innerHTML='<table><thead>'+head+'</thead><tbody>'+b+'</tbody></table>';
  body.querySelectorAll("th.sortable").forEach(function(th){ th.onclick=function(){ var k=th.getAttribute("data-k"); if(RC_SORT_KEY===k){ RC_SORT_DIR=(RC_SORT_DIR==="asc"?"desc":"asc"); } else { RC_SORT_KEY=k; RC_SORT_DIR=(k==="data"?"desc":"asc"); } render(); }; });
  body.querySelectorAll(".rcFound").forEach(function(bt){ bt.onclick=function(){ rcSetStato(bt.dataset.id,"trovato",email); }; });
  body.querySelectorAll(".rcNot").forEach(function(bt){ bt.onclick=function(){ rcSetStato(bt.dataset.id,"non_trovato",email); }; });
  body.querySelectorAll(".rcDel").forEach(function(bt){ bt.onclick=function(){ rcAnnulla(bt.dataset.id); }; });
}

boot();

(async function(){try{const {data:{session}}=await sb.auth.getSession();const _r=session&&session.user&&session.user.user_metadata&&session.user.user_metadata.role;if(_r==='admin'){var e=document.getElementById('navRevisioni');if(e)e.style.display='';}}catch(e){}})();
</script>
</body>
