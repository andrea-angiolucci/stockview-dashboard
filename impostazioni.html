<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StockView — Impostazioni</title>
<style>
  :root{--bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#26384c;--txt:#e8eef5;--muted:#8aa0b6;--accent:#3da9fc;--accent2:#2b7fd6;--ok:#36c98d;--bad:#ff6b6b;--warn:#f5a524;--yellow:#e8c848;--chip:#1c2a3a;--shadow:0 10px 30px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px 30px;width:100%;max-width:370px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .dot{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c5cff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .brand h1{font-size:18px;margin:0}
  .sub{color:var(--muted);font-size:12.5px;margin:6px 0 18px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  input[type=email],input[type=password],input[type=text]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button{cursor:pointer;font-family:inherit}
  .btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#04121f;font-weight:700;font-size:14.5px}
  .btn:hover{background:var(--accent2);color:#fff}
  .err{color:var(--bad);font-size:12.5px;margin-top:12px;min-height:15px}
  #app{display:none}
  header{position:sticky;top:0;z-index:30;background:rgba(15,23,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:18px}
  header .brand h1{font-size:15px}
  nav{display:flex;gap:14px}
  nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:4px 2px;border-bottom:2px solid transparent}
  nav a:hover{color:var(--accent)}
  nav a.cur{color:var(--accent);border-bottom-color:var(--accent)}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:12.5px}
  .rolechip{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .rolechip.admin{background:rgba(54,201,141,.18);color:var(--ok)}
  .rolechip.gestore{background:rgba(138,160,182,.18);color:var(--muted)}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:8px;font-size:12.5px}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  .wrap{max-width:1700px;margin:0 auto;padding:18px}
  .pagetitle{font-size:20px;margin:6px 2px 14px}
  .tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tabbar button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13.5px;font-weight:600;padding:9px 14px}
  .tabbar button:hover{color:var(--txt)}
  .tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .toolbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .fcol{display:flex;flex-direction:column;gap:5px}
  .fcol>span{font-size:12px;color:var(--muted)}
  select.sort,input.txt{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--txt);min-width:150px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:var(--panel2);border:none;padding:9px 16px;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:#04121f;font-weight:700}
  .addbtn{margin-left:auto;background:var(--ok);color:#04121f;border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700}
  .addbtn:hover{filter:brightness(1.08)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:2px 2px 12px}
  .status{color:var(--muted);font-size:13px;margin:10px 2px}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:74vh}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;z-index:5}
  td.mar,th.mar{position:sticky;left:0;text-align:left;background:var(--panel);z-index:4;min-width:190px}
  thead th.mar{z-index:6;background:var(--panel2)}
  td.mar b{color:var(--txt)} td.mar small{display:block;color:var(--muted);font-size:11px}
  tbody tr:hover td{background:var(--panel2)}
  tbody tr:hover td.mar{background:var(--panel2)}
  .dp{display:inline-block;min-width:36px;padding:3px 8px;border-radius:6px;font-weight:700;font-size:12px;line-height:1.3}
  .dpEmpty{color:var(--muted);background:rgba(138,160,182,.10)}
  .dpST{color:#04121f;background:var(--ok)}
  .dpP1{color:#04121f;background:var(--yellow)}
  .dpP2{color:#04121f;background:var(--warn)}
  .dpP3{color:#04121f;background:var(--accent)}
  td.cellEdit{cursor:pointer}
  td.cellEdit:hover .dp{outline:2px solid var(--accent);outline-offset:1px}
  td.flash{animation:fl 1s ease}
  @keyframes fl{0%{background:rgba(54,201,141,.55)}100%{background:transparent}}
  td.cell select{background:var(--panel2);color:var(--txt);border:1px solid var(--accent);border-radius:6px;padding:4px 6px;font-size:12.5px}
  .trash{background:transparent;border:none;color:var(--muted);font-size:14px;padding:2px 6px;border-radius:6px}
  .trash:hover{color:var(--bad);background:rgba(255,107,107,.12)}
  .modal-back{position:fixed;inset:0;background:rgba(4,10,18,.66);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal-back.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:16px}
  .modal .mrow{display:flex;gap:12px;flex-wrap:wrap}
  .modal .mrow .fcol{flex:1;min-width:150px}
  .grid-fil{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .grid-fil .fcol{gap:4px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .modal .acts .cancel{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 14px;font-size:13px}
  .modal .acts .ok{background:var(--accent);border:none;color:#04121f;font-weight:700;border-radius:9px;padding:9px 16px;font-size:13px}
  .modal .acts .danger{background:var(--bad);border:none;color:#fff;font-weight:700;border-radius:9px;padding:9px 16px;font-size:13px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;opacity:0;transition:.25s;z-index:80}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.err{border-color:var(--bad);color:var(--bad)}
  .ro-note{color:var(--muted);font-size:12px;margin:2px 2px 12px}
  .utools{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
  .ubtn{background:var(--accent);color:#04121f;border:none;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}
  .ubtn:hover{background:var(--accent2)}
  .ubtn:disabled{opacity:.6;cursor:default}
  .utblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .utbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);min-width:720px}
  .utbl th{text-align:left;padding:10px 12px;background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
  .utbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .utbl tbody tr:last-child td{border-bottom:none}
  .utbl tr.disrow td{opacity:.55}
  .ubadge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .ubadge.on{background:rgba(54,201,141,.15);color:var(--ok)}
  .ubadge.off{background:rgba(255,107,107,.18);color:var(--bad)}
  .urole{padding:5px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:12px}
  .uacts{display:flex;gap:6px;white-space:nowrap}
  .usm{padding:5px 10px!important;font-size:12px!important}
  .udel{color:var(--bad)}
  .umuted{color:var(--muted);font-size:12px}
  .fmwrap{display:flex;gap:16px;flex-wrap:wrap}
  .fmsec{flex:1;min-width:280px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
  .fmhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .fmbadge{background:rgba(255,107,107,.15);color:var(--bad);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700}
  .fmsearch{margin-left:auto;padding:5px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:12px}
  .fmlist{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .fmitem{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-size:13px;cursor:pointer}
  .fmitem:hover{background:var(--panel2)}
  .fmitem.off{opacity:.55}
  .fmitem.off span{text-decoration:line-through}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="brand"><div class="dot">S</div><h1>StockView</h1></div>
    <div class="sub">Impostazioni · accesso riservato</div>
    <form id="loginForm">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required />
      <label for="pwd">Password</label><input id="pwd" type="password" autocomplete="current-password" required />
      <button class="btn" id="loginBtn" type="submit">Accedi</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand"><div class="dot">S</div><h1>StockView</h1></div>
    <nav>
      <a href="presenza.html">Controllo presenza</a>
      <a href="assortimento.html">Assortimento ideale</a>
      <a href="ricircolo.html">Ricircolo</a>
      <a href="impostazioni.html" class="cur">Impostazioni</a>
      <a href="revisioni.html" id="navRevisioni" style="display:none">Aggiornamenti</a>
    </nav>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="ghost" id="logout">Esci</button>
  </header>

  <div class="wrap">
    <h2 class="pagetitle">Impostazioni</h2>
    <div class="tabbar" id="tabbar"></div>
    <div id="tabcontent"></div>
  </div>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://exrlurfvydxrqfzjdobp.supabase.co";
const SUPABASE_KEY="sb_publishable_0mNbCOZLSV-ug9iJ9jLrNA_RabyY_LM";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

// --- Filiali (attive, no deposito) ordinate per performance ---
const FIL_NAME={B:"Paternò",C:"Acireale",D:"Catania",E:"Augusta",G:"Giarre",H:"Lentini",I:"Portali",Z:"Viale Africa"};
const FIL_ORDER=["D","I","G","Z","C","E","H","B"]; // Catania, Portali, Giarre, Viale Africa, Acireale, Augusta, Lentini, Paternò

// --- Profondità: qty_ideale (multipli di 7) <-> gradino cumulativo ---
const LADDER=["ST","P1","P2","P3","P4"];
const STEP=7;
function qtyToN(q){ q=Number(q)||0; return q>0?Math.min(Math.round(q/STEP),5):0; }
function nToCode(n){ return (n>=1&&n<=5)?LADDER[n-1]:""; }
function nToQty(n){ return n*STEP; }
function dpClass(n){ if(n<=0||n>5)return "dpEmpty"; if(n===1)return "dpST"; if(n===2)return "dpP1"; if(n===3)return "dpP2"; return "dpP3"; }

let ROLE="gestore", isAdmin=false;
let MAP={Vista:{},Sole:{}};   // MAP[tipo][marchio][filiale]={id,qty}
let FORN={};                  // marchio -> fornitore
let AUTH={};                  // marchio -> autorizzato
let curTipo="Vista";

// ---------- Auth ----------
async function boot(){ const {data:{session}}=await sb.auth.getSession(); if(session) showApp(session); else $("#login").style.display="flex"; }
async function showApp(session){
  $("#login").style.display="none"; $("#app").style.display="block";
  const meta=session.user.user_metadata||{};
  ROLE=(meta.role==="admin")?"admin":"gestore"; isAdmin=ROLE==="admin";
  if(!isAdmin){ location.replace("ricircolo.html?denied=1"); return; }
  $("#who").innerHTML=esc(session.user.email)+' <span class="rolechip '+ROLE+'">'+ROLE+'</span>';
  renderTabbar(); var _v=TABS.filter(function(x){return !x.admin||isAdmin;}); if(_v.length)selectTab(_v[0].id); else $("#tabcontent").innerHTML='<div style="color:var(--muted);padding:16px">Nessuna sezione disponibile per il tuo ruolo.</div>';
}
$("#loginForm").addEventListener("submit",async e=>{ e.preventDefault(); const b=$("#loginBtn"),er=$("#loginErr"); er.textContent=""; b.disabled=true; b.textContent="Accesso…";
  const {data,error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pwd").value});
  b.disabled=false; b.textContent="Accedi"; if(error){er.textContent=error.message.includes("Invalid")?"Email o password non corretti.":error.message;return;} showApp(data.session); });
$("#logout").addEventListener("click",async()=>{ await sb.auth.signOut(); location.reload(); });

// ---------- Tab framework (estendibile) ----------
const TABS=[
  {id:"filtromaster", label:"Filtro master", render:renderFiltroMaster, admin:true},
  {id:"marchiattivi", label:"Marchi attivi", render:renderMarchiAttivi, admin:true},
  {id:"utenti", label:"Utenti", render:renderUtenti, admin:true},
  {id:"ricircolo", label:"Ricircolo", render:renderRicircolo, admin:true},
  {id:"permessi", label:"Permessi", render:renderPermessi, admin:true}
  // future: {id:"marchi", label:"Marchi alias", render:...}, {id:"filiali",...}, {id:"sistema",...}
];
let curTab=null;
function renderTabbar(){
  $("#tabbar").innerHTML=TABS.filter(t=>!t.admin||isAdmin).map(t=>'<button data-id="'+t.id+'"'+(t.id===curTab?' class="on"':'')+'>'+esc(t.label)+'</button>').join("");
  $("#tabbar").querySelectorAll("button").forEach(b=>b.onclick=()=>selectTab(b.dataset.id));
}
function selectTab(id){ curTab=id; renderTabbar(); const t=TABS.find(x=>x.id===id); $("#tabcontent").innerHTML=""; t.render($("#tabcontent")); }

// ---------- Tab: Utenti (solo admin) ----------
const EF_URL = SUPABASE_URL + "/functions/v1/user-management";
let U_LIST = [], U_ME = "";
async function efCall(method, path, body){
  const { data:{ session } } = await sb.auth.getSession();
  const tok = session ? session.access_token : "";
  const res = await fetch(EF_URL + (path||""), {
    method,
    headers:{ "Authorization":"Bearer "+tok, "apikey":SUPABASE_KEY, "Content-Type":"application/json" },
    body: (method==="GET") ? undefined : JSON.stringify(body||{})
  });
  let j={}; try{ j=await res.json(); }catch(e){}
  if(!res.ok) throw new Error((j&&j.error)||("Errore "+res.status));
  return j;
}
function uFmt(s){ if(!s) return "\u2014"; try{ const d=new Date(s); return d.toLocaleDateString("it-IT")+" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return "\u2014"; } }
async function renderUtenti(host){
  if(!isAdmin){ host.innerHTML='<div class="err">Sezione riservata agli amministratori.</div>'; return; }
  try{ const s=await sb.auth.getSession(); U_ME=(s&&s.data&&s.data.session&&s.data.session.user)?s.data.session.user.email:""; }catch(e){}
  host.innerHTML='<div class="utools"><button class="ubtn" id="uInvite">+ Invita utente</button><button class="ghost" id="uReload">Aggiorna</button></div><div id="uwrap"><div class="umuted">Caricamento utenti\u2026</div></div>';
  $("#uInvite").onclick=openInvite;
  $("#uReload").onclick=function(){ loadUtenti(); };
  await loadUtenti();
}
async function loadUtenti(){
  const wrap=$("#uwrap"); wrap.innerHTML='<div class="umuted">Caricamento utenti\u2026</div>';
  try{
    const j=await efCall("GET","");
    U_LIST=(j.users||[]).sort(function(a,b){ return (a.email||"").localeCompare(b.email||""); });
    drawUtenti();
  }catch(e){ wrap.innerHTML='<div class="err">Errore: '+esc(String((e&&e.message)||e))+'</div>'; }
}
function drawUtenti(){
  const rows=U_LIST.map(function(u){
    const dis=!!u.disabled, self=(u.email&&u.email===U_ME);
    const roleSel='<select class="urole" data-id="'+esc(u.id)+'"><option value="gestore"'+(u.role!=="admin"&&u.role!=="vendita"?" selected":"")+'>gestore</option><option value="vendita"'+(u.role==="vendita"?" selected":"")+'>vendita</option><option value="admin"'+(u.role==="admin"?" selected":"")+'>admin</option></select>';
    const pending=(!u.last_sign_in_at && !dis); const stato=dis?'<span class="ubadge off">Disattivato</span>':(pending?'<span class="ubadge" style="background:rgba(245,165,36,.2);color:#f5a524">In attesa</span>':'<span class="ubadge on">Attivo</span>');
    const toggleBtn='<button class="ghost usm" data-act="status" data-id="'+esc(u.id)+'" data-dis="'+(dis?"0":"1")+'">'+(dis?"Riattiva":"Disattiva")+'</button>';
    const delBtn=self?'':'<button class="ghost usm udel" data-act="del" data-id="'+esc(u.id)+'" data-email="'+esc(u.email||"")+'">Elimina</button>';
    return '<tr'+(dis?' class="disrow"':'')+'><td>'+esc(u.email||"\u2014")+(self?' <span class="umuted">(tu)</span>':'')+'</td><td>'+roleSel+'</td><td>'+stato+'</td><td>'+uFmt(u.created_at)+'</td><td>'+uFmt(u.last_sign_in_at)+'</td><td class="uacts">'+(pending?'<button class="ghost usm" data-act="reinvite" data-id="'+esc(u.id)+'" data-email="'+esc(u.email||"")+'">Re-invia invito</button>':'')+toggleBtn+delBtn+'</td></tr>';
  }).join("");
  $("#uwrap").innerHTML='<div class="utblwrap"><table class="utbl"><thead><tr><th>Email</th><th>Ruolo</th><th>Stato</th><th>Creazione</th><th>Ultimo accesso</th><th>Azioni</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="umuted" style="margin-top:8px">'+U_LIST.length+' utenti registrati</div>';
  $("#uwrap").querySelectorAll("select.urole").forEach(function(sel){ sel.onchange=function(){ changeRole(sel.dataset.id, sel.value, sel); }; });
  $("#uwrap").querySelectorAll("button.usm").forEach(function(b){ b.onclick=function(){ if(b.dataset.act==="status") toggleStatus(b.dataset.id, b.dataset.dis==="1"); else if(b.dataset.act==="reinvite") reinvite(b.dataset.email, b); else delUser(b.dataset.id, b.dataset.email); }; });
}
async function reinvite(email, btn){ if(!email)return; if(btn)btn.disabled=true; try{ await efCall("POST","/reinvite",{email:email}); toast("Invito re-inviato a "+email); }catch(e){ toast(String((e&&e.message)||e),true); } if(btn)btn.disabled=false; }
async function changeRole(id, role, sel){
  sel.disabled=true;
  try{ var _fil=null; if(role==="vendita"){ _fil=await uPickFiliale(); if(!_fil){ sel.disabled=false; loadUtenti(); return; } } await efCall("PATCH","/role",{id:id, role:role, filiale:_fil}); const u=U_LIST.find(function(x){return x.id===id;}); if(u){u.role=role; u.filiale=_fil;} toast("Ruolo aggiornato: "+role); }
  catch(e){ toast(String((e&&e.message)||e), true); loadUtenti(); }
  sel.disabled=false;
}
async function toggleStatus(id, disable){
  try{ await efCall("PATCH","/status",{id:id, disable:disable}); toast(disable?"Utente disattivato":"Utente riattivato"); await loadUtenti(); }
  catch(e){ toast(String((e&&e.message)||e), true); }
}
async function delUser(id, email){
  if(!confirm("Eliminare definitivamente l'utente "+email+" ?\nL'azione \u00e8 irreversibile.")) return;
  if(!confirm("Conferma finale: elimino "+email+" ?")) return;
  try{ await efCall("DELETE","",{id:id}); toast("Utente eliminato"); await loadUtenti(); }
  catch(e){ toast(String((e&&e.message)||e), true); }
}
function openInvite(){

async function loadData(){
  MAP={Vista:{},Sole:{}}; FORN={}; AUTH={};
  const r=await sb.from("assortimento_marchio").select("id,marchio,tipo_lenti,filiale,qty_ideale,fornitore,autorizzato");
  if(r.error){ $("#asStatus").innerHTML='<span style="color:var(--bad)">Errore: '+esc(r.error.message)+'</span>'; return; }
  (r.data||[]).forEach(row=>{
    const tp=row.tipo_lenti==="Sole"?"Sole":"Vista";
    if(!MAP[tp][row.marchio]) MAP[tp][row.marchio]={};
    MAP[tp][row.marchio][row.filiale]={id:row.id,qty:Number(row.qty_ideale)||0};
    if(row.fornitore!=null) FORN[row.marchio]=row.fornitore;
    if(row.autorizzato!=null) AUTH[row.marchio]=row.autorizzato;
  });
}

function fillFornitori(){
  const set=new Set();
  Object.keys(FORN).forEach(m=>{ if(FORN[m]) set.add(FORN[m]); });
  const cur=$("#fForn").value;
  $("#fForn").innerHTML='<option value="">Tutti</option>'+[...set].sort().map(f=>'<option value="'+esc(f)+'">'+esc(f)+'</option>').join("");
  if(cur) $("#fForn").value=cur;
}

function currentMarchi(){
  const fornSel=$("#fForn")?$("#fForn").value:"";
  const q=($("#fMar")?$("#fMar").value:"").trim().toLowerCase();
  let ms=Object.keys(MAP[curTipo]);
  if(fornSel) ms=ms.filter(m=>FORN[m]===fornSel);
  if(q) ms=ms.filter(m=>m.toLowerCase().includes(q));
  return ms.sort((a,b)=>a.localeCompare(b));
}

function depthOptions(currentN){ const opts=[{n:0,label:"Non previsto"}]; for(let i=1;i<=5;i++) opts.push({n:i,label:LADDER[i-1]}); return opts; }

function openCellEditor(td){
  if(td.querySelector("select")) return;
  const m=td.dataset.m, f=td.dataset.f;
  const e=MAP[curTipo][m]?MAP[curTipo][m][f]:null;
  const n0=qtyToN(e?e.qty:0);
  const sel=document.createElement("select");
  depthOptions(n0).forEach(o=>{ const op=document.createElement("option"); op.value=o.n; op.textContent=o.label; if(o.n===n0)op.selected=true; sel.appendChild(op); });
  td.innerHTML=""; td.appendChild(sel); sel.focus();
  let done=false;
  const finish=async(commit)=>{ if(done)return; done=true; const n=parseInt(sel.value,10);
    if(commit && n!==n0){ await saveDepth(m,f,n,td); } else { td.innerHTML=cellHtml(m,f); } };
  sel.onchange=()=>finish(true);
  sel.onblur=()=>finish(true);
  sel.onkeydown=ev=>{ if(ev.key==="Escape")finish(false); if(ev.key==="Enter")finish(true); };
}

async function saveDepth(m,f,n,td){
  const qty=nToQty(n);
  const e=MAP[curTipo][m]?MAP[curTipo][m][f]:null;
  let res;
  if(e && e.id!=null){ res=await sb.from("assortimento_marchio").update({qty_ideale:qty,modificata_il:new Date().toISOString()}).eq("id",e.id).select(); }
  else{ res=await sb.from("assortimento_marchio").insert({marchio:m,tipo_lenti:curTipo,filiale:f,qty_ideale:qty,fornitore:FORN[m]||null,autorizzato:(AUTH[m]!=null?AUTH[m]:true),modificata_il:new Date().toISOString()}).select(); }
  if(res.error){ toast("Errore salvataggio: "+res.error.message,true); td.innerHTML=cellHtml(m,f); return; }
  const row=(res.data&&res.data[0])||null;
  if(!MAP[curTipo][m]) MAP[curTipo][m]={};
  MAP[curTipo][m][f]={id:row?row.id:(e?e.id:null),qty:qty};
  td.innerHTML=cellHtml(m,f); td.classList.remove("flash"); void td.offsetWidth; td.classList.add("flash");
  toast("Salvato: "+m+" · "+FIL_NAME[f]+" → "+(nToCode(n)||"Non previsto"));
}

async function maDelete(marchio){ if(!confirm("Eliminare la mappatura per "+marchio+"?"))return; try{ await sb.from("marchi_fornitori_attivi").delete().eq("marchio",marchio); MA_ROWS=MA_ROWS.filter(function(x){return x.marchio!==marchio;}); maDraw(); toast("Eliminato"); }catch(e){ toast(String((e&&e.message)||e),true); } }
function maOpenAdd(){
  openModal('<h3 style="margin:0 0 12px">Aggiungi marchio attivo</h3><label>Marchio</label><input id="maSearch" placeholder="cerca…" style="width:100%;margin-bottom:4px"><select id="maMarSel" size="6" class="urole" style="width:100%"><option>Caricamento…</option></select><label style="margin-top:8px;display:block">Fornitore attivo</label><select id="maNewForn" class="urole" style="width:100%" disabled><option value="">Seleziona prima il marchio</option></select><div class="err" id="maErr" style="min-height:16px;margin-top:8px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="maCancel">Annulla</button><button class="ubtn" id="maOk">Aggiungi</button></div>');
  window.__maMarchi=[];
  $("#maCancel").onclick=closeModal;
  (async function(){ try{ var rm=await sb.rpc("sv_g_marchi",{p_fornitore:null}); window.__maMarchi=(rm.data||[]).map(function(x){return typeof x==="string"?x:(x.marchio||x.label||Object.values(x)[0]);}); maRenderMarchi(""); }catch(e){ $("#maMarSel").innerHTML='<option value="">Errore marchi</option>'; } })();
  $("#maSearch").oninput=function(){ maRenderMarchi($("#maSearch").value); };
  $("#maMarSel").onchange=async function(){ var m=$("#maMarSel").value; var sel=$("#maNewForn"); if(!m){ sel.disabled=true; sel.innerHTML='<option value="">Seleziona prima il marchio</option>'; return; } sel.disabled=false; sel.innerHTML='<option>Caricamento…</option>'; try{ var rf=await sb.rpc("sv_g_fornitori_per_marchio",{p_marchio:m}); var fs=(rf.data||[]).map(function(x){return typeof x==="string"?x:(x.fornitore||x.label||Object.values(x)[0]);}); sel.innerHTML='<option value="">Seleziona fornitore</option>'+fs.map(function(f){return '<option value="'+esc(f)+'">'+esc(f)+'</option>';}).join(""); }catch(e){ sel.innerHTML='<option value="">Errore fornitori</option>'; } };
  $("#maOk").onclick=async function(){ var m=$("#maMarSel").value; var f=$("#maNewForn").value; var err=$("#maErr"); if(!m){ err.textContent="Seleziona un marchio."; return; } if(!f){ err.textContent="Seleziona un fornitore."; return; } if(MA_ROWS.find(function(x){return x.marchio===m;})){ err.textContent="Marchio già mappato."; return; } try{ await sb.from("marchi_fornitori_attivi").upsert({marchio:m,fornitore_attivo:f,aggiornato_il:new Date().toISOString()},{onConflict:"marchio"}); MA_ROWS.push({marchio:m,fornitore_attivo:f,note:null}); MA_ROWS.sort(function(a,b){return fmCmp(a.marchio,b.marchio);}); closeModal(); maDraw(); toast("Aggiunto: "+m); }catch(e){ err.textContent=String((e&&e.message)||e); } };
}
function maRenderMarchi(q){ q=String(q||"").toLowerCase(); var list=(window.__maMarchi||[]).filter(function(m){return !q||String(m).toLowerCase().indexOf(q)>=0;}); $("#maMarSel").innerHTML=list.length?list.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join(""):'<option value="">Nessun marchio</option>'; }

// ---------- Tab: Ricircolo (solo admin) ----------
const RC_FILIALI=[["D","Catania"],["I","Portali"],["G","Giarre"],["Z","Viale Africa"],["C","Acireale"],["E","Augusta"],["H","Lentini"],["B","Paternò"]];
function rcFlash(row){ row.style.transition="background .15s ease"; row.style.background="rgba(54,201,141,.30)"; setTimeout(function(){ row.style.background=""; },500); }
async function rcSaveOn(code,dir,nota){ var res=await sb.from("ricircolo_esclusioni").upsert({filiale:code,direzione:dir,nota:(nota||null),modificato_il:new Date().toISOString()},{onConflict:"filiale,direzione"}); if(res&&res.error)throw res.error; }
async function rcSaveOff(code,dir){ var res=await sb.from("ricircolo_esclusioni").delete().eq("filiale",code).eq("direzione",dir); if(res&&res.error)throw res.error; }
async function rcMFSaveOn(tipo,valore){ var res=await sb.from("ricircolo_esclusioni_marchi").upsert({tipo:tipo,valore:valore,modificato_il:new Date().toISOString()},{onConflict:"tipo,valore"}); if(res&&res.error)throw res.error; }
async function rcMFSaveOff(tipo,valore){ var res=await sb.from("ricircolo_esclusioni_marchi").delete().eq("tipo",tipo).eq("valore",valore); if(res&&res.error)throw res.error; }
async function rcRenderMF(wrap){
  if(!wrap)return;
  try{
    var ex=await sb.from("ricircolo_esclusioni_marchi").select("tipo,valore"); if(ex.error)throw ex.error;
    var exForn={}, exMar={};
    (ex.data||[]).forEach(function(r){ if(r.tipo==="fornitore")exForn[r.valore]=1; else if(r.tipo==="marchio")exMar[r.valore]=1; });
    var rf=await sb.rpc("sv_g_fornitori"); if(rf.error)throw rf.error;
    var rm=await sb.rpc("sv_g_marchi",{p_fornitore:null}); if(rm.error)throw rm.error;
    var forn=(rf.data||[]).map(function(x){return x.fornitore;}).filter(Boolean);
    var mar=(rm.data||[]).map(function(x){return x.marchio;}).filter(Boolean);
    forn.sort(function(a,b){return String(a).localeCompare(String(b));});
    mar.sort(function(a,b){return String(a).localeCompare(String(b));});
    function rowHtml(tipo,val,on){ return '<div class="rcMFRow" data-tipo="'+tipo+'" data-val="'+esc(val)+'" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px"><input type="checkbox" class="rcMFChk" '+(on?"checked":"")+'> '+esc(val)+'</label></div>'; }
    var fCount=Object.keys(exForn).length, mCount=Object.keys(exMar).length;
    wrap.innerHTML=''
      +'<h3 style="margin:0 0 4px;font-size:15px">Marchi e fornitori esclusi</h3>'
      +'<p class="umuted" style="margin:0 0 12px;font-size:12.5px">Marchi e fornitori spuntati non generano nuovi ricircoli. I ricircoli già presenti restano visibili.</p>'
      +'<div style="display:flex;gap:20px;align-items:flex-start">'
        +'<div style="flex:1;min-width:0">'
          +'<h4 style="margin:0 0 8px;font-size:14px">Fornitori esclusi <span id="rcFornBadge" class="urole" style="font-size:11px">'+fCount+' esclusi</span></h4>'
          +'<div id="rcFornList" style="max-height:340px;overflow:auto;padding-right:4px">'+forn.map(function(v){return rowHtml("fornitore",v,!!exForn[v]);}).join("")+'</div>'
        +'</div>'
        +'<div style="flex:1;min-width:0">'
          +'<h4 style="margin:0 0 8px;font-size:14px">Marchi esclusi <span id="rcMarBadge" class="urole" style="font-size:11px">'+mCount+' esclusi</span></h4>'
          +'<input id="rcMarSearch" class="urole" placeholder="Cerca marchio…" style="width:100%;margin-bottom:8px;font-size:13px">'
          +'<div id="rcMarList" style="max-height:340px;overflow:auto;padding-right:4px">'+mar.map(function(v){return rowHtml("marchio",v,!!exMar[v]);}).join("")+'</div>'
        +'</div>'
      +'</div>';
    function updBadge(tipo){ var list=wrap.querySelectorAll('.rcMFRow[data-tipo="'+tipo+'"] .rcMFChk'); var n=0; list.forEach(function(c){if(c.checked)n++;}); var b=wrap.querySelector(tipo==="fornitore"?"#rcFornBadge":"#rcMarBadge"); if(b)b.textContent=n+" esclusi"; }
    wrap.querySelectorAll(".rcMFRow").forEach(function(row){
      var tipo=row.dataset.tipo, val=row.dataset.val, chk=row.querySelector(".rcMFChk");
      chk.onchange=async function(){ try{ if(chk.checked){ await rcMFSaveOn(tipo,val); } else { await rcMFSaveOff(tipo,val); } rcFlash(row); updBadge(tipo); }catch(e){ chk.checked=!chk.checked; toast(String((e&&e.message)||e),true); } };
    });
    var srch=wrap.querySelector("#rcMarSearch");
    if(srch){ srch.oninput=function(){ var q=srch.value.toLowerCase(); wrap.querySelectorAll('.rcMFRow[data-tipo="marchio"]').forEach(function(row){ row.style.display=(String(row.dataset.val).toLowerCase().indexOf(q)>-1)?"":"none"; }); }; }
  }catch(e){ wrap.innerHTML='<div class="err">Errore caricamento marchi/fornitori: '+esc(String((e&&e.message)||e))+'</div>'; }
}

async function renderRicircolo(host){
  if(!isAdmin){ host.innerHTML='<div class="err">Sezione riservata agli amministratori.</div>'; return; }
  host.innerHTML='<div class="umuted">Caricamento…</div>';
  var rows;
  try{ var r=await sb.from("ricircolo_esclusioni").select("filiale,direzione,nota"); if(r.error)throw r.error; rows=r.data||[]; }
  catch(e){ host.innerHTML='<div class="err">Errore: '+esc(String((e&&e.message)||e))+'</div>'; return; }
  var map={}; rows.forEach(function(x){ map[x.filiale+"|"+x.direzione]=(x.nota||""); });
  function has(code,dir){ return (code+"|"+dir) in map; }
  function note(code,dir){ return map[code+"|"+dir]||""; }
  function section(dir,titolo,sub){
    return '<div style="flex:1;min-width:0">'
      +'<h3 style="margin:0 0 4px;font-size:15px">'+esc(titolo)+'</h3>'
      +'<p class="umuted" style="margin:0 0 12px;font-size:12.5px">'+esc(sub)+'</p>'
      +RC_FILIALI.map(function(f){ var code=f[0],nome=f[1],on=has(code,dir);
        return '<div class="rcRow" data-code="'+code+'" data-dir="'+dir+'" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px">'
          +'<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px"><input type="checkbox" class="rcChk" '+(on?"checked":"")+'> '+esc(nome)+' <span class="umuted" style="font-size:11px">('+code+')</span></label>'
          +'<input class="urole rcNota" placeholder="nota (facoltativa)" value="'+esc(note(code,dir))+'" style="width:100%;margin-top:6px;font-size:12.5px;'+(on?"":"display:none")+'">'
          +'</div>';
      }).join("")+'</div>';
  }
  host.innerHTML='<p class="umuted" style="margin:0 0 12px">Esclusioni per il motore di ricircolo. Un negozio può essere escluso in uscita, in entrata, o entrambe.</p>'
    +'<div style="display:flex;gap:20px;align-items:flex-start">'
    +section("uscita","Negozi esclusi dall’uscita","Da questi negozi non si preleva mai per il ricircolo")
    +section("entrata","Negozi esclusi dall’entrata","Questi negozi non ricevono mai pezzi dal ricircolo")
    +'</div>'
    +'<div id="rcMFwrap" style="margin-top:22px;border-top:1px solid var(--line);padding-top:16px"><div class="umuted">Caricamento marchi e fornitori…</div></div>';
  rcRenderMF(host.querySelector("#rcMFwrap"));
  host.querySelectorAll(".rcRow").forEach(function(row){
    var code=row.dataset.code, dir=row.dataset.dir;
    var chk=row.querySelector(".rcChk"), nota=row.querySelector(".rcNota");
    chk.onchange=async function(){ try{ if(chk.checked){ await rcSaveOn(code,dir,nota.value); nota.style.display=""; } else { await rcSaveOff(code,dir); nota.style.display="none"; nota.value=""; } rcFlash(row); }catch(e){ chk.checked=!chk.checked; toast(String((e&&e.message)||e),true); } };
    nota.onblur=async function(){ if(!chk.checked)return; try{ await rcSaveOn(code,dir,nota.value); rcFlash(row); }catch(e){ toast(String((e&&e.message)||e),true); } };
  });
}

// ---------- Tab: Permessi ruoli (solo admin) ----------
const RP_PAGES=[["presenza","Controllo presenza"],["assortimento","Assortimento ideale"],["ricircolo","Ricircolo"],["aggiornamenti","Aggiornamenti"],["impostazioni","Impostazioni"]];
const RP_ROLES=[["gestore","Gestore"],["vendita","Vendita"]];
function rpFlash(row){ row.style.transition="background .15s ease"; row.style.background="rgba(54,201,141,.30)"; setTimeout(function(){ row.style.background=""; },500); }
async function rpSave(ruolo,pagina,acc,mod){ var res=await sb.from("ruoli_permessi").upsert({ruolo:ruolo,pagina:pagina,puo_accedere:acc,puo_modificare:mod},{onConflict:"ruolo,pagina"}); if(res&&res.error)throw res.error; }
async function renderPermessi(host){
  if(!isAdmin){ host.innerHTML='<div class="err">Sezione riservata agli amministratori.</div>'; return; }
  host.innerHTML='<div class="umuted">Caricamento…</div>';
  var rows;
  try{ var r=await sb.from("ruoli_permessi").select("ruolo,pagina,puo_accedere,puo_modificare"); if(r.error)throw r.error; rows=r.data||[]; }
  catch(e){ host.innerHTML='<div class="err">Errore: '+esc(String((e&&e.message)||e))+'</div>'; return; }
  var map={}; rows.forEach(function(x){ map[x.ruolo+"|"+x.pagina]={acc:!!x.puo_accedere,mod:!!x.puo_modificare}; });
  function cell(ruolo,pagina){ var p=map[ruolo+"|"+pagina]||{acc:false,mod:false};
    return '<td class="rpCell" data-r="'+ruolo+'" data-p="'+pagina+'" style="text-align:center;white-space:nowrap">'
      +'<label style="margin-right:10px;font-size:12px;color:var(--muted)"><input type="checkbox" class="rpAcc" '+(p.acc?"checked":"")+'> Accesso</label>'
      +'<label style="font-size:12px;color:var(--muted)"><input type="checkbox" class="rpMod" '+(p.mod?"checked":"")+'> Modifica</label></td>'; }
  var head='<tr><th>Pagina</th><th style="text-align:center">Admin</th>'+RP_ROLES.map(function(rr){return '<th style="text-align:center">'+esc(rr[1])+'</th>';}).join("")+'</tr>';
  var body=RP_PAGES.map(function(pg){ return '<tr><td><b>'+esc(pg[1])+'</b></td><td style="text-align:center;color:var(--ok);font-size:12px">✓ Accesso · ✓ Modifica</td>'+RP_ROLES.map(function(rr){return cell(rr[0],pg[0]);}).join("")+'</tr>'; }).join("");
  host.innerHTML='<p class="umuted" style="margin:0 0 12px">Chi può <b>accedere</b> a ogni pagina e chi può <b>modificarne</b> i dati. L’admin ha sempre accesso completo (non modificabile). Salvataggio immediato.</p><div class="utblwrap"><table class="utbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  host.querySelectorAll("td.rpCell").forEach(function(td){ var ruolo=td.dataset.r, pagina=td.dataset.p; var acc=td.querySelector(".rpAcc"), mod=td.querySelector(".rpMod");
    async function save(){ try{ await rpSave(ruolo,pagina,acc.checked,mod.checked); rpFlash(td.parentElement); }catch(e){ toast(String((e&&e.message)||e),true); } }
    acc.onchange=function(){ if(!acc.checked)mod.checked=false; save(); };
    mod.onchange=function(){ if(mod.checked)acc.checked=true; save(); };
  });
}

function uPickFiliale(cur){ return new Promise(function(resolve){
  openModal('<h3 style="margin:0 0 10px">Filiale del venditore</h3><label>Filiale</label><select id="ufSel" class="urole" style="width:100%"><option value="">— seleziona —</option>'+RC_FILIALI.map(function(f){return '<option value="'+f[0]+'"'+(cur===f[0]?" selected":"")+'>'+esc(f[1])+'</option>';}).join("")+'</select><div class="err" id="ufErr" style="min-height:16px;margin-top:8px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="ufCancel">Annulla</button><button class="ubtn" id="ufOk">Salva</button></div>');
  $("#ufCancel").onclick=function(){ closeModal(); resolve(null); };
  $("#ufOk").onclick=function(){ var v=$("#ufSel").value; if(!v){ $("#ufErr").textContent="Filiale obbligatoria."; return; } closeModal(); resolve(v); };
}); }
function openModal(html){ $("#modal").innerHTML=html; $("#modalBack").classList.add("open"); }
function closeModal(){ $("#modalBack").classList.remove("open"); $("#modal").innerHTML=""; }
$("#modalBack").addEventListener("click",e=>{ if(e.target.id==="modalBack") closeModal(); });
let toastT=null;
function toast(msg,isErr){ const el=$("#toast"); el.textContent=msg; el.className="toast show"+(isErr?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>el.className="toast"+(isErr?" err":""),2600); }

boot();

(async function(){try{const {data:{session}}=await sb.auth.getSession();const _r=session&&session.user&&session.user.user_metadata&&session.user.user_metadata.role;if(_r==='admin'){var e=document.getElementById('navRevisioni');if(e)e.style.display='';}}catch(e){}})();
</script>
