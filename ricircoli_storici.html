<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StockView — Ricircoli effettuati</title>
<style>
  :root{--bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#26384c;--txt:#e8eef5;--muted:#8aa0b6;--accent:#3da9fc;--ok:#36c98d;--bad:#ff6b6b;--truck:#f5a524}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  h1{font-size:17px;margin:0}
  nav{display:flex;gap:6px}
  nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:4px 8px;border-radius:8px}
  nav a.cur{color:var(--accent);background:rgba(61,169,252,.1)}
  .spacer{flex:1}
  .rightlink{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-right:14px}
  .who{color:var(--muted);font-size:12.5px}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer}
  .wrap{padding:18px 22px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  select,input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  th{position:sticky;top:58px;background:var(--panel2);color:var(--muted);text-align:left;padding:9px 12px;font-size:12px;z-index:5}
  td{padding:9px 12px;border-top:1px solid var(--line)}
  .empty{color:var(--muted);padding:20px;text-align:center}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px}
  .btn{background:var(--accent);border:none;color:#04121f;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:default}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:340px}
  #app{display:none}
</style>
</head>
<body>
<div id="login"><div class="card"><div class="brand" style="margin-bottom:12px"><div class="dot">S</div><h1>StockView</h1></div><p class="who">Devi accedere.</p><p><a href="presenza.html" style="color:var(--accent)">Vai al login</a></p></div></div>
<div id="app">
  <header>
    <div class="brand"><div class="dot">S</div><h1>StockView</h1></div>
    <nav>
      <a href="presenza.html">Controllo presenza</a>
      <a href="assortimento.html">Assortimento ideale</a>
      <a href="ricircolo.html">Ricircolo</a>
      <a href="revisioni.html" id="navRevisioni" style="display:none">Aggiornamenti</a>
    </nav>
    <div class="spacer"></div>
    <a href="impostazioni.html" class="rightlink">Impostazioni</a>
    <span class="who" id="who"></span>
    <button class="ghost" id="logout" style="display:none">Esci</button>
  </header>
  <div class="wrap">
    <div style="font-size:18px;font-weight:700;margin-bottom:10px">📦 Ricircoli effettuati</div>
    <div class="bar">
      <span class="who">Filtri:</span>
      <select id="fFil"></select>
      <select id="fMar"><option value="">Tutti i marchi</option></select>
      <select id="fPer"><option value="">Tutto</option><option value="mese">Ultimo mese</option><option value="trim">Ultimo trimestre</option><option value="anno">Ultimo anno</option></select>
      <span class="who" id="cnt"></span>
    </div>
    <div id="body"><div class="empty">Caricamento…</div></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://exrlurfvydxrqfzjdobp.supabase.co";
const SUPABASE_KEY="sb_publishable_0mNbCOZLSV-ug9iJ9jLrNA_RabyY_LM";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
function esc(s){s=String(s==null?"":s);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");}
var FN={D:"Catania",I:"Portali",G:"Giarre",Z:"Viale Africa",C:"Acireale",E:"Augusta",H:"Lentini",B:"Paternò",A:"Deposito"};
function filName(c){return FN[c]||c||"";}
var ROWS=[], PAGE=0, PER=50, RC_ROLE="gestore", RC_FIL=null;
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("#login").style.display="flex"; return; }
  $("#login").style.display="none"; $("#app").style.display="block";
  $("#who").textContent=session.user.email; $("#logout").style.display="";
  var md=session.user.user_metadata||{}; RC_ROLE=md.role||"gestore"; RC_FIL=md.filiale||null;
  if(RC_ROLE!=="vendita"){ var nr=$("#navRevisioni"); if(nr)nr.style.display=""; }
  $("#logout").addEventListener("click",async()=>{ await sb.auth.signOut(); location.href="presenza.html"; });
  buildFilters();
  await load();
}
function buildFilters(){
  var sel=$("#fFil");
  if(RC_ROLE==="vendita"){ sel.style.display="none"; }
  else{ var codes=["D","I","G","Z","C","E","H","B"]; sel.innerHTML='<option value="">Tutte le filiali</option>'+codes.map(function(c){return '<option value="'+c+'">'+esc(filName(c))+'</option>';}).join(""); }
  $("#fFil").addEventListener("change",function(){PAGE=0;render();});
  $("#fMar").addEventListener("change",function(){PAGE=0;render();});
  $("#fPer").addEventListener("change",function(){PAGE=0;render();});
}
async function load(){
  $("#body").innerHTML='<div class="empty">Caricamento…</div>';
  var q=sb.from("ricircoli").select("*").eq("stato","trasferito").order("aggiornato_il",{ascending:false}).limit(5000);
  if(RC_ROLE==="vendita" && RC_FIL){ q=q.or("filiale_da.eq."+RC_FIL+",filiale_a.eq."+RC_FIL); }
  try{ var r=await q; if(r.error)throw r.error; ROWS=r.data||[]; }
  catch(e){ $("#body").innerHTML='<div class="empty" style="color:var(--bad)">Errore: '+esc(String((e&&e.message)||e))+'</div>'; return; }
  var mars=[...new Set(ROWS.map(function(x){return x.marchio;}).filter(Boolean))].sort();
  $("#fMar").innerHTML='<option value="">Tutti i marchi</option>'+mars.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join("");
  render();
}
function inPeriod(d, per){ if(!per)return true; if(!d)return false; var diff=Date.now()-d.getTime(); var day=86400000; if(per==="mese")return diff<=31*day; if(per==="trim")return diff<=92*day; if(per==="anno")return diff<=366*day; return true; }
function render(){
  var ff=$("#fFil").value, fm=$("#fMar").value, fp=$("#fPer").value;
  var rows=ROWS.filter(function(x){ if(ff && x.filiale_da!==ff && x.filiale_a!==ff)return false; if(fm && x.marchio!==fm)return false; if(fp && !inPeriod(x.aggiornato_il?new Date(x.aggiornato_il):null, fp))return false; return true; });
  $("#cnt").innerHTML='<b>'+rows.length+'</b> trasferimenti';
  var body=$("#body");
  if(!rows.length){ body.innerHTML='<div class="empty">Nessun ricircolo effettuato.</div>'; $("#pager").innerHTML=""; return; }
  var pages=Math.ceil(rows.length/PER); if(PAGE>=pages)PAGE=pages-1; if(PAGE<0)PAGE=0;
  var slice=rows.slice(PAGE*PER,(PAGE+1)*PER);
  var head='<tr><th>Data trasferimento</th><th>Barcode</th><th>Marchio · Modello · Colore</th><th>Da → A</th><th>Giorni impiegati</th></tr>';
  var b=slice.map(function(x){ var ag=x.aggiornato_il?new Date(x.aggiornato_il):null; var cr=x.creato_il?new Date(x.creato_il):null; var gg=(ag&&cr)?Math.max(0,Math.round((ag.getTime()-cr.getTime())/86400000)):"-"; var desc=[x.marchio,x.modello,x.colore].filter(Boolean).join(" · "); return '<tr><td style="white-space:nowrap">'+(ag?ag.toLocaleDateString("it-IT"):"-")+'</td><td>'+esc(x.barcode||"")+'</td><td>'+esc(desc)+'</td><td style="white-space:nowrap">'+esc(filName(x.filiale_da))+' → '+esc(filName(x.filiale_a))+'</td><td>'+gg+(gg==="-"?"":"g")+'</td></tr>'; }).join("");
  body.innerHTML='<table><thead>'+head+'</thead><tbody>'+b+'</tbody></table>';
  var pg='<button class="btn" id="prev"'+(PAGE<=0?" disabled":"")+'>‹ Prec</button><span class="who">Pagina '+(PAGE+1)+' di '+pages+'</span><button class="btn" id="next"'+(PAGE>=pages-1?" disabled":"")+'>Succ ›</button>';
  $("#pager").innerHTML=pg;
  var pv=$("#prev"), nx=$("#next"); if(pv)pv.onclick=function(){PAGE--;render();}; if(nx)nx.onclick=function(){PAGE++;render();};
}
boot();
</script>
</body>
</html>
