<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordini LAC</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--line:#dde2e9;--pri:#1f5fbf;--ok:#1d7a46;--warn:#b26a00;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--line:#2e3846;--pri:#6aa3ff;--ok:#4cc38a;--warn:#f0b050;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--line:#2e3846;--pri:#6aa3ff;--ok:#4cc38a;--warn:#f0b050;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:17px}
main{max-width:1500px;margin:0 auto;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
h2{font-size:15px;margin:0 0 6px}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}
select,input,textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
select:disabled{opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:8px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.small{padding:7px 10px;font-size:14px}
button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{padding:7px}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.msg{padding:6px 10px;border-radius:8px;margin:6px 0;font-size:13px}
.msg.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.msg.err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.mut{color:var(--mut);font-size:13px}
.eye{border-left:4px solid var(--pri)}
.eye.sx{border-left-color:var(--ok)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.hide{display:none}
.eyes{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.gr{display:grid;gap:8px}
.g1{grid-template-columns:1fr}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gf{grid-template-columns:1fr 2fr}
.eh{min-height:34px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.eh2{display:flex;align-items:center;gap:10px}
.top{display:grid;grid-template-columns:1.3fr 1.2fr 1.2fr 1fr 1fr;gap:8px;align-items:end}
.bot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
@media (max-width:900px){.top{grid-template-columns:1fr 1fr}.bot{grid-template-columns:1fr}}
@media (max-width:900px){.eyes{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.eye.off{opacity:.45}
.sw{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--tx)}
.sw input{width:auto}
.eyes .card{margin-bottom:0}
</style>
</head>
<body>
<header><b>Ordini lenti a contatto</b><span id="who" class="mut"></span></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL="https://exrlurfvydxrqfzjdobp.supabase.co";
const SUPA_KEY="sb_publishable_0mNbCOZLSV-ug9iJ9jLrNA_RabyY_LM";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{db:{schema:"lac"}});
const $=s=>document.querySelector(s);
const app=$("#app");
const S={profilo:null,negozio:null,fornitori:[],prodotti:[],regole:{},motivi:[],tab:"nuovo",occhi:{DX:null,SX:null},msg:null};

/* ---------- utilità parametri ---------- */
const f2=n=>(n>0?"+":"")+n.toFixed(2);
function gen(da,a,passo){ // lista valori da..a (anche decrescente)
  if(isNaN(da)||isNaN(a)||!passo)return [];
  const lo=Math.min(da,a),hi=Math.max(da,a),out=[];
  const n=Math.round((hi-lo)/passo);
  for(let i=0;i<=n;i++)out.push(Math.round((lo+i*passo)*100)/100);
  return out;
}
function parseTratti(t){
  if(!t)return[];
  const set=new Set();
  t.split(";").forEach(seg=>{
    const p=seg.split(":");
    if(p.length<3)return;
    gen(parseFloat(p[0]),parseFloat(p[1]),parseFloat(p[2])).forEach(v=>set.add(v));
  });
  return [...set].sort((x,y)=>x-y);
}
function parseLista(t){ // "a|b|c" oppure "da..a/passo"
  if(!t)return null;
  const m=t.match(/^(-?[\d.]+)\.\.(-?[\d.]+)\/([\d.]+)$/);
  if(m)return gen(parseFloat(m[1]),parseFloat(m[2]),parseFloat(m[3]));
  return t.split("|").map(x=>parseFloat(x)).filter(x=>!isNaN(x));
}
function parseCurve(t){ // "8.60" o "8.40|8.60" o "7.10..9.80/0.3"
  return parseLista(t)||[];
}
function parseAdd(t){ // opzioni addizione; null = non parsabile
  if(!t)return null;
  const pulita=t.replace(/\[.*?\]/g,"").trim();
  if(/^[+\d.|\s]+$/.test(pulita))return pulita.split("|").map(x=>x.trim()).filter(Boolean);
  const m=pulita.match(/(?:^|\|)\s*([A-Za-zÀ-ù ]+(?:\([A-Z]+\))?)\s*:/g);
  if(m&&!/CD:|CN:|A =|SPH/.test(pulita))return m.map(x=>x.replace(/^[|\s]+/,"").replace(/:$/,"").trim());
  return null;
}
function righeDi(p){ // regole del prodotto, già decodificate
  const rr=S.regole[p.listino_id]||[];
  return rr.map(r=>({
    r,
    sfere:parseTratti(r.sfera_tratti),
    cils:r.cilindri?parseLista(r.cilindri):null,
    assi:r.assi?parseLista(r.assi):null,
    curve:parseCurve(r.curva_base),
    diam:parseCurve(r.diametro),
    add:parseAdd(r.addizioni),
    addRaw:r.addizioni
  }));
}
const uniq=a=>[...new Set(a)];
const sortN=a=>[...a].sort((x,y)=>x-y);

/* ---------- avvio / login ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  await caricaTutto();
}
function loginView(err){
  app.innerHTML=`<div class="card"><h2>Accedi</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  ${err?`<div class="msg err">${err}</div>`:""}
  <p><button id="go">Entra</button></p></div>`;
  $("#go").onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error)return loginView("Email o password non corrette.");
    await caricaTutto();
  };
}
async function caricaTutto(){
  const {data:{user}}=await sb.auth.getUser();
  const {data:pr}=await sb.from("profili").select("*").eq("user_id",user.id).maybeSingle();
  if(!pr){app.innerHTML=`<div class="card"><div class="msg err">Utente non ancora abilitato. Avvisa la direzione.</div><button class="sec" onclick="esci()">Esci</button></div>`;return;}
  S.profilo=pr;
  const [neg,forn,prod,reg,mot]=await Promise.all([
    sb.from("negozi").select("*").order("nome"),
    sb.from("fornitori").select("*").order("nome"),
    sb.from("prodotti").select("*").eq("ordinabile",true).order("modello"),
    sb.from("regole_parametri").select("*"),
    sb.from("motivi_prova").select("*").eq("attivo",true).order("id")
  ]);
  S.negozi=neg.data||[];S.fornitori=forn.data||[];S.prodotti=prod.data||[];S.motivi=mot.data||[];
  S.regole={};(reg.data||[]).forEach(r=>{(S.regole[r.listino_id]=S.regole[r.listino_id]||[]).push(r)});
  S.negozio=S.negozi.find(n=>n.id===pr.negozio_id)||null;
  $("#who").innerHTML=`${pr.nome||""} · ${S.negozio?S.negozio.nome:pr.ruolo} · <a href="#" onclick="esci();return false">esci</a>`;
  S.occhi={DX:nuovoOcchio(),SX:nuovoOcchio()};
  if(pr.ruolo!=="negozio")S.tab="centrale";
  render();
}
async function esci(){await sb.auth.signOut();location.reload()}
function nuovoOcchio(){return{libero:false,attivo:true,forn:"",prod:"",sfera:"",cil:"",asse:"",add:"",curva:"",diam:"",qta:1}}

/* ---------- vista nuovo ordine ---------- */
function render(){
  const centrale=S.profilo.ruolo!=="negozio";
  const tabs=`<div class="tabs">${centrale?`<button class="${S.tab==="centrale"?"on":""}" onclick="S.tab='centrale';render()">Da lavorare</button>`:""}<button class="${S.tab==="nuovo"?"on":""}" onclick="S.tab='nuovo';render()">Nuovo ordine</button><button class="${S.tab==="miei"?"on":""}" onclick="S.tab='miei';render()">${centrale?"Tutti gli ordini":"I miei ordini"}</button></div>`;
  if(S.tab==="centrale"){app.innerHTML=tabs+`<div id="cen"></div>`;return vistaCentrale();}
  if(S.tab==="miei"){app.innerHTML=tabs+`<div id="lista" class="card">Caricamento…</div>`;return listaOrdini();}
  if(centrale&&!S.negozio){S.negozio=S.negozi[0]}
  app.innerHTML=tabs+`
  <div class="card"><div class="top">
   <div><label>Tipo *${S.profilo.ruolo==="negozio"?(S.negozio?` · ${S.negozio.nome}`:""):""}</label>${S.profilo.ruolo==="negozio"?"":`<select id="negsel" style="margin-bottom:4px">${S.negozi.map(n=>`<option value="${n.id}" ${S.negozio&&S.negozio.id===n.id?"selected":""}>${n.nome}</option>`).join("")}</select>`}<select id="tipo"><option value="prova">Lenti di prova</option><option value="vendita_cliente">Ordine cliente (vendita)</option><option value="scorta_negozio">Scorta negozio</option></select></div>
   <div class="cli"><label>Cognome *</label><input id="cog" autocomplete="off"></div>
   <div class="cli"><label>Nome *</label><input id="nom" autocomplete="off"></div>
   <div class="cli"><label>Codice cliente Focus *</label><input id="cod" inputmode="numeric" autocomplete="off"></div>
   <div id="forw" class="hide"><label>Numero fornitura *</label><input id="forn" inputmode="numeric" autocomplete="off"></div>
  </div></div>
  <div id="occ"></div>
  <div class="card"><div class="bot"><div><label id="notelab">Note</label><textarea id="note" rows="1" style="resize:vertical"></textarea></div><button id="invia">Invia ordine</button></div>
   <div id="esito"></div></div>`;
  const ns=$("#negsel");if(ns)ns.onchange=()=>{S.negozio=S.negozi.find(n=>n.id==ns.value)};
  $("#tipo").onchange=()=>{
    const t=$("#tipo").value;
    $("#forw").classList.toggle("hide",t!=="vendita_cliente");
    document.querySelectorAll(".cli").forEach(x=>x.classList.toggle("hide",t==="scorta_negozio"));
  };
  disegnaOcchi();
  aggiornaNota();
}
function haLibero(){return ["DX","SX"].some(o=>{const e=S.occhi[o];if(!e.attivo||!e.prod)return false;const p=S.prodotti.find(x=>String(x.id)===String(e.prod));return p&&(e.libero||righeDi(p).length===0)})}
function aggiornaNota(){
  const l=$("#notelab"),n=$("#note");if(!l||!n)return;
  const ob=haLibero();
  l.textContent=ob?"Nota * (descrivi cosa manca nell'elenco)":"Note";
  n.placeholder=ob?"Es. sfera -7.50 non presente per questa lente; serve curva 8.4":"";
}
function disegnaOcchi(){
  // come sulle schede ottiche: DX a sinistra, SX a destra
  $("#occ").innerHTML=`<div class="eyes">${["DX","SX"].map(o=>`<div class="card eye ${o.toLowerCase()}" id="eye${o}"></div>`).join("")}</div>`;
  ["DX","SX"].forEach(disegnaOcchio);
  $("#invia").onclick=invia;
}
function opt(vals,sel,fmt,vuoto="Seleziona…"){
  return `<option value="">${vuoto}</option>`+vals.map(v=>`<option value="${v}" ${String(v)===String(sel)?"selected":""}>${fmt?fmt(v):v}</option>`).join("");
}
function eyeHead(o,e){
  const nome=o==="DX"?"Occhio destro (DX)":"Occhio sinistro (SX)";
  const cp=o==="SX"&&e.attivo?`<button class="sec small" id="cp${o}" ${S.occhi.DX.attivo&&S.occhi.DX.prod?"":"disabled"}>Copia lente da DX</button>`:"";
  return `<h2 class="eh"><span>${nome}</span><span class="eh2">${cp}<label class="sw"><input type="checkbox" id="on${o}" ${e.attivo?"checked":""}> ordina</label></span></h2>`;
}
function disegnaOcchio(o){
  const e=S.occhi[o],box=$("#eye"+o);
  box.classList.toggle("off",!e.attivo);
  if(!e.attivo){
    box.innerHTML=eyeHead(o,e)+`<div class="mut">Questo occhio non viene ordinato.</div>`;
    $("#on"+o).onchange=ev=>{e.attivo=ev.target.checked;disegnaOcchio(o)};
    aggiornaNota();
    return;
  }
  const fornDisp=S.fornitori.filter(f=>S.prodotti.some(p=>p.fornitore_id===f.id));
  const prods=S.prodotti.filter(p=>String(p.fornitore_id)===String(e.forn));
  const p=S.prodotti.find(x=>String(x.id)===String(e.prod));
  const F=(lab,inner)=>`<div><label>${lab}</label>${inner}</div>`;
  let h=eyeHead(o,e)+`<div class="gr gf">`+
    F("Fornitore *",`<select id="f${o}">${opt(fornDisp.map(f=>f.id),e.forn,id=>fornDisp.find(f=>f.id==id).nome)}</select>`)+
    F("Lente *",`<select id="p${o}" ${e.forn?"":"disabled"}>${opt(prods.map(x=>x.id),e.prod,id=>prods.find(y=>y.id==id).modello)}</select>`)+`</div>`;
  let rr=[];
  if(p){
    rr=righeDi(p);
    if(rr.length===0)e.libero=true;
    const tor=(p.geometria||"").includes("torica");
    const mf=(p.geometria||"").includes("multifocale");
    if(e.libero){
      h+=`<div class="msg warn">${rr.length?"Parametro non presente nell'elenco.":"Per questa lente l'elenco dei parametri non è ancora disponibile."} Scrivi i valori e <b>descrivi nella nota</b> cosa manca: l'ordine parte con la tua descrizione e noi veniamo avvisati per sistemare l'elenco.</div>
      <div class="gr g4">${F("Sfera *",`<input id="ls${o}" inputmode="decimal" value="${e.sfera}" placeholder="-2.25">`)}
      ${tor?F("Cilindro *",`<input id="lc${o}" inputmode="decimal" value="${e.cil}" placeholder="-1.25">`)+F("Asse *",`<input id="la${o}" inputmode="numeric" value="${e.asse}" placeholder="180">`):""}
      ${F("Addizione"+(mf?" *":""),`<input id="ld${o}" value="${e.add}" placeholder="+1.50">`)}</div>
      <div class="gr g3">${F("Curva base *",`<input id="lb${o}" inputmode="decimal" value="${e.curva}" placeholder="8.6">`)}${F("Diametro *",`<input id="lm${o}" inputmode="decimal" value="${e.diam}" placeholder="14.2">`)}${F("Confezioni *",`<input id="q${o}" type="number" min="1" value="${e.qta}">`)}</div>
      ${rr.length?`<button class="sec small" id="lib${o}">Torna ai menu</button>`:""}`;
    } else {
      const A=rr.filter(x=>(e.sfera===""||x.sfere.includes(parseFloat(e.sfera))));
      const sfere=sortN(uniq(rr.flatMap(x=>x.sfere)));
      const hasAdd=rr.some(x=>x.addRaw);
      const hasCil=tor&&rr.some(x=>x.cils);
      let B=A,campi=F("Sfera *",`<select id="s${o}">${opt(sfere,e.sfera,f2)}</select>`);
      if(hasCil){
        const cils=sortN(uniq(A.flatMap(x=>x.cils||[])));
        campi+=F("Cilindro *",`<select id="c${o}" ${e.sfera===""?"disabled":""}>${opt(cils,e.cil,f2)}</select>`);
        if(e.cil!=="")B=A.filter(x=>x.cils&&x.cils.includes(parseFloat(e.cil)));
        const assi=sortN(uniq(B.flatMap(x=>x.assi||[])));
        campi+=F("Asse *",`<select id="a${o}" ${e.cil===""?"disabled":""}>${opt(assi,e.asse,v=>v+"°")}</select>`);
      }
      let nAdd=0;
      if(hasAdd){
        const opts=uniq(B.flatMap(x=>x.add||[]));
        const nonParsabile=B.some(x=>x.addRaw&&!x.add);
        campi+=(opts.length&&!nonParsabile)?F("Addizione *",`<select id="d${o}">${opt(opts,e.add)}</select>`):F("Addizione *",`<input id="d${o}" value="${e.add}" placeholder="+1.50 (D)/(N)">`);
      }
      const nc=1+(hasCil?2:0)+(hasAdd?1:0);
      h+=`<div class="gr g${nc}">${campi}</div>`;
      // curva e diametro: precompilati solo se il valore è unico, altrimenti da scegliere dalla tendina
      const curve=sortN(uniq(B.flatMap(x=>x.curve))),diam=sortN(uniq(B.flatMap(x=>x.diam)));
      if(curve.length===1)e.curva=String(curve[0]);else if(!curve.map(String).includes(String(e.curva)))e.curva="";
      if(diam.length===1)e.diam=String(diam[0]);else if(!diam.map(String).includes(String(e.diam)))e.diam="";
      h+=`<div class="gr g3">${F("Curva base *",`<select id="b${o}" ${curve.length===1?"disabled":""}>${opt(curve,e.curva,v=>v.toFixed(2))}</select>`)}${F("Diametro *",`<select id="m${o}" ${diam.length===1?"disabled":""}>${opt(diam,e.diam,v=>v.toFixed(2))}</select>`)}${F("Confezioni *",`<input id="q${o}" type="number" min="1" value="${e.qta}">`)}</div>
      <button class="sec small" id="fc${o}">Il parametro che mi serve non c'è</button>`;
      if(p.su_misura)h+=`<div class="mut">Lente su misura: i valori fuori elenco vengono verificati prima dell'invio al fornitore.</div>`;
    }
  }
  box.innerHTML=h;
  $("#on"+o).onchange=ev=>{e.attivo=ev.target.checked;disegnaOcchio(o)};
  const set=(id,fn)=>{const x=$("#"+id+o);if(x)x.onchange=()=>fn(x.value)};
  const on=(id,k)=>{const x=$("#"+id+o);if(x)x.oninput=()=>{e[k]=x.value.replace(",",".")}};
  set("f",v=>{Object.assign(e,nuovoOcchio(),{attivo:true,forn:v});disegnaOcchio(o)});
  set("p",v=>{Object.assign(e,{prod:v,libero:false,sfera:"",cil:"",asse:"",add:"",curva:"",diam:""});disegnaOcchio(o)});
  if(e.libero&&p){
    on("ls","sfera");on("lc","cil");on("la","asse");on("ld","add");on("lb","curva");on("lm","diam");
    const lb=$("#lib"+o);if(lb)lb.onclick=()=>{Object.assign(e,{libero:false,sfera:"",cil:"",asse:"",add:"",curva:"",diam:""});disegnaOcchio(o)};
  } else {
    set("s",v=>{Object.assign(e,{sfera:v,cil:"",asse:"",curva:"",diam:""});disegnaOcchio(o)});
    set("c",v=>{Object.assign(e,{cil:v,asse:"",curva:"",diam:""});disegnaOcchio(o)});
    set("a",v=>{e.asse=v});
    const d=$("#d"+o);if(d)d.onchange=d.oninput=()=>{e.add=d.value};
    set("b",v=>{e.curva=v});set("m",v=>{e.diam=v});
    const fc=$("#fc"+o);if(fc)fc.onclick=()=>{e.libero=true;disegnaOcchio(o)};
  }
  const q=$("#q"+o);if(q)q.oninput=()=>{e.qta=parseInt(q.value)||0};
  const cp=$("#cp"+o);if(cp)cp.onclick=()=>{if(!S.occhi.DX.prod)return;S.occhi.SX={...S.occhi.DX,attivo:true};disegnaOcchio("SX")};
  aggiornaNota();
  if(o==="DX"&&!window.__noRefreshSX){window.__noRefreshSX=true;disegnaOcchio("SX");window.__noRefreshSX=false}
}

/* ---------- invio ---------- */
function controlla(){
  const err=[],righe=[];
  const tipo=$("#tipo").value;
  if(tipo!=="scorta_negozio"){
    if(!$("#cog").value.trim())err.push("Cognome del cliente obbligatorio");
    if(!$("#nom").value.trim())err.push("Nome del cliente obbligatorio");
    if(!$("#cod").value.trim())err.push("Codice cliente Focus obbligatorio");
  }
  if(tipo==="vendita_cliente"&&!$("#forn").value.trim())err.push("Numero fornitura obbligatorio");
  if(!S.occhi.DX.attivo&&!S.occhi.SX.attivo)err.push("Seleziona almeno un occhio da ordinare");
  ["DX","SX"].forEach(o=>{
    const e=S.occhi[o];if(!e.attivo)return;
    const p=S.prodotti.find(x=>String(x.id)===String(e.prod));
    if(!p){err.push(o+": scegli fornitore e lente");return}
    const rr=righeDi(p);
    const lib=e.libero||rr.length===0;
    const tor=(p.geometria||"").includes("torica");
    const mf=(p.geometria||"").includes("multifocale");
    if(e.sfera==="")err.push(o+": manca la sfera");
    if(tor&&e.cil==="")err.push(o+": lente astigmatica, manca il cilindro");
    if(tor&&e.asse==="")err.push(o+": lente astigmatica, manca l'asse");
    if(mf&&!e.add)err.push(o+": lente multifocale, manca l'addizione");
    if(!lib&&rr.some(x=>x.addRaw)&&!e.add)err.push(o+": manca l'addizione");
    if(!e.curva)err.push(o+": manca la curva base");
    if(!e.diam)err.push(o+": manca il diametro");
    if(!(e.qta>0))err.push(o+": manca la quantità");
    righe.push({occhio:o,prodotto_id:p.id,fornitore_id:p.fornitore_id,
      curva_base:e.curva?parseFloat(e.curva):null,diametro:e.diam?parseFloat(e.diam):null,sfera:parseFloat(e.sfera),
      cilindro:tor&&e.cil!==""?parseFloat(e.cil):null,asse:tor&&e.asse!==""?parseInt(e.asse):null,
      addizione:e.add||null,quantita:e.qta||1,fuori_catalogo:lib});
  });
  if(righe.some(r=>r.fuori_catalogo)&&!$("#note").value.trim())err.push("Nella nota descrivi cosa manca nell'elenco (parametro o lente non presenti)");
  return {err,righe};
}
async function invia(){
  const {err,righe}=controlla();
  const esito=$("#esito");
  if(err.length){esito.innerHTML=`<div class="msg err">Controlla:<br>${err.join("<br>")}</div>`;return}
  const tipo=$("#tipo").value;
  const cog=tipo==="scorta_negozio"?"":$("#cog").value.trim(),nom=tipo==="scorta_negozio"?"":$("#nom").value.trim(),cod=tipo==="scorta_negozio"?"":$("#cod").value.trim();
  // un cliente può avere più prove: l'avviso non blocca
  if(cod){
    const da=new Date(Date.now()-14*864e5).toISOString();
    const {data:dup}=await sb.from("ordini").select("riferimento").eq("negozio_id",S.negozio.id).eq("codice_cliente_focus",cod).eq("tipo",tipo).gte("creato_il",da).neq("stato","annullato");
    if(dup&&dup.length&&!window.__okDup){
      esito.innerHTML=`<div class="msg warn">Questo cliente ha già un ordine dello stesso tipo negli ultimi 14 giorni (${dup.map(d=>d.riferimento).join(", ")}). Se è corretto, premi di nuovo Invia.</div>`;
      window.__okDup=true;return;
    }
  }
  window.__okDup=false;
  $("#invia").disabled=true;
  const {data:o,error}=await sb.from("ordini").insert({
    negozio_id:S.negozio.id,tipo,motivo_id:null,
    nome_cliente:nom||null,cognome_cliente:cog||null,codice_cliente_focus:cod||null,
    numero_fornitura:tipo==="vendita_cliente"?$("#forn").value.trim():null,
    cliente_rif:cog?`${cog} ${nom}`:null,note:$("#note").value.trim()||null
  }).select("id,riferimento").single();
  if(error){esito.innerHTML=`<div class="msg err">Errore: ${error.message}</div>`;$("#invia").disabled=false;return}
  const {error:e2}=await sb.from("righe_ordine").insert(righe.map(r=>({...r,ordine_id:o.id})));
  if(e2){esito.innerHTML=`<div class="msg err">Ordine creato ma righe non salvate: ${e2.message}. Avvisa la direzione (${o.riferimento}).</div>`;return}
  app.innerHTML=`<div class="card"><div class="msg ok"><b>Ordine inviato</b><br>Riferimento: <b>${o.riferimento}</b></div><p><button onclick="S.occhi={DX:nuovoOcchio(),SX:nuovoOcchio()};render()">Nuovo ordine</button> <button class="sec" onclick="S.tab='miei';render()">I miei ordini</button></p></div>`;
}

/* ---------- i miei ordini ---------- */
const STATI={inviato:"Inviato",preso_in_carico:"Preso in carico",ordinato_fornitore:"Ordinato al fornitore",arrivato_sede:"Arrivato in sede",in_partenza_giro:"In partenza col giro",consegnato_negozio:"Consegnato al negozio",evaso_da_deposito:"Evaso da deposito",annullato:"Annullato"};
async function listaOrdini(){
  let q=sb.from("ordini").select("id,riferimento,tipo,cliente_rif,codice_cliente_focus,numero_fornitura,stato,creato_il,negozio_id,righe_ordine(occhio,quantita,fuori_catalogo,prodotti(modello))").order("creato_il",{ascending:false}).limit(40);
  if(S.profilo.ruolo==="negozio"&&S.negozio)q=q.eq("negozio_id",S.negozio.id);
  const {data,error}=await q;
  const box=$("#lista");
  if(error){box.innerHTML=`<div class="msg err">${error.message}</div>`;return}
  if(!data.length){box.innerHTML="Nessun ordine.";return}
  box.innerHTML=`<table><tr><th>Rif.</th><th>Cliente</th><th>Lenti</th><th>Stato</th></tr>`+data.map(o=>`<tr>
   <td>${o.riferimento}<div class="mut">${(S.negozi.find(n=>n.id===o.negozio_id)||{}).nome||""} · ${new Date(o.creato_il).toLocaleDateString("it-IT")}</div></td>
   <td>${o.cliente_rif||""}<div class="mut">${o.codice_cliente_focus?"cod. "+o.codice_cliente_focus:""}${o.numero_fornitura?" · forn. "+o.numero_fornitura:""}</div></td>
   <td>${(o.righe_ordine||[]).map(r=>`${r.occhio} ${r.prodotti?r.prodotti.modello:""} ×${r.quantita}`).join("<br>")}</td>
   <td><span class="pill">${STATI[o.stato]||o.stato}</span></td></tr>`).join("")+`</table>`;
}

/* ---------- vista centrale (Adonella) ---------- */
const FLUSSO=["inviato","preso_in_carico","ordinato_fornitore","arrivato_sede","in_partenza_giro","consegnato_negozio"];
const FLUSSO_DEP=["inviato","preso_in_carico","evaso_da_deposito"];
const fmtS=v=>v===null||v===undefined?"":(v>0?"+":"")+Number(v).toFixed(2);
async function vistaCentrale(){
  const box=$("#cen");
  box.innerHTML='<div class="card">Caricamento…</div>';
  const {data,error}=await sb.from("ordini").select("*,righe_ordine(*,prodotti(modello,marchio,su_misura),fornitori(nome)),eventi_ordine(stato,quando)").not("stato","in","(consegnato_negozio,evaso_da_deposito,annullato)").order("creato_il");
  if(error){box.innerHTML=`<div class="msg err">${error.message}</div>`;return}
  S.cen=data||[];
  if(!S.cen.length){box.innerHTML='<div class="card">Nessun ordine da lavorare.</div>';return}
  // raggruppo per fornitore (le righe di un ordine possono avere fornitori diversi)
  const gruppi={};
  S.cen.forEach(o=>(o.righe_ordine||[]).forEach(r=>{
    const fn=(r.fornitori&&r.fornitori.nome)||"?";
    (gruppi[fn]=gruppi[fn]||[]).push({o,r});
  }));
  let h="";
  const nfc=S.cen.reduce((s,o)=>s+(o.righe_ordine||[]).filter(r=>r.fuori_catalogo).length,0);
  if(nfc)h+=`<div class="msg warn"><b>${nfc} righe fuori elenco da sistemare</b>: il negozio ha descritto cosa manca nella nota dell'ordine. Dopo l'ordine, aggiornare le regole del catalogo.</div>`;
  Object.keys(gruppi).sort().forEach(fn=>{
    const f=S.fornitori.find(x=>x.nome===fn)||{};
    const conf=gruppi[fn].reduce((s,x)=>s+(x.r.quantita||0),0);
    const sotto=f.minimo_confezioni&&conf<f.minimo_confezioni;
    h+=`<div class="card"><h2>${fn} <span class="pill">${conf} confezioni</span> <span class="pill">${f.destinazione==="negozio"?"spedisce al negozio":"spedisce al Deposito"}</span></h2>
    ${f.minimo_confezioni?`<div class="msg ${sotto?"warn":"ok"}">Minimo ${f.minimo_confezioni} confezioni: ${sotto?"ancora sotto, conviene aspettare":"raggiunto"}${f.verificato?"":" (dato da verificare)"}</div>`:""}
    <table><tr><th>Ordine</th><th>Lente</th><th>Parametri</th></tr>`+
    gruppi[fn].map(({o,r})=>`<tr><td>${o.riferimento}<div class="mut">${(S.negozi.find(n=>n.id===o.negozio_id)||{}).nome||""}<br>${o.cliente_rif||""} ${o.codice_cliente_focus?"· cod. "+o.codice_cliente_focus:""}${o.numero_fornitura?" · forn. "+o.numero_fornitura:""}</div></td>
      <td>${r.occhio} · ${r.prodotti?r.prodotti.modello:""}${r.fuori_catalogo?' <span class="pill" style="color:var(--warn)">fuori catalogo</span>':""}</td>
      <td>Sf ${fmtS(r.sfera)}${r.cilindro!==null?` Cil ${fmtS(r.cilindro)} Ax ${r.asse}°`:""}${r.addizione?` Add ${r.addizione}`:""}<br>BC ${r.curva_base||"—"} · Ø ${r.diametro||"—"} · ×${r.quantita}</td></tr>`).join("")+`</table></div>`;
  });
  h+=`<div class="card"><h2>Ordini (${S.cen.length})</h2>`+S.cen.map(o=>{
    const neg=(S.negozi.find(n=>n.id===o.negozio_id)||{}).nome||"";
    const fl=FLUSSO.includes(o.stato)?FLUSSO:FLUSSO.concat([o.stato]);
    const ev=(o.eventi_ordine||[]).sort((a,b)=>new Date(a.quando)-new Date(b.quando)).map(e=>`${STATI[e.stato]||e.stato} ${new Date(e.quando).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`).join(" → ");
    return `<div style="border-top:1px solid var(--line);padding:10px 0"><b>${o.riferimento}</b> · ${neg} · ${o.cliente_rif||""} ${o.codice_cliente_focus?"· cod. "+o.codice_cliente_focus:""}${o.numero_fornitura?" · forn. "+o.numero_fornitura:""} <span class="pill">${o.tipo}</span>
      <div class="mut">${ev}</div>
      ${o.note?`<div class="mut">Note: ${o.note}</div>`:""}
      <div class="row" style="margin-top:6px"><select id="st${o.id}">${[...FLUSSO,"evaso_da_deposito","annullato"].map(s=>`<option value="${s}" ${s===o.stato?"selected":""}>${STATI[s]}</option>`).join("")}</select>
      <button class="small" onclick="cambiaStato(${o.id})">Aggiorna stato</button></div></div>`}).join("")+`</div>`;
  box.innerHTML=h;
}
async function cambiaStato(id){
  const v=$("#st"+id).value;
  const {error}=await sb.from("ordini").update({stato:v}).eq("id",id);
  if(error){alert(error.message);return}
  vistaCentrale();
}
start();
</script>
