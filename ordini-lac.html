<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordini LAC</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--line:#dde2e9;--pri:#1f5fbf;--ok:#1d7a46;--warn:#b26a00;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--line:#2e3846;--pri:#6aa3ff;--ok:#4cc38a;--warn:#f0b050;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--line:#2e3846;--pri:#6aa3ff;--ok:#4cc38a;--warn:#f0b050;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:17px}
main{max-width:1500px;margin:0 auto;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
h2{font-size:15px;margin:0 0 6px}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}
select,input,textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
select:disabled{opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:8px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.small{padding:7px 10px;font-size:14px}
button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{padding:7px}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.msg{padding:6px 10px;border-radius:8px;margin:6px 0;font-size:13px}
.msg.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.msg.err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.mut{color:var(--mut);font-size:13px}
.eye{border-left:4px solid var(--pri)}
.eye.sx{border-left-color:var(--ok)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.hide{display:none}
.cb{position:relative}
.cbl{position:absolute;left:0;right:0;top:100%;z-index:30;max-height:280px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);margin-top:2px}
.cbo{padding:7px 10px;cursor:pointer}
.cbo.on{background:var(--pri);color:#fff}
.cbo.sel{font-weight:700}
input:disabled{opacity:.5}
input.free{background:var(--card);border:2px solid var(--warn)}
input.free::placeholder{color:var(--mut);opacity:.7}
.vf{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.vf td{border-bottom-color:var(--warn)}
.eyes{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.gr{display:grid;gap:8px}
.g1{grid-template-columns:1fr}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gf{grid-template-columns:1fr 2fr}
.eh{min-height:34px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.eh2{display:flex;align-items:center;gap:10px}
.top{display:grid;grid-template-columns:1.3fr 1.2fr 1.2fr 1fr 1fr;gap:8px;align-items:end}
.bot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
@media (max-width:900px){.top{grid-template-columns:1fr 1fr}.bot{grid-template-columns:1fr}}
@media (max-width:900px){.eyes{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.eye.off{opacity:.45}
.sw{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--tx)}
.sw input{width:auto}
.eyes .card{margin-bottom:0}
.chip{padding:3px 8px;font-size:13px;font-weight:500;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:7px;cursor:copy}
.chip:hover{border-color:var(--pri)}
.chip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.off{color:var(--mut);cursor:default}
.lr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.lr.done{opacity:.45}.lr.done .chip{text-decoration:line-through}
.fl{display:inline-flex;align-items:center;gap:4px}.lb{font-size:11px;color:var(--mut)}
.grp{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:8px;padding:6px 10px;margin:8px 0;background:color-mix(in srgb,var(--pri) 5%,transparent)}
.grp-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:2px}
.sec-h{font-weight:700;margin:12px 0 2px}
.pill.w{color:var(--warn);border-color:var(--warn)}
button.go{background:var(--ok)}
</style>
</head>
<body>
<header><b>Ordini lenti a contatto</b><span id="who" class="mut"></span></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPA_URL="https://exrlurfvydxrqfzjdobp.supabase.co";
const SUPA_KEY="sb_publishable_0mNbCOZLSV-ug9iJ9jLrNA_RabyY_LM";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{db:{schema:"lac"}});
const $=s=>document.querySelector(s);
const app=$("#app");
const S={profilo:null,negozio:null,fornitori:[],prodotti:[],regole:{},motivi:[],tab:"nuovo",occhi:{DX:null,SX:null},msg:null};

/* ---------- utilità parametri ---------- */
const f2=n=>(n>0?"+":"")+n.toFixed(2);
function gen(da,a,passo){ // lista valori da..a (anche decrescente)
  if(isNaN(da)||isNaN(a)||!passo)return [];
  const lo=Math.min(da,a),hi=Math.max(da,a),out=[];
  const n=Math.round((hi-lo)/passo);
  for(let i=0;i<=n;i++)out.push(Math.round((lo+i*passo)*100)/100);
  return out;
}
function parseTratti(t){
  if(!t)return[];
  const set=new Set();
  t.split(";").forEach(seg=>{
    const p=seg.split(":");
    if(p.length<3)return;
    gen(parseFloat(p[0]),parseFloat(p[1]),parseFloat(p[2])).forEach(v=>set.add(v));
  });
  return [...set].sort((x,y)=>x-y);
}
function parseLista(t){ // "a|b|c" oppure "da..a/passo"
  if(!t)return null;
  const m=t.match(/^(-?[\d.]+)\.\.(-?[\d.]+)\/([\d.]+)$/);
  if(m)return gen(parseFloat(m[1]),parseFloat(m[2]),parseFloat(m[3]));
  return t.split("|").map(x=>parseFloat(x)).filter(x=>!isNaN(x));
}
function parseCurve(t){ // "8.60" o "8.40|8.60" o "7.10..9.80/0.3"
  return parseLista(t)||[];
}
function parseAdd(t){ // opzioni addizione; null = non parsabile
  if(!t)return null;
  const pulita=t.replace(/\[.*?\]/g,"").trim();
  if(/^[+\d.|\s]+$/.test(pulita))return pulita.split("|").map(x=>x.trim()).filter(Boolean);
  const m=pulita.match(/(?:^|\|)\s*([A-Za-zÀ-ù ]+(?:\([A-Z]+\))?)\s*:/g);
  if(m&&!/CD:|CN:|A =|SPH/.test(pulita))return m.map(x=>x.replace(/^[|\s]+/,"").replace(/:$/,"").trim());
  return null;
}
function righeDi(p){ // regole del prodotto, già decodificate
  const rr=S.regole[p.listino_id]||[];
  return rr.map(r=>({
    r,
    sfere:parseTratti(r.sfera_tratti),
    cils:r.cilindri?parseLista(r.cilindri):null,
    assi:r.assi?parseLista(r.assi):null,
    curve:parseCurve(r.curva_base),
    diam:parseCurve(r.diametro),
    add:parseAdd(r.addizioni),
    addRaw:r.addizioni
  }));
}
const uniq=a=>[...new Set(a)];
const sortN=a=>[...a].sort((x,y)=>x-y);

/* ---------- avvio / login ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  await caricaTutto();
}
function loginView(err){
  app.innerHTML=`<div class="card"><h2>Accedi</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  ${err?`<div class="msg err">${err}</div>`:""}
  <p><button id="go">Entra</button></p></div>`;
  $("#go").onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error)return loginView("Email o password non corrette.");
    await caricaTutto();
  };
}
async function caricaTutto(){
  const {data:{user}}=await sb.auth.getUser();
  const {data:pr}=await sb.from("profili").select("*").eq("user_id",user.id).maybeSingle();
  if(!pr){app.innerHTML=`<div class="card"><div class="msg err">Utente non ancora abilitato. Avvisa la direzione.</div><button class="sec" onclick="esci()">Esci</button></div>`;return;}
  S.profilo=pr;S.uid=user.id;
  const [neg,forn,prod,reg,mot]=await Promise.all([
    sb.from("negozi").select("*").order("nome"),
    sb.from("fornitori").select("*").order("nome"),
    sb.from("prodotti").select("*").eq("ordinabile",true).order("modello"),
    sb.from("regole_parametri").select("*"),
    sb.from("motivi_prova").select("*").eq("attivo",true).order("id")
  ]);
  S.negozi=neg.data||[];S.fornitori=forn.data||[];S.prodotti=prod.data||[];S.motivi=mot.data||[];
  S.regole={};(reg.data||[]).forEach(r=>{(S.regole[r.listino_id]=S.regole[r.listino_id]||[]).push(r)});
  S.negozio=S.negozi.find(n=>n.id===pr.negozio_id)||null;
  $("#who").innerHTML=`${pr.nome||""} · ${S.negozio?S.negozio.nome:pr.ruolo} · <a href="#" onclick="esci();return false">esci</a>`;
  S.occhi={DX:nuovoOcchio(),SX:nuovoOcchio()};
  if(pr.ruolo!=="negozio")S.tab="centrale";
  render();
}
async function esci(){await sb.auth.signOut();location.reload()}
const tipoSel=()=>{const t=$("#tipo");return t?t.value:""};
// prove: le lenti non giornaliere si ordinano singole; le giornaliere in confezione da 5
const unitaDi=p=>tipoSel()==="prova"&&p&&p.durata&&p.durata!=="giornaliera"?"lenti":"confezioni";
const qLab=p=>unitaDi(p)==="lenti"?"Lenti singole *":(tipoSel()==="prova"&&p&&p.durata==="giornaliera"?"Confezioni (da 5) *":"Confezioni *");
function nuovoOcchio(){return{libero:false,attivo:true,forn:"",prod:"",sfera:"",cil:"",asse:"",add:"",curva:"",diam:"",qta:1}}


/* ---------- menu con ricerca (filtro in tempo reale) ---------- */
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function enhance(root){
  if(!root)return;
  root.querySelectorAll("select").forEach(sel=>{
    if(sel.dataset.cb)return;sel.dataset.cb="1";
    const wrap=document.createElement("div");wrap.className="cb";
    sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);sel.style.display="none";
    const inp=document.createElement("input");inp.type="text";inp.autocomplete="off";inp.className="cbi";
    const list=document.createElement("div");list.className="cbl hide";
    wrap.appendChild(inp);wrap.appendChild(list);
    const opts=()=>[...sel.options].filter(o=>o.value!=="");
    const label=()=>{const o=sel.options[sel.selectedIndex];return o&&o.value!==""?o.textContent:""};
    inp.placeholder=sel.options[0]?sel.options[0].textContent:"Seleziona…";
    inp.value=label();inp.disabled=sel.disabled;
    let hi=-1,cur=[],typed=false;
    const paint=()=>{
      [...list.children].forEach((d,i)=>d.classList.toggle("on",i===hi));
      const d=list.children[hi];if(d&&d.scrollIntoView)d.scrollIntoView({block:"nearest"});
    };
    const draw=()=>{
      const q=norm(typed?inp.value:"").split(/\s+/).filter(Boolean);
      cur=opts().filter(o=>{const t=norm(o.textContent);return q.every(w=>t.includes(w))});
      hi=cur.findIndex(o=>o.value===sel.value);if(hi<0)hi=cur.length?0:-1;
      list.innerHTML="";
      if(!cur.length){const d=document.createElement("div");d.className="cbo mut";d.textContent="Nessun risultato";list.appendChild(d)}
      cur.forEach((o,i)=>{const d=document.createElement("div");d.className="cbo"+(o.value===sel.value?" sel":"");d.dataset.i=i;d.textContent=o.textContent;list.appendChild(d)});
      list.classList.remove("hide");paint();
    };
    const close=()=>{list.classList.add("hide");typed=false;inp.value=label()};
    const choose=o=>{list.classList.add("hide");typed=false;sel.value=o.value;inp.value=o.textContent;sel.dispatchEvent(new Event("change"))};
    inp.onfocus=()=>{typed=false;inp.select();draw()};
    inp.onclick=()=>{if(list.classList.contains("hide")){typed=false;draw()}};
    inp.oninput=()=>{typed=true;draw()};
    inp.onkeydown=ev=>{
      if(ev.key==="ArrowDown"){ev.preventDefault();if(list.classList.contains("hide"))draw();else{hi=Math.min(hi+1,cur.length-1);paint()}}
      else if(ev.key==="ArrowUp"){ev.preventDefault();hi=Math.max(hi-1,0);paint()}
      else if(ev.key==="Enter"){ev.preventDefault();if(cur[hi]&&!list.classList.contains("hide"))choose(cur[hi])}
      else if(ev.key==="Escape"){close()}
      else if(ev.key==="Tab"){if(typed&&cur.length===1&&!list.classList.contains("hide"))choose(cur[0])}
    };
    inp.onblur=()=>setTimeout(close,0);
    list.onmousedown=ev=>{ev.preventDefault();const d=ev.target.closest(".cbo[data-i]");if(d)choose(cur[+d.dataset.i])};
  });
}

/* ---------- vista nuovo ordine ---------- */
function vaiTab(t){
  if(S.modifica){S.modifica=null;S.occhi={DX:nuovoOcchio(),SX:nuovoOcchio()}}
  S.tab=t;render();
}
function applicaPre(){
  const m=S.modifica;if(!m)return;const p=m.pre;
  $("#tipo").value=p.tipo;$("#tipo").onchange();
  $("#cog").value=p.cog||"";$("#nom").value=p.nom||"";$("#cod").value=p.cod||"";$("#forn").value=p.forn||"";
  $("#note").value=p.note||"";
}
function render(){
  const centrale=S.profilo.ruolo!=="negozio";
  const tabs=`<div class="tabs">${centrale?`<button class="${S.tab==="centrale"?"on":""}" onclick="vaiTab('centrale')">Da lavorare</button>`:""}<button class="${S.tab==="nuovo"?"on":""}" onclick="vaiTab('nuovo')">Nuovo ordine</button><button class="${S.tab==="miei"?"on":""}" onclick="vaiTab('miei')">${centrale?"Tutti gli ordini":"I miei ordini"}</button></div>`;
  if(S.tab==="centrale"){app.innerHTML=tabs+`<div id="cen"></div>`;return vistaCentrale();}
  if(S.tab==="miei"){app.innerHTML=tabs+`<div id="lista" class="card">Caricamento…</div>`;return listaOrdini();}
  if(centrale&&!S.negozio){S.negozio=S.negozi[0]}
  app.innerHTML=tabs+(S.modifica?`<div class="msg warn"><b>Stai modificando ${S.modifica.rif}.</b> Puoi salvare solo finché la sede non lo prende in carico. <button class="sec small" onclick="vaiTab('miei')">Esci senza salvare</button></div>`:"")+`
  <div class="card"><div class="top">
   <div><label>Tipo *${S.profilo.ruolo==="negozio"?(S.negozio?` · ${S.negozio.nome}`:""):""}</label>${S.profilo.ruolo==="negozio"?"":`<select id="negsel" style="margin-bottom:4px">${S.negozi.map(n=>`<option value="${n.id}" ${S.negozio&&S.negozio.id===n.id?"selected":""}>${n.nome}</option>`).join("")}</select>`}<select id="tipo"><option value="" selected disabled>— scegli il tipo di ordine —</option><option value="prova">Lenti di prova</option><option value="vendita_cliente">Ordine cliente (vendita)</option><option value="scorta_negozio">Scorta negozio</option></select></div>
   <div class="cli"><label>Cognome *</label><input id="cog" autocomplete="off"></div>
   <div class="cli"><label>Nome *</label><input id="nom" autocomplete="off"></div>
   <div class="cli"><label>Codice cliente Focus *</label><input id="cod" inputmode="numeric" autocomplete="off"></div>
   <div id="forw" class="hide"><label>Numero fornitura *</label><input id="forn" inputmode="numeric" autocomplete="off"></div>
  </div></div>
  <div id="occ"></div>
  <div class="card"><div class="bot"><div><label id="notelab">Note</label><textarea id="note" rows="1" style="resize:vertical"></textarea></div><button id="invia">${S.modifica?"Salva modifica":"Invia ordine"}</button></div>
   <div id="esito"></div></div>`;
  const ns=$("#negsel");if(ns)ns.onchange=()=>{S.negozio=S.negozi.find(n=>n.id==ns.value)};
  $("#tipo").onchange=()=>{
    const t=$("#tipo").value;
    $("#forw").classList.toggle("hide",t!=="vendita_cliente");
    document.querySelectorAll(".cli").forEach(x=>x.classList.toggle("hide",t==="scorta_negozio"));
    if($("#occ")&&$("#occ").children.length)disegnaOcchi();
  };
  disegnaOcchi();
  aggiornaNota();
  applicaPre();
  enhance(document.querySelector(".top"));
}
function haLibero(){return ["DX","SX"].some(o=>{const e=S.occhi[o];if(!e.attivo||!e.prod)return false;const p=S.prodotti.find(x=>String(x.id)===String(e.prod));return p&&(e.libero||righeDi(p).length===0)})}
function aggiornaNota(){
  const l=$("#notelab"),n=$("#note");if(!l||!n)return;
  const ob=haLibero();
  l.textContent=ob?"Nota * (descrivi cosa manca nell'elenco)":"Note";
  n.placeholder=ob?"Es. sfera -7.50 non presente per questa lente; serve curva 8.4":"";
}
function disegnaOcchi(){
  // come sulle schede ottiche: DX a sinistra, SX a destra
  $("#occ").innerHTML=`<div class="eyes">${["DX","SX"].map(o=>`<div class="card eye ${o.toLowerCase()}" id="eye${o}"></div>`).join("")}</div>`;
  ["DX","SX"].forEach(disegnaOcchio);
  $("#invia").onclick=invia;
}
function opt(vals,sel,fmt,vuoto="Seleziona…"){
  return `<option value="">${vuoto}</option>`+vals.map(v=>`<option value="${v}" ${String(v)===String(sel)?"selected":""}>${fmt?fmt(v):v}</option>`).join("");
}
function eyeHead(o,e){
  const nome=o==="DX"?"Occhio destro (DX)":"Occhio sinistro (SX)";
  const cp=o==="SX"&&e.attivo?`<button class="sec small" id="cp${o}" ${S.occhi.DX.attivo&&S.occhi.DX.prod?"":"disabled"}>Copia lente da DX</button>`:"";
  return `<h2 class="eh"><span>${nome}</span><span class="eh2">${cp}<label class="sw"><input type="checkbox" id="on${o}" ${e.attivo?"checked":""}> ordina</label></span></h2>`;
}
function disegnaOcchio(o){
  const e=S.occhi[o],box=$("#eye"+o);
  box.classList.toggle("off",!e.attivo);
  if(!e.attivo){
    box.innerHTML=eyeHead(o,e)+`<div class="mut">Questo occhio non viene ordinato.</div>`;
    $("#on"+o).onchange=ev=>{e.attivo=ev.target.checked;disegnaOcchio(o)};
    aggiornaNota();
    return;
  }
  const fornDisp=S.fornitori.filter(f=>S.prodotti.some(p=>p.fornitore_id===f.id));
  const prods=S.prodotti.filter(p=>String(p.fornitore_id)===String(e.forn));
  const p=S.prodotti.find(x=>String(x.id)===String(e.prod));
  const F=(lab,inner)=>`<div><label>${lab}</label>${inner}</div>`;
  let h=eyeHead(o,e)+`<div class="gr gf">`+
    F("Fornitore *",`<select id="f${o}">${opt(fornDisp.map(f=>f.id),e.forn,id=>fornDisp.find(f=>f.id==id).nome)}</select>`)+
    F("Lente *",`<select id="p${o}" ${e.forn?"":"disabled"}>${opt(prods.map(x=>x.id),e.prod,id=>prods.find(y=>y.id==id).modello)}</select>`)+`</div>`;
  let rr=[];
  if(p){
    rr=righeDi(p);
    if(rr.length===0)e.libero=true;
    const tor=(p.geometria||"").includes("torica");
    const mf=(p.geometria||"").includes("multifocale");
    if(e.libero){
      h+=`<div class="msg warn">${rr.length?"Parametro non presente nell'elenco.":"Per questa lente l'elenco dei parametri non è ancora disponibile."} Scrivi tu i valori nei campi evidenziati e <b>descrivi nella nota</b> cosa manca: l'ordine parte con la tua descrizione e noi veniamo avvisati per sistemare l'elenco.</div>
      <div class="gr g4">${F("Sfera *",`<input id="ls${o}" inputmode="decimal" value="${e.sfera}" placeholder="es. -2.25" class="free">`)}
      ${tor?F("Cilindro *",`<input id="lc${o}" inputmode="decimal" value="${e.cil}" placeholder="es. -1.25" class="free">`)+F("Asse *",`<input id="la${o}" inputmode="numeric" value="${e.asse}" placeholder="es. 180" class="free">`):""}
      ${F("Addizione"+(mf?" *":""),`<input id="ld${o}" value="${e.add}" placeholder="es. +1.50" class="free">`)}</div>
      <div class="gr g3">${F("Curva base *",`<input id="lb${o}" inputmode="decimal" value="${e.curva}" placeholder="es. 8.6" class="free">`)}${F("Diametro *",`<input id="lm${o}" inputmode="decimal" value="${e.diam}" placeholder="es. 14.2" class="free">`)}${F(qLab(p),`<input id="q${o}" type="number" min="1" value="${e.qta}">`)}</div>
      ${rr.length?`<button class="sec small" id="lib${o}">Torna ai menu</button>`:""}`;
    } else {
      const A=rr.filter(x=>(e.sfera===""||x.sfere.includes(parseFloat(e.sfera))));
      const sfere=sortN(uniq(rr.flatMap(x=>x.sfere)));
      const hasAdd=rr.some(x=>x.addRaw);
      const hasCil=tor&&rr.some(x=>x.cils);
      let B=A,campi=F("Sfera *",`<select id="s${o}">${opt(sfere,e.sfera,f2)}</select>`);
      if(hasCil){
        const cils=sortN(uniq(A.flatMap(x=>x.cils||[])));
        campi+=F("Cilindro *",`<select id="c${o}" ${e.sfera===""?"disabled":""}>${opt(cils,e.cil,f2)}</select>`);
        if(e.cil!=="")B=A.filter(x=>x.cils&&x.cils.includes(parseFloat(e.cil)));
        const assi=sortN(uniq(B.flatMap(x=>x.assi||[])));
        campi+=F("Asse *",`<select id="a${o}" ${e.cil===""?"disabled":""}>${opt(assi,e.asse,v=>v+"°")}</select>`);
      }
      let nAdd=0;
      if(hasAdd){
        const opts=uniq(B.flatMap(x=>x.add||[]));
        const nonParsabile=B.some(x=>x.addRaw&&!x.add);
        campi+=(opts.length&&!nonParsabile)?F("Addizione *",`<select id="d${o}">${opt(opts,e.add)}</select>`):F("Addizione *",`<input id="d${o}" value="${e.add}" placeholder="+1.50 (D)/(N)">`);
      }
      const nc=1+(hasCil?2:0)+(hasAdd?1:0);
      h+=`<div class="gr g${nc}">${campi}</div>`;
      // curva e diametro: precompilati solo se il valore è unico, altrimenti da scegliere dalla tendina
      const curve=sortN(uniq(B.flatMap(x=>x.curve))),diam=sortN(uniq(B.flatMap(x=>x.diam)));
      if(curve.length===1)e.curva=String(curve[0]);else if(!curve.map(String).includes(String(e.curva)))e.curva="";
      if(diam.length===1)e.diam=String(diam[0]);else if(!diam.map(String).includes(String(e.diam)))e.diam="";
      h+=`<div class="gr g3">${F("Curva base *",`<select id="b${o}" ${curve.length===1?"disabled":""}>${opt(curve,e.curva,v=>v.toFixed(2))}</select>`)}${F("Diametro *",`<select id="m${o}" ${diam.length===1?"disabled":""}>${opt(diam,e.diam,v=>v.toFixed(2))}</select>`)}${F(qLab(p),`<input id="q${o}" type="number" min="1" value="${e.qta}">`)}</div>
      <button class="sec small" id="fc${o}">Il parametro che mi serve non c'è</button>`;
      if(p.su_misura)h+=`<div class="mut">Lente su misura: i valori fuori elenco vengono verificati prima dell'invio al fornitore.</div>`;
    }
  }
  box.innerHTML=h;
  $("#on"+o).onchange=ev=>{e.attivo=ev.target.checked;disegnaOcchio(o)};
  const set=(id,fn)=>{const x=$("#"+id+o);if(x)x.onchange=()=>fn(x.value)};
  const on=(id,k)=>{const x=$("#"+id+o);if(x)x.oninput=()=>{e[k]=x.value.replace(",",".")}};
  set("f",v=>{Object.assign(e,nuovoOcchio(),{attivo:true,forn:v});disegnaOcchio(o)});
  set("p",v=>{Object.assign(e,{prod:v,libero:false,sfera:"",cil:"",asse:"",add:"",curva:"",diam:""});disegnaOcchio(o)});
  if(e.libero&&p){
    on("ls","sfera");on("lc","cil");on("la","asse");on("ld","add");on("lb","curva");on("lm","diam");
    const lb=$("#lib"+o);if(lb)lb.onclick=()=>{Object.assign(e,{libero:false,sfera:"",cil:"",asse:"",add:"",curva:"",diam:""});disegnaOcchio(o)};
  } else {
    set("s",v=>{Object.assign(e,{sfera:v,cil:"",asse:"",curva:"",diam:""});disegnaOcchio(o)});
    set("c",v=>{Object.assign(e,{cil:v,asse:"",curva:"",diam:""});disegnaOcchio(o)});
    set("a",v=>{e.asse=v});
    const d=$("#d"+o);if(d)d.onchange=d.oninput=()=>{e.add=d.value};
    set("b",v=>{e.curva=v});set("m",v=>{e.diam=v});
    const fc=$("#fc"+o);if(fc)fc.onclick=()=>{e.libero=true;disegnaOcchio(o)};
  }
  const q=$("#q"+o);if(q)q.oninput=()=>{e.qta=parseInt(q.value)||0};
  const cp=$("#cp"+o);if(cp)cp.onclick=()=>{if(!S.occhi.DX.prod)return;S.occhi.SX={...S.occhi.DX,attivo:true};disegnaOcchio("SX")};
  aggiornaNota();
  enhance(box);
  if(o==="DX"&&!window.__noRefreshSX){window.__noRefreshSX=true;disegnaOcchio("SX");window.__noRefreshSX=false}
}

/* ---------- invio ---------- */
function controlla(){
  const err=[],righe=[];
  const tipo=$("#tipo").value;
  if(!tipo)err.push("Scegli il tipo di ordine (prova, cliente o scorta)");
  if(tipo!=="scorta_negozio"){
    if(!$("#cog").value.trim())err.push("Cognome del cliente obbligatorio");
    if(!$("#nom").value.trim())err.push("Nome del cliente obbligatorio");
    if(!$("#cod").value.trim())err.push("Codice cliente Focus obbligatorio");
  }
  if(tipo==="vendita_cliente"&&!$("#forn").value.trim())err.push("Numero fornitura obbligatorio");
  if(!S.occhi.DX.attivo&&!S.occhi.SX.attivo)err.push("Seleziona almeno un occhio da ordinare");
  ["DX","SX"].forEach(o=>{
    const e=S.occhi[o];if(!e.attivo)return;
    const p=S.prodotti.find(x=>String(x.id)===String(e.prod));
    if(!p){err.push(o+": scegli fornitore e lente");return}
    const rr=righeDi(p);
    const lib=e.libero||rr.length===0;
    const tor=(p.geometria||"").includes("torica");
    const mf=(p.geometria||"").includes("multifocale");
    if(e.sfera==="")err.push(o+": manca la sfera");
    if(tor&&e.cil==="")err.push(o+": lente astigmatica, manca il cilindro");
    if(tor&&e.asse==="")err.push(o+": lente astigmatica, manca l'asse");
    if(mf&&!e.add)err.push(o+": lente multifocale, manca l'addizione");
    if(!lib&&rr.some(x=>x.addRaw)&&!e.add)err.push(o+": manca l'addizione");
    if(!e.curva)err.push(o+": manca la curva base");
    if(!e.diam)err.push(o+": manca il diametro");
    if(!(e.qta>0))err.push(o+": manca la quantità");
    righe.push({occhio:o,prodotto_id:p.id,fornitore_id:p.fornitore_id,
      curva_base:e.curva?parseFloat(e.curva):null,diametro:e.diam?parseFloat(e.diam):null,sfera:parseFloat(e.sfera),
      cilindro:tor&&e.cil!==""?parseFloat(e.cil):null,asse:tor&&e.asse!==""?parseInt(e.asse):null,
      addizione:e.add||null,quantita:e.qta||1,fuori_catalogo:lib,unita:unitaDi(p)});
  });
  if(righe.some(r=>r.fuori_catalogo)&&!$("#note").value.trim())err.push("Nella nota descrivi cosa manca nell'elenco (parametro o lente non presenti)");
  return {err,righe};
}
async function invia(){
  const {err,righe}=controlla();
  const esito=$("#esito");
  if(err.length){esito.innerHTML=`<div class="msg err">Controlla:<br>${err.join("<br>")}</div>`;return}
  const tipo=$("#tipo").value;
  const cog=tipo==="scorta_negozio"?"":$("#cog").value.trim(),nom=tipo==="scorta_negozio"?"":$("#nom").value.trim(),cod=tipo==="scorta_negozio"?"":$("#cod").value.trim();
  if(S.modifica)return salvaModifica(tipo,cog,nom,cod,righe);
  // un cliente può avere più prove: l'avviso non blocca
  if(cod){
    const da=new Date(Date.now()-14*864e5).toISOString();
    const {data:dup}=await sb.from("ordini").select("riferimento").eq("negozio_id",S.negozio.id).eq("codice_cliente_focus",cod).eq("tipo",tipo).gte("creato_il",da).neq("stato","annullato");
    if(dup&&dup.length&&!window.__okDup){
      esito.innerHTML=`<div class="msg warn">Questo cliente ha già un ordine dello stesso tipo negli ultimi 14 giorni (${dup.map(d=>d.riferimento).join(", ")}). Se è corretto, premi di nuovo Invia.</div>`;
      window.__okDup=true;return;
    }
  }
  window.__okDup=false;
  $("#invia").disabled=true;
  const {data:o,error}=await sb.from("ordini").insert({
    negozio_id:S.negozio.id,tipo,motivo_id:null,
    nome_cliente:nom||null,cognome_cliente:cog||null,codice_cliente_focus:cod||null,
    numero_fornitura:tipo==="vendita_cliente"?$("#forn").value.trim():null,
    cliente_rif:cog?`${cog} ${nom}`:null,note:$("#note").value.trim()||null
  }).select("id,riferimento").single();
  if(error){esito.innerHTML=`<div class="msg err">Errore: ${error.message}</div>`;$("#invia").disabled=false;return}
  const {error:e2}=await sb.from("righe_ordine").insert(righe.map(r=>({...r,ordine_id:o.id})));
  if(e2){esito.innerHTML=`<div class="msg err">Ordine creato ma righe non salvate: ${e2.message}. Avvisa la direzione (${o.riferimento}).</div>`;return}
  app.innerHTML=`<div class="card"><div class="msg ok"><b>Ordine inviato</b><br>Riferimento: <b>${o.riferimento}</b></div><p><button onclick="S.occhi={DX:nuovoOcchio(),SX:nuovoOcchio()};render()">Nuovo ordine</button> <button class="sec" onclick="S.tab='miei';render()">I miei ordini</button></p></div>`;
}

async function salvaModifica(tipo,cog,nom,cod,righe){
  const esito=$("#esito");$("#invia").disabled=true;
  const m=S.modifica;
  const {error}=await sb.rpc("modifica_ordine",{p_id:m.id,
    p_ordine:{tipo,nome_cliente:nom||null,cognome_cliente:cog||null,codice_cliente_focus:cod||null,
      numero_fornitura:tipo==="vendita_cliente"?$("#forn").value.trim():null,
      cliente_rif:cog?`${cog} ${nom}`:null,note:$("#note").value.trim()||null},
    p_righe:righe});
  if(error){
    if(/ORDINE_BLOCCATO/.test(error.message)){
      S.modifica=null;S.occhi={DX:nuovoOcchio(),SX:nuovoOcchio()};
      app.innerHTML=`<div class="card"><div class="msg err"><b>Modifica NON salvata.</b><br>La sede ha già preso in carico ${m.rif}: non è più modificabile. Se serve una correzione, contatta la sede.</div><p><button onclick="vaiTab('miei')">I miei ordini</button></p></div>`;
      return;
    }
    esito.innerHTML=`<div class="msg err">Errore: ${error.message}</div>`;$("#invia").disabled=false;return;
  }
  S.modifica=null;S.occhi={DX:nuovoOcchio(),SX:nuovoOcchio()};
  app.innerHTML=`<div class="card"><div class="msg ok"><b>Modifica salvata</b><br>${m.rif} era ancora in attesa: la sede vedrà i dati aggiornati.</div><p><button onclick="vaiTab('miei')">I miei ordini</button></p></div>`;
}
function modificaOrdine(id){
  const o=(S.lista||[]).find(x=>x.id===id);if(!o)return;
  const occ={DX:nuovoOcchio(),SX:nuovoOcchio()};
  ["DX","SX"].forEach(k=>{
    const r=(o.righe_ordine||[]).find(x=>x.occhio===k);
    if(!r){occ[k].attivo=false;return}
    occ[k]={libero:!!r.fuori_catalogo,attivo:true,forn:String(r.fornitore_id),prod:String(r.prodotto_id),sfera:String(r.sfera),
      cil:r.cilindro===null?"":String(r.cilindro),asse:r.asse===null?"":String(r.asse),add:r.addizione||"",
      curva:r.curva_base===null?"":String(r.curva_base),diam:r.diametro===null?"":String(r.diametro),qta:r.quantita};
  });
  S.occhi=occ;S.negozio=S.negozi.find(n=>n.id===o.negozio_id)||S.negozio;
  S.modifica={id:o.id,rif:o.riferimento,pre:{tipo:o.tipo,cog:o.cognome_cliente,nom:o.nome_cliente,cod:o.codice_cliente_focus,forn:o.numero_fornitura,note:o.note}};
  S.tab="nuovo";render();
}
async function annullaOrdine(id){
  if(!confirm("Annullare questo ordine?"))return;
  const {error}=await sb.rpc("annulla_ordine",{p_id:id});
  if(error)alert(/ORDINE_BLOCCATO/.test(error.message)?"Non annullabile: la sede ha già preso in carico l'ordine.":error.message);
  listaOrdini();
}

const STATI={inviato:"Inviato",preso_in_carico:"Preso in carico",ordinato_fornitore:"Ordinato al fornitore",arrivato_sede:"Arrivato in sede",in_partenza_giro:"In partenza col giro",consegnato_negozio:"Consegnato al negozio",evaso_da_deposito:"Evaso da deposito",annullato:"Annullato"};
async function listaOrdini(){
  let q=sb.from("ordini").select("id,riferimento,tipo,cliente_rif,codice_cliente_focus,numero_fornitura,stato,creato_il,negozio_id,righe_ordine(occhio,quantita,unita,fuori_catalogo,sfera,cilindro,asse,addizione,curva_base,diametro,prodotto_id,fornitore_id,prodotti(modello,marchio)),note,nome_cliente,cognome_cliente,modificato_il,eventi_ordine(stato,quando)").order("creato_il",{ascending:false}).limit(40);

   <td>${o.riferimento}<div class="mut">${(S.negozi.find(n=>n.id===o.negozio_id)||{}).nome||""} · ${new Date(o.creato_il).toLocaleDateString("it-IT")}</div></td>
   <td>${o.cliente_rif||""}<div class="mut">${o.codice_cliente_focus?"cod. "+o.codice_cliente_focus:""}${o.numero_fornitura?" · forn. "+o.numero_fornitura:""}</div></td>
   <td>${["DX","SX"].map(oc=>(o.righe_ordine||[]).filter(r=>r.occhio===oc).map(r=>`<div style="margin-bottom:4px"><b>${oc}</b> ${r.prodotti?(r.prodotti.marchio?r.prodotti.marchio+" ":"")+r.prodotti.modello:""}${r.fuori_catalogo?' <span class="pill" style="color:var(--warn);border-color:var(--warn)">parametri liberi</span>':""}<br>Sf ${fmtS(r.sfera)}${r.cilindro!==null&&r.cilindro!==undefined?` · Cil ${fmtS(r.cilindro)} · Asse ${r.asse}°`:""}${r.addizione?` · Add ${r.addizione}`:""}<br>BC ${r.curva_base||"—"} · Ø ${r.diametro||"—"} · ${r.unita==="lenti"?"Lenti singole":"Confezioni"}: ${r.quantita}</div>`).join("")).join("")}${o.note?`<div class="mut">Note: ${o.note}</div>`:""}</td>
   <td><span class="pill">${STATI[o.stato]||o.stato}</span>${o.modificato_il?`<div class="mut">modificato ${new Date(o.modificato_il).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>`:""}
     ${S.profilo.ruolo!=="negozio"?`<div class="mut">${(o.eventi_ordine||[]).sort((a,b)=>new Date(a.quando)-new Date(b.quando)).map(e=>`${STATI[e.stato]||e.stato} ${fmtT(e.quando)}`).join(" → ")}</div>
       <div style="display:flex;gap:6px;margin-top:4px"><select id="st${o.id}">${[...FLUSSO,"evaso_da_deposito","annullato"].map(st=>`<option value="${st}" ${st===o.stato?"selected":""}>${STATI[st]}</option>`).join("")}</select><button class="small" onclick="cambiaStato(${o.id})">Aggiorna stato</button></div>`:o.stato==="inviato"?`<div class="mut">Modificabile finché la sede non lo prende in carico</div><div style="display:flex;gap:6px;margin-top:4px"><button class="small" onclick="modificaOrdine(${o.id})">Modifica</button><button class="small sec" onclick="annullaOrdine(${o.id})">Annulla</button></div>`:(o.stato==="annullato"?"":`<div class="mut">Non modificabile</div>`)}</td></tr>`).join("")+`</table>`;
}

const FLUSSO=["inviato","preso_in_carico","ordinato_fornitore","arrivato_sede","in_partenza_giro","consegnato_negozio"];
const FLUSSO_DEP=["inviato","preso_in_carico","evaso_da_deposito"];
const fmtS=v=>v===null||v===undefined?"":(v>0?"+":"")+Number(v).toFixed(2);
const esc=v=>String(v===null||v===undefined?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chip=(v,lab)=>v===null||v===undefined||v===""?`<span class="chip off">—</span>`:`<button type="button" class="chip" data-cp="${esc(v)}" title="Copia">${esc(lab===undefined?v:lab)}</button>`;
const fld=(l,v,lab)=>`<span class="fl"><span class="lb">${l}</span>${chip(v,lab)}</span>`;
const fmtT=d=>new Date(d).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const paramTxt=r=>`Sf ${fmtS(r.sfera)}${r.cilindro!==null&&r.cilindro!==undefined?` · Cil ${fmtS(r.cilindro)} · Ax ${r.asse}°`:""}${r.addizione?` · Add ${esc(r.addizione)}`:""} · BC ${r.curva_base??"—"} · Ø ${r.diametro??"—"} · ${r.unita==="lenti"?r.quantita+(r.quantita==1?" lente singola":" lenti singole"):"×"+r.quantita}`;
function copiaTesto(t,el){
  const ok=()=>{if(el){el.classList.add("ok");setTimeout(()=>el.classList.remove("ok"),600)}};
  const fb=()=>{const x=document.createElement("textarea");x.value=t;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){}x.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}
document.addEventListener("click",ev=>{const c=ev.target.closest("[data-cp]");if(c)copiaTesto(c.dataset.cp,c)});
const sigC=d=>JSON.stringify(d.map(o=>[o.id,o.stato,o.modificato_il,(o.righe_ordine||[]).map(r=>[r.id,r.ordinata_il]).sort((x,y)=>x[0]-y[0])]));
let __cenSig="",__cenTimer=null;
async function caricaCentrale(){
  const {data,error}=await sb.from("ordini").select("*,righe_ordine(*,prodotti(modello,marchio,su_misura,durata),fornitori(nome)),eventi_ordine(stato,quando)").not("stato","in","(consegnato_negozio,evaso_da_deposito,annullato)").order("creato_il");
  return {data:data||[],error};
}
async function vistaCentrale(){
  const box=$("#cen");if(!box)return;
  box.innerHTML='<div class="card">Caricamento…</div>';
  const {data,error}=await caricaCentrale();
  if(error){box.innerHTML=`<div class="msg err">${error.message}</div>`;return}
  S.cen=data;__cenSig=sigC(data);disegnaCentrale();
  clearInterval(__cenTimer);
  __cenTimer=setInterval(async()=>{
    if(S.tab!=="centrale"||!$("#cen")){clearInterval(__cenTimer);return}
    const r=await caricaCentrale();if(r.error)return;
    const g=sigC(r.data);if(g!==__cenSig){S.cen=r.data;__cenSig=g;disegnaCentrale()}
  },30000);
}
function rigaLavoro(o,r){
  const done=!!r.ordinata_il;
  const modello=r.prodotti?((r.prodotti.marchio?r.prodotti.marchio+" ":"")+r.prodotti.modello):"";
  const modCopy=r.prodotti?r.prodotti.modello:"";
  const tutta=[modCopy,fmtS(r.sfera),r.cilindro!==null&&r.cilindro!==undefined?fmtS(r.cilindro):"",r.asse??"",r.addizione||"",r.curva_base??"",r.diametro??"",r.quantita].join("\t");
  return `<div class="lr ${done?"done":""} ${r.fuori_catalogo?"vf":""}">
    <button class="small ${done?"sec":"go"}" onclick="toggleRiga(${r.id})">${done?"↺ Annulla":"✓ Inserita"}</button>
    <b>${r.occhio}</b> ${chip(modCopy,modello)}${r.fuori_catalogo?' <span class="pill w">parametri da verificare</span>':""}
    ${fld("Sf",fmtS(r.sfera))}${r.cilindro!==null&&r.cilindro!==undefined?fld("Cil",fmtS(r.cilindro))+fld("Asse",r.asse,r.asse+"°"):""}${r.addizione?fld("Add",r.addizione):""}
    ${fld("BC",r.curva_base)}${fld("Ø",r.diametro)}${fld(r.unita==="lenti"?"Lenti":"Conf.",r.quantita)}
    <button class="small sec" data-cp="${esc(tutta)}" title="Copia l'intera riga separata da tab">Copia riga</button></div>`;
}
function disegnaCentrale(){
  const box=$("#cen");if(!box)return;
  const y=window.scrollY;
  if(!S.cen.some(o=>o.stato==="inviato"||o.stato==="preso_in_carico")){box.innerHTML='<div class="card">Nessun ordine da lavorare. Gli ordini già inviati ai fornitori sono in "Tutti gli ordini".</div>';return}
  const perF={};
  S.cen.filter(o=>o.stato==="inviato"||o.stato==="preso_in_carico").forEach(o=>(o.righe_ordine||[]).forEach(r=>{(perF[r.fornitore_id]=perF[r.fornitore_id]||[]).push({o,r})}));
  let h="";
  const nfc=S.cen.reduce((n,o)=>n+(o.righe_ordine||[]).filter(r=>r.fuori_catalogo).length,0);
  if(nfc)h+=`<div class="msg warn"><b>${nfc} righe con parametri da verificare</b> (evidenziate in giallo): non sono stati presi dal catalogo ma scritti dal negozio. Controlla la nota dell'ordine; poi aggiorna le regole del catalogo.</div>`;
  Object.keys(perF).sort((a,b)=>((S.fornitori.find(f=>f.id==a)||{}).nome||"").localeCompare((S.fornitori.find(f=>f.id==b)||{}).nome||"")).forEach(fid=>{
    const f=S.fornitori.find(x=>x.id==fid)||{nome:"?"};
    const tutte=perF[fid];
    const lav=tutte.filter(x=>x.o.stato==="preso_in_carico"),nuovi=tutte.filter(x=>x.o.stato==="inviato");
    const conf=tutte.filter(x=>x.r.unita!=="lenti").reduce((n,x)=>n+(x.r.quantita||0),0);
    const lenti=tutte.filter(x=>x.r.unita==="lenti").reduce((n,x)=>n+(x.r.quantita||0),0);
    const sotto=f.minimo_confezioni&&conf<f.minimo_confezioni;
    h+=`<div class="card"><h2>${esc(f.nome)} <span class="pill">${conf} confezioni</span>${lenti?` <span class="pill">+ ${lenti} lenti singole</span>`:""} <span class="pill">${f.destinazione==="negozio"?"spedisce al negozio":"spedisce al Deposito"}</span></h2>
    ${f.minimo_confezioni?`<div class="msg ${sotto?"warn":"ok"}">Minimo ${f.minimo_confezioni} confezioni: ${sotto?"ancora sotto, conviene aspettare":"raggiunto"}${f.verificato?"":" (dato da verificare)"}</div>`:""}`;
    if(lav.length){
      const fatte=lav.filter(x=>x.r.ordinata_il).length;
      h+=`<div class="sec-h">In lavorazione (bloccati per i negozi) · ${fatte}/${lav.length} righe inserite</div>`;
      const gr={};
      lav.forEach(x=>{const o=x.o;const k=o.tipo==="scorta_negozio"||!o.codice_cliente_focus?"o"+o.id:o.negozio_id+"|"+o.codice_cliente_focus;(gr[k]=gr[k]||[]).push(x)});
      Object.values(gr).sort((a,b)=>(a[0].o.cliente_rif||"~").localeCompare(b[0].o.cliente_rif||"~")).forEach(g=>{
        const o=g[0].o;const neg=(S.negozi.find(n=>n.id===o.negozio_id)||{}).nome||"";
        const ords=[...new Map(g.map(x=>[x.o.id,x.o])).values()];
        h+=`<div class="grp"><div class="grp-h">
          ${o.cognome_cliente?`${fld("Cognome",o.cognome_cliente)}${fld("Nome",o.nome_cliente)}${fld("Cod. Focus",o.codice_cliente_focus)}`:`<b>Scorta negozio</b>`}
          ${o.numero_fornitura?fld("N. fornitura",o.numero_fornitura):""}
          <span class="mut">${esc(neg)} · ${ords.map(x=>x.riferimento).join(", ")}</span> <span class="pill">${o.tipo==="prova"?"prova":o.tipo==="vendita_cliente"?"vendita":"scorta"}</span>
          ${ords.some(x=>x.modificato_il)?'<span class="pill w">modificato dal negozio</span>':""}
          ${ords.map(x=>`<button class="small sec" onclick="sbloccaOrdine(${x.id})" title="Rimette l'ordine in attesa: il negozio potrà modificarlo">Sblocca ${x.riferimento.slice(-5)}</button>`).join("")}</div>
          ${ords.filter(x=>x.note).map(x=>`<div class="mut">Nota ${x.riferimento.slice(-5)}: ${esc(x.note)}</div>`).join("")}
          ${g.sort((a,b)=>a.r.occhio.localeCompare(b.r.occhio)).map(x=>rigaLavoro(x.o,x.r)).join("")}</div>`;
      });
      h+=`<button class="go" ${fatte===lav.length?"":"disabled"} onclick="segnaInviato(${fid})">Segna ordine ${esc(f.nome)} inviato${fatte===lav.length?"":` (mancano ${lav.length-fatte} righe)`}</button>`;
    }
    if(nuovi.length){
      h+=`<div class="sec-h">Nuovi, in attesa (i negozi possono ancora modificarli) · ${nuovi.length} righe</div>`;
      h+=`<table>`+nuovi.map(({o,r})=>`<tr class="${r.fuori_catalogo?"vf":""}"><td>${o.riferimento}<div class="mut">${esc((S.negozi.find(n=>n.id===o.negozio_id)||{}).nome||"")} · ${esc(o.cliente_rif||"")} ${o.codice_cliente_focus?"· cod. "+esc(o.codice_cliente_focus):""}${o.modificato_il?` · <b>modificato ${fmtT(o.modificato_il)}</b>`:""}</div></td>
        <td>${r.occhio} · ${esc(r.prodotti?r.prodotti.modello:"")}${r.fuori_catalogo?' <span class="pill w">da verificare</span>':""}</td><td>${paramTxt(r)}</td></tr>`).join("")+`</table>`;
      const nord=new Set(nuovi.map(x=>x.o.id)).size;
      h+=`<p><button onclick="inizia(${fid})">Inizia ordine ${esc(f.nome)} (${nord} ${nord===1?"ordine":"ordini"}): blocca le modifiche dei negozi</button></p>`;
    }
    h+=`</div>`;
  });
  box.innerHTML=h;
  window.scrollTo(0,y);
}
function trovaRiga(id){for(const o of S.cen)for(const r of (o.righe_ordine||[]))if(r.id===id)return r;return null}
async function toggleRiga(id){
  const r=trovaRiga(id);if(!r)return;
  const nuovo=r.ordinata_il?null:new Date().toISOString();
  const {data,error}=await sb.from("righe_ordine").update({ordinata_il:nuovo,ordinata_da:nuovo?S.uid:null}).eq("id",id).select("ordinata_il").single();
  if(error){alert(error.message);return}
  r.ordinata_il=data.ordinata_il;__cenSig=sigC(S.cen);disegnaCentrale();
}
async function inizia(fid){
  const f=S.fornitori.find(x=>x.id==fid)||{};
  if(!confirm(`Iniziare l'ordine ${f.nome}?\nDa questo momento i negozi non potranno più modificare questi ordini.`))return;
  const {data,error}=await sb.rpc("prendi_in_carico",{p_fornitore:fid});
  if(error){alert(error.message);return}
  vistaCentrale();
}
async function sbloccaOrdine(id){
  const o=S.cen.find(x=>x.id===id);if(!o)return;
  if((o.righe_ordine||[]).some(r=>r.ordinata_il)&&!confirm("Alcune righe risultano già inserite. Sbloccando, i segni 'Inserita' di questo ordine vengono azzerati. Procedere?"))return;
  const {error}=await sb.from("ordini").update({stato:"inviato"}).eq("id",id);
  if(error){alert(error.message);return}
  await sb.from("righe_ordine").update({ordinata_il:null,ordinata_da:null}).eq("ordine_id",id);
  vistaCentrale();
}
async function segnaInviato(fid){
  const ids=S.cen.filter(o=>o.stato==="preso_in_carico"&&(o.righe_ordine||[]).some(r=>r.fornitore_id==fid)&&(o.righe_ordine||[]).every(r=>r.ordinata_il)).map(o=>o.id);
  if(!ids.length)return;
  const {error}=await sb.from("ordini").update({stato:"ordinato_fornitore"}).in("id",ids);
  if(error){alert(error.message);return}
  vistaCentrale();
}
async function cambiaStato(id){
  const v=$("#st"+id).value;
  const {error}=await sb.from("ordini").update({stato:v}).eq("id",id);
  if(error){alert(error.message);return}
  if(S.tab==="miei")listaOrdini();else vistaCentrale();
}
start();
</script>
